<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin — SCARLS SYSTEMS</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/scarls-logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{ background:var(--black); }
  .admin-wrap{ max-width:640px; margin:0 auto; padding:20px 16px calc(40px + env(safe-area-inset-bottom)); }

  /* ---------- Password gate ---------- */
  .gate{
    min-height:100svh; min-height:100dvh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:32px 20px; text-align:center; gap:14px;
  }
  .gate h1{ font-family:var(--font-display); color:var(--white); font-size:22px; }
  .gate input{
    width:100%; max-width:280px; background:var(--graphite-1); border:1px solid var(--line);
    color:var(--white); padding:12px 14px; font-size:14px; font-family:inherit; border-radius:8px;
  }
  .gate input:focus{ outline:none; border-color:var(--accent-blue); }
  .gate button{
    font-family:var(--font-mono); font-size:12.5px; padding:11px 24px; border-radius:8px;
    background:var(--white); color:var(--black); border:none; cursor:pointer;
  }
  .gate .err{ color:#ff8b8b; font-size:12.5px; min-height:16px; }

  /* ---------- Header ---------- */
  .admin-header{ display:flex; align-items:center; justify-content:space-between; padding:6px 2px 20px; }
  .admin-header h1{ font-family:var(--font-display); color:var(--white); font-size:19px; }
  .admin-header span{ font-family:var(--font-mono); font-size:11px; color:var(--silver-dim); }

  /* ---------- Section switch (Projects / Catalog) ---------- */
  .section-switch{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .section-switch button{
    flex:1; font-family:var(--font-mono); font-size:12px; letter-spacing:.03em; text-transform:uppercase;
    padding:10px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--silver);
    cursor:pointer;
  }
  .section-switch button.active{ background:var(--white); color:var(--black); border-color:var(--white); }

  /* ---------- Status / category tabs ---------- */
  .tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:14px; -webkit-overflow-scrolling:touch; }
  .tabs button{
    flex:0 0 auto; font-family:var(--font-mono); font-size:11px; letter-spacing:.03em; text-transform:uppercase;
    padding:7px 13px; border-radius:100px; border:1px solid var(--line); background:transparent; color:var(--silver);
    cursor:pointer; white-space:nowrap;
  }
  .tabs button.active{ background:var(--white); color:var(--black); border-color:var(--white); }

  /* ---------- Cards (projects + services share this look) ---------- */
  .project-card{
    border:1px solid var(--line-soft); background:var(--graphite-0); border-radius:12px;
    padding:16px; margin-bottom:14px;
  }
  .project-card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px; }
  .project-card-top h3{ font-family:var(--font-display); color:var(--white); font-size:15.5px; line-height:1.3; }
  .project-card-top p{ color:var(--silver-dim); font-size:12px; margin-top:2px; }
  .badge{
    flex:0 0 auto; font-family:var(--font-mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase;
    padding:4px 9px; border-radius:100px; border:1px solid var(--line); color:var(--silver); margin-left:6px;
  }
  .badge.paid{ color:#ffd479; border-color:#4a3f22; }
  .badge.in_progress{ color:#7fb2ff; border-color:#22344a; }
  .badge.review{ color:#c98bff; border-color:#3a224a; }
  .badge.delivered{ color:#7ee0a8; border-color:#22452f; }
  .badge.qualified{ color:#7ee0a8; border-color:#22452f; }
  .badge.needs_more_information{ color:#ffd479; border-color:#4a3f22; }
  .badge.human_review_required{ color:#ff8b8b; border-color:#4a2222; }
  .badge.awaiting_admin{ color:#ffd479; border-color:#4a3f22; }
  .badge.approved{ color:#7ee0a8; border-color:#22452f; }
  .badge.rejected{ color:#ff8b8b; border-color:#4a2222; }
  .badge.below_minimum{ color:#8a8f98; border-color:#33363c; }

  .project-meta{ font-size:12.5px; color:var(--silver); line-height:1.7; margin-bottom:12px; }
  .project-meta b{ color:var(--off-white); }

  .field{ margin-bottom:10px; }
  .field label{
    display:block; font-family:var(--font-mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--silver-dim); margin-bottom:5px;
  }
  .field select, .field input, .field textarea{
    width:100%; background:var(--graphite-1); border:1px solid var(--line); color:var(--white);
    padding:9px 11px; font-size:13.5px; font-family:inherit; border-radius:7px;
  }
  .field select:focus, .field input:focus, .field textarea:focus{ outline:none; border-color:var(--accent-blue); }
  .field textarea{ resize:vertical; min-height:52px; }
  .field.checks{ display:flex; flex-wrap:wrap; gap:14px; }
  .field.checks label{
    display:flex; align-items:center; gap:6px; font-family:inherit; text-transform:none;
    letter-spacing:0; font-size:13px; color:var(--silver); margin-bottom:0;
  }
  .field.checks input{ width:auto; }

  .project-card-actions{ display:flex; align-items:center; gap:10px; margin-top:12px; }
  .save-btn{
    font-family:var(--font-mono); font-size:12px; padding:9px 18px; border-radius:7px;
    background:var(--white); color:var(--black); border:none; cursor:pointer;
  }
  .save-btn:disabled{ opacity:.5; cursor:default; }
  .save-status{ font-size:11.5px; color:var(--silver-dim); }
  .save-status.ok{ color:#7ee0a8; }
  .save-status.err{ color:#ff8b8b; }

  .empty-state{ text-align:center; color:var(--silver-dim); font-size:13px; padding:40px 20px; }

  .add-btn{
    display:block; width:100%; font-family:var(--font-mono); font-size:12.5px; padding:12px;
    border-radius:8px; border:1px dashed var(--line); background:transparent; color:var(--silver);
    cursor:pointer; margin-bottom:14px;
  }

  /* ---------- Service form sheet ---------- */
  .scarls-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end;
    justify-content:center; z-index:200;
  }
  .scarls-overlay.is-open{ display:flex; }
  .scarls-sheet{
    width:100%; max-width:640px; max-height:92vh; overflow-y:auto; background:var(--graphite-0);
    border:1px solid var(--line-soft); border-radius:16px 16px 0 0; padding:18px 16px calc(24px + env(safe-area-inset-bottom));
  }
  .sheet-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .sheet-header h2{ font-family:var(--font-display); color:var(--white); font-size:17px; }
  .sheet-header button{
    background:transparent; border:none; color:var(--silver); font-size:22px; line-height:1; cursor:pointer;
    padding:4px 8px;
  }

  .pkg-row{
    border:1px solid var(--line-soft); border-radius:9px; padding:10px; margin-bottom:8px;
    display:flex; flex-direction:column; gap:6px;
  }
  .pkg-row input, .pkg-row textarea{
    width:100%; background:var(--graphite-1); border:1px solid var(--line); color:var(--white);
    padding:8px 10px; font-size:13px; font-family:inherit; border-radius:6px;
  }
  .pkg-row textarea{ resize:vertical; min-height:40px; }
  .pkg-row label{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--silver); }
  .pkg-remove-btn{
    align-self:flex-start; background:transparent; border:none; color:#ff8b8b; font-family:var(--font-mono);
    font-size:11px; cursor:pointer; padding:2px 0;
  }
</style>
</head>
<body>

<div id="gate" class="gate">
  <h1>SCARLS Admin</h1>
  <input type="password" id="gatePassword" placeholder="Admin password" autocomplete="current-password">
  <button type="button" id="gateBtn">Enter</button>
  <p class="err" id="gateErr"></p>
</div>

<div id="adminWrap" class="admin-wrap" style="display:none;">
  <div class="admin-header">
    <h1 id="sectionTitle">Projects</h1>
    <span id="projectCount">—</span>
  </div>

  <div class="section-switch" id="sectionSwitch">
    <button type="button" data-section="projects" class="active">Projects</button>
    <button type="button" data-section="assessments">Assessments</button>
    <button type="button" data-section="budget">Budget Requests</button>
    <button type="button" data-section="aiquotes">AI Quotes</button>
    <button type="button" data-section="catalog">Catalog</button>
    <button type="button" data-section="discounts">Discounts</button>
    <button type="button" data-section="sales">Sales</button>
    <button type="button" data-section="tickets">Tickets</button>
    <button type="button" data-section="manualpay">Manual Payments</button>
  </div>

  <div id="projectsSection">
    <div class="tabs" id="tabs"></div>
    <div id="projectList"></div>
  </div>

  <div id="assessmentsSection" style="display:none;">
    <div id="assessmentList"></div>
  </div>

  <div id="budgetSection" style="display:none;">
    <div id="budgetList"></div>
  </div>

  <div id="aiquotesSection" style="display:none;">
    <div id="aiQuoteList"></div>
  </div>

  <div id="catalogSection" style="display:none;">
    <button type="button" class="add-btn" id="addServiceBtn">+ Add Service</button>
    <div class="tabs" id="catTabs"></div>
    <div id="serviceList"></div>
  </div>

  <div id="discountsSection" style="display:none;">
    <button type="button" class="add-btn" id="addDiscountBtn">+ Add Discount Code</button>
    <div id="discountList"></div>
  </div>

 <div id="salesSection" style="display:none;">
    <div class="field" style="margin-bottom:16px;">
      <label>Popup frequency (how often the sale popup shows to visitors)</label>
      <select id="popupFrequencySelect">
        <option value="always">Every page load / refresh</option>
        <option value="once_per_session">Once per visit (until they close the tab)</option>
        <option value="hours:1">Once every 1 hour</option>
        <option value="hours:3">Once every 3 hours</option>
        <option value="hours:12">Once every 12 hours</option>
        <option value="hours:24">Once every 24 hours</option>
      </select>
    </div>
    <button type="button" class="add-btn" id="addSaleBtn">+ Add Sale Period</button>
    <div id="saleList"></div>
  </div>

  <div id="ticketsSection" style="display:none;">
    <div class="tabs" id="ticketTabs"></div>
    <div id="ticketList"></div>
  </div>

  <div id="manualpaySection" style="display:none;">
    <div class="tabs" id="manualpayTabs"></div>
    <div id="manualpayList"></div>
  </div>
</div>

<div class="scarls-overlay" id="serviceFormOverlay">
  <div class="scarls-sheet" id="serviceFormSheet">
    <div class="sheet-header">
      <h2 id="serviceFormTitle">Add Service</h2>
      <button type="button" id="serviceFormClose" aria-label="Close">&times;</button>
    </div>
    <div id="serviceFormBody"></div>
  </div>
</div>

<script>
(function () {
  var SCARLS_FORM_ENDPOINT = "https://script.google.com/macros/s/AKfycbyxho_eYGdD2g3OXzc2IzCEh2hqsDeH2Zonoi9RenZanSoz0uqo7uxcqP8rDK0lnC_f/exec";

  // NOTE (migration): Projects now reads/writes through Supabase Edge
  // Functions (admin-list-projects / admin-update-project) instead of
  // the old Apps Script endpoint above — that endpoint no longer has
  // any visibility into orders created since checkout moved to
  // Supabase. Assessments / Budget Requests / AI Quotes / Catalog
  // still use SCARLS_FORM_ENDPOINT for now, pending their own migration.
  var SUPABASE_URL = "https://zpytjifbhaxniuliopvp.supabase.co";
  var SUPABASE_FUNCTIONS_BASE = SUPABASE_URL + "/functions/v1";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpweXRqaWZiaGF4bml1bGlvcHZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyOTMyNjgsImV4cCI6MjEwMzg2OTI2OH0.QFGo9feUbsle_fGxNZvxMaBuRQzS55RKF2_i0oL0LYQ";

  var STATUS_LABELS = { paid: "Paid", in_progress: "In progress", review: "Review", delivered: "Delivered" };

  var gate = document.getElementById('gate');
  var gatePassword = document.getElementById('gatePassword');
  var gateBtn = document.getElementById('gateBtn');
  var gateErr = document.getElementById('gateErr');
  var adminWrap = document.getElementById('adminWrap');
  var sectionTitle = document.getElementById('sectionTitle');
  var countEl = document.getElementById('projectCount');

  var password = sessionStorage.getItem('scarls_admin_pw') || '';

  function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  /* ============================================================
     Gate
     ============================================================ */

  function tryLoad(pw) {
    // UPDATED: now calls the Supabase admin-list-projects function
    // instead of the old Apps Script ?action=adminList endpoint.
    fetch(SUPABASE_FUNCTIONS_BASE + '/admin-list-projects?password=' + encodeURIComponent(pw), {
      headers: {
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'apikey': SUPABASE_ANON_KEY
      }
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (!data || !data.ok) {
          gateErr.textContent = (data && data.error) ? data.error : 'Could not load projects.';
          sessionStorage.removeItem('scarls_admin_pw');
          return;
        }
        password = pw;
        sessionStorage.setItem('scarls_admin_pw', pw);
        allProjects = data.projects || [];
        if (data.statuses && data.statuses.length) statuses = data.statuses;
        gate.style.display = 'none';
        adminWrap.style.display = 'block';
        renderTabs();
        renderList();
      })
      .catch(function () {
        gateErr.textContent = 'Could not reach the server. Check your connection.';
      });
  }

  gateBtn.addEventListener('click', function () {
    var pw = gatePassword.value.trim();
    if (!pw) return;
    gateErr.textContent = '';
    gateBtn.disabled = true;
    gateBtn.textContent = 'Checking…';
    tryLoad(pw);
    setTimeout(function () { gateBtn.disabled = false; gateBtn.textContent = 'Enter'; }, 1200);
  });
  gatePassword.addEventListener('keydown', function (e) { if (e.key === 'Enter') gateBtn.click(); });

  /* ============================================================
     Section switch
     ============================================================ */

  var sectionSwitch = document.getElementById('sectionSwitch');
  var projectsSection = document.getElementById('projectsSection');
  var assessmentsSection = document.getElementById('assessmentsSection');
  var budgetSection = document.getElementById('budgetSection');
  var aiquotesSection = document.getElementById('aiquotesSection');
  var catalogSection = document.getElementById('catalogSection');
  var discountsSection = document.getElementById('discountsSection');
  var salesSection = document.getElementById('salesSection');
  var ticketsSection = document.getElementById('ticketsSection');
  var manualpaySection = document.getElementById('manualpaySection');
  var discountsLoaded = false, salesLoaded = false, ticketsLoaded = false, manualpayLoaded = false;
  var assessmentsLoaded = false;
  var budgetLoaded = false;
  var aiQuotesLoaded = false;

  Array.prototype.forEach.call(sectionSwitch.querySelectorAll('button'), function (btn) {
    btn.addEventListener('click', function () {
      Array.prototype.forEach.call(sectionSwitch.querySelectorAll('button'), function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var section = btn.getAttribute('data-section');
      projectsSection.style.display = section === 'projects' ? '' : 'none';
      assessmentsSection.style.display = section === 'assessments' ? '' : 'none';
      budgetSection.style.display = section === 'budget' ? '' : 'none';
      aiquotesSection.style.display = section === 'aiquotes' ? '' : 'none';
      catalogSection.style.display = section === 'catalog' ? '' : 'none';
      discountsSection.style.display = section === 'discounts' ? '' : 'none';
      salesSection.style.display = section === 'sales' ? '' : 'none';
      ticketsSection.style.display = section === 'tickets' ? '' : 'none';
      manualpaySection.style.display = section === 'manualpay' ? '' : 'none';

      if (section === 'projects') {
        sectionTitle.textContent = 'Projects';
        countEl.textContent = allProjects.length + (allProjects.length === 1 ? ' project' : ' projects');
      } else if (section === 'assessments') {
        sectionTitle.textContent = 'Assessments';
        countEl.textContent = allAssessments.length + (allAssessments.length === 1 ? ' assessment' : ' assessments');
        if (!assessmentsLoaded) loadAssessments();
      } else if (section === 'budget') {
        sectionTitle.textContent = 'Budget Requests';
        countEl.textContent = allBudgetRequests.length + (allBudgetRequests.length === 1 ? ' request' : ' requests');
        if (!budgetLoaded) loadBudgetRequests();
      } else if (section === 'aiquotes') {
        sectionTitle.textContent = 'AI Quotes';
        countEl.textContent = allAiQuotes.length + (allAiQuotes.length === 1 ? ' quote' : ' quotes');
        if (!aiQuotesLoaded) loadAiQuotes();
      } else if (section === 'catalog') {
        sectionTitle.textContent = 'Catalog';
        countEl.textContent = catalogData.services.length + (catalogData.services.length === 1 ? ' service' : ' services');
        if (!catalogLoaded) loadCatalog();
      } else if (section === 'discounts') {
        sectionTitle.textContent = 'Discounts';
        if (!discountsLoaded) loadDiscounts();
      } else if (section === 'sales') {
        sectionTitle.textContent = 'Sale Periods';
        if (!salesLoaded) loadSales();
        loadPopupFrequency();
 
      } else if (section === 'tickets') {
        sectionTitle.textContent = 'Support Tickets';
        if (!ticketsLoaded) loadTickets();
      } else {
        sectionTitle.textContent = 'Manual Payments';
        if (!manualpayLoaded) loadManualPayments();
      }
    });
  });

  /* ============================================================
     PROJECTS
     ============================================================ */

  var tabsEl = document.getElementById('tabs');
  var listEl = document.getElementById('projectList');

  var allProjects = [];
  var statuses = ["paid", "in_progress", "review", "delivered"];
  var activeTab = "all";

  function renderTabs() {
    var tabs = ["all"].concat(statuses);
    tabsEl.innerHTML = tabs.map(function (t) {
      var label = t === "all" ? "All" : (STATUS_LABELS[t] || t);
      return '<button type="button" data-tab="' + t + '" class="' + (t === activeTab ? 'active' : '') + '">' + escapeHtml(label) + '</button>';
    }).join('');
    Array.prototype.forEach.call(tabsEl.querySelectorAll('button'), function (btn) {
      btn.addEventListener('click', function () {
        activeTab = btn.getAttribute('data-tab');
        renderTabs();
        renderList();
      });
    });
  }

  function renderList() {
    var filtered = activeTab === "all" ? allProjects : allProjects.filter(function (p) { return p.status === activeTab; });
    countEl.textContent = filtered.length + (filtered.length === 1 ? ' project' : ' projects');

    if (!filtered.length) {
      listEl.innerHTML = '<div class="empty-state">Nothing here yet.</div>';
      return;
    }

    listEl.innerHTML = filtered.map(function (p) {
      var statusOptions = statuses.map(function (s) {
        return '<option value="' + s + '"' + (s === p.status ? ' selected' : '') + '>' + escapeHtml(STATUS_LABELS[s] || s) + '</option>';
      }).join('');

      return (
        '<div class="project-card" data-id="' + escapeHtml(p.projectId) + '">' +
          '<div class="project-card-top">' +
            '<div>' +
              '<h3>' + escapeHtml(p.fullName) + (p.businessName ? ' · ' + escapeHtml(p.businessName) : '') + '</h3>' +
              '<p>' + escapeHtml(p.serviceName) + (p.packageName ? ' — ' + escapeHtml(p.packageName) : '') + '</p>' +
            '</div>' +
            '<span class="badge ' + escapeHtml(p.status) + '">' + escapeHtml(STATUS_LABELS[p.status] || p.status) + '</span>' +
          '</div>' +
          '<div class="project-meta">' +
            '<b>₦' + Number(p.amount || 0).toLocaleString() + '</b>' + (p.pricingModel === 'subscription' ? '/mo' : '') + '<br>' +
            escapeHtml(p.email) + ' · ' + escapeHtml(p.whatsapp) + '<br>' +
            'Ref: ' + escapeHtml(p.orderReference) +
          '</div>' +
          '<div class="field"><label>Status</label><select class="f-status">' + statusOptions + '</select></div>' +
          '<div class="field"><label>Assigned to</label><input class="f-assignedTo" type="text" value="' + escapeHtml(p.assignedTo || '') + '" placeholder="Intern / team member name"></div>' +
          '<div class="field"><label>Due date</label><input class="f-dueDate" type="date" value="' + escapeHtml(p.dueDate ? String(p.dueDate).slice(0, 10) : '') + '"></div>' +
          '<div class="field"><label>Preview link — shown to the customer during Review</label><input class="f-previewLink" type="text" value="' + escapeHtml(p.previewLink || '') + '" placeholder="Link the customer sees while reviewing (not the final)"></div>' +
          '<div class="field"><label>Delivery link — shown only once status is Delivered</label><input class="f-deliveryLink" type="text" value="' + escapeHtml(p.deliveryLink || '') + '" placeholder="Link to the finished work"></div>' +
          '<div class="field"><label>Notes</label><textarea class="f-notes" placeholder="Internal notes">' + escapeHtml(p.notes || '') + '</textarea></div>' +
          '<div class="project-card-actions">' +
            '<button type="button" class="save-btn">Save</button>' +
            '<span class="save-status"></span>' +
          '</div>' +
        '</div>'
      );
    }).join('');

    Array.prototype.forEach.call(listEl.querySelectorAll('.project-card'), function (card) {
      var saveBtn = card.querySelector('.save-btn');
      var saveStatus = card.querySelector('.save-status');
      saveBtn.addEventListener('click', function () {
        var projectId = card.getAttribute('data-id');
        var payload = {
          password: password,
          projectId: projectId,
          status: card.querySelector('.f-status').value,
          assignedTo: card.querySelector('.f-assignedTo').value.trim(),
          dueDate: card.querySelector('.f-dueDate').value,
          previewLink: card.querySelector('.f-previewLink').value.trim(),
          deliveryLink: card.querySelector('.f-deliveryLink').value.trim(),
          notes: card.querySelector('.f-notes').value.trim()
        };
        saveBtn.disabled = true;
        saveStatus.textContent = 'Saving…';
        saveStatus.className = 'save-status';

        // UPDATED: now calls the Supabase admin-update-project function
        // instead of the old Apps Script endpoint. Note the 'action'
        // field is no longer needed since this function only does one thing.
        fetch(SUPABASE_FUNCTIONS_BASE + '/admin-update-project', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'apikey': SUPABASE_ANON_KEY
          },
          body: JSON.stringify(payload)
        })
          .then(function (res) { return res.json(); })
          .then(function (data) {

  function linesToArray(str) {

  function openServiceForm(id) {
    editingServiceId = id || null;
    var svc = id ? catalogData.services.filter(function (s) { return s.id === id; })[0] : null;
    serviceFormTitle.textContent = svc ? 'Edit Service' : 'Add Service';

    var catOptions = catalogData.categories.slice().sort(function (a, b) { return a.order - b.order; }).map(function (c) {
      return '<option value="' + escapeHtml(c.id) + '"' + (svc && svc.category_id === c.id ? ' selected' : '') + '>' + escapeHtml(c.name) + '</option>';
    }).join('');

  function renderPkgList(packages) {

    pkgListEl.innerHTML = pkgRows.map(function (p) {
      return (
        '<div class="pkg-row">' +
          '<input class="p-name" type="text" placeholder="Package name" value="' + escapeHtml(p.name || '') + '">' +
          '<input class="p-price" type="number" placeholder="Price ₦" value="' + (p.price != null ? p.price : '') + '">' +
          '<input class="p-label" type="text" placeholder="Price label" value="' + escapeHtml(p.price_label || '') + '">' +
          '<textarea class="p-desc" placeholder="Description">' + escapeHtml(p.description || '') + '</textarea>' +
          '<textarea class="p-features" placeholder="Features, one per line">' + escapeHtml((p.features || []).join('\n')) + '</textarea>' +
          '<input class="p-delivery" type="text" placeholder="Delivery time" value="' + escapeHtml(p.delivery_time || '') + '">' +

          '<button type="button" class="pkg-remove-btn">Remove</button>' +

      );
    }).join('');

        pkgRows.splice(idx, 1);

  function addPkgRow() {
    pkgRows.push({ name: '', price: null, price_label: '', description: '', features: [], delivery_time: '', recommended: false, active: true });
    renderPkgList(pkgRows);
  }

  function collectPkgRows() {
    var rows = document.querySelectorAll('#pkgList .pkg-row');
    return Array.prototype.map.call(rows, function (row) {
      return {
        name: row.querySelector('.p-name').value.trim(),
        price: row.querySelector('.p-price').value ? Number(row.querySelector('.p-price').value) : null,
        price_label: row.querySelector('.p-label').value.trim(),
        description: row.querySelector('.p-desc').value.trim(),
        features: linesToArray(row.querySelector('.p-features').value),
        delivery_time: row.querySelector('.p-delivery').value.trim(),
        recommended: row.querySelector('.p-recommended').checked,
        active: true

    }).filter(function (p) { return p.name; });

    }

    var svcPayload = {
      id: editingServiceId || undefined,
      name: name, category_id: category_id,
      short_description: document.getElementById('f_short').value.trim(),
      full_description: document.getElementById('f_full').value.trim(),
      who_for: document.getElementById('f_wholeFor').value.trim(),
      included: linesToArray(document.getElementById('f_included').value),

      deliverables: linesToArray(document.getElementById('f_deliverables').value),
      requirements: linesToArray(document.getElementById('f_requirements').value),
      pricing_model: document.getElementById('f_pricingModel').value,
      starting_price: document.getElementById('f_startingPrice').value ? Number(document.getElementById('f_startingPrice').value) : null,
      price_label: document.getElementById('f_priceLabel').value.trim(),
      subscription_price: document.getElementById('f_subPrice').value ? Number(document.getElementById('f_subPrice').value) : null,

      active: document.getElementById('f_active').checked,
      featured: document.getElementById('f_featured').checked,
      coming_soon: document.getElementById('f_comingSoon').checked,
      requires_consultation: document.getElementById('f_requiresConsultation').checked,
      requires_budget_check: document.getElementById('f_requiresBudgetCheck').checked,
      min_budget: document.getElementById('f_minBudget').value ? Number(document.getElementById('f_minBudget').value) : null,
      min_budget_period: document.getElementById('f_minBudgetPeriod').value,
      requires_ai_quote: document.getElementById('f_requiresAiQuote').checked,
      manual_payment_enabled: document.getElementById('f_manualPaymentEnabled').checked,
      quote_cpl_naira: document.getElementById('f_quoteCpl').value ? Number(document.getElementById('f_quoteCpl').value) : null,
      quote_leads_min_per_day: document.getElementById('f_quoteLeadsMin').value ? Number(document.getElementById('f_quoteLeadsMin').value) : null,
      quote_leads_max_per_day: document.getElementById('f_quoteLeadsMax').value ? Number(document.getElementById('f_quoteLeadsMax').value) : null,
      quote_min_daily_spend: document.getElementById('f_quoteMinDaily').value ? Number(document.getElementById('f_quoteMinDaily').value) : null,
      quote_max_auto_days: document.getElementById('f_quoteMaxDays').value ? Number(document.getElementById('f_quoteMaxDays').value) : null,
      quote_max_auto_total_naira: document.getElementById('f_quoteMaxTotal').value ? Number(document.getElementById('f_quoteMaxTotal').value) : null,
      quote_fee_tiers: document.getElementById('f_quoteFeeTiers').value.trim(),
      packages: collectPkgRows()
    };

    saveBtn.disabled = true;
    saveStatus.textContent = 'Saving…';
    saveStatus.className = 'save-status';

    // UPDATED: now calls the Supabase admin-save-service function.
    fetch(SUPABASE_FUNCTIONS_BASE + '/admin-save-service', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'apikey': SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ password: password, service: svcPayload })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        saveBtn.disabled = false;
        if (data && data.ok) {
          saveStatus.textContent = 'Saved';
          saveStatus.className = 'save-status ok';
          setTimeout(function () {
            closeServiceForm();
            loadCatalog();
          }, 400);
        } else {
          saveStatus.textContent = (data && data.error) || 'Could not save.';
          saveStatus.className = 'save-status err';
        }
      })
      .catch(function () {
        saveBtn.disabled = false;
        saveStatus.textContent = 'Network error — try again.';
        saveStatus.className = 'save-status err';
      });

     DISCOUNTS
     ============================================================ */
  var discountListEl = document.getElementById('discountList');
  var allDiscounts = [];

  function loadDiscounts() {
    discountListEl.innerHTML = '<div class="empty-state">Loading…</div>';
    fetch(SUPABASE_FUNCTIONS_BASE + '/admin-list-discounts?password=' + encodeURIComponent(password), {
      headers: { 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'apikey': SUPABASE_ANON_KEY }
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (!data || !data.ok) { discountListEl.innerHTML = '<div class="empty-state">' + escapeHtml((data && data.error) || 'Could not load discounts.') + '</div>'; return; }
        discountsLoaded = true;
        allDiscounts = data.discounts || [];
        renderDiscountList();
      })
      .catch(function () { discountListEl.innerHTML = '<div class="empty-state">Could not reach the server.</div>'; });
  }

  function renderDiscountList() {
    if (!allDiscounts.length) { discountListEl.innerHTML = '<div class="empty-state">No discount codes yet.</div>'; return; }
    discountListEl.innerHTML = allDiscounts.map(function (d) {
      var valueLabel = d.type === 'percent' ? d.value + '% off' : '₦' + Number(d.value).toLocaleString() + ' off';
      var usageLabel = (d.usage_limit != null) ? (d.used_count + ' / ' + d.usage_limit + ' used') : (d.used_count + ' used');
      return '<div class="project-card" data-id="' + escapeHtml(d.id) + '">' +
        '<div class="project-card-top"><div><h3>' + escapeHtml(d.code) + '</h3><p>' + escapeHtml(valueLabel) + ' · ' + escapeHtml(usageLabel) + '</p></div>' +
        '<span class="badge">' + (d.active ? 'Active' : 'Inactive') + '</span></div>' +
        '<div class="project-card-actions">' +
        '<button type="button" class="save-btn disc-edit-btn">Edit</button>' +
        '<button type="button" class="save-btn disc-delete-btn" style="background:#3a1f1f;color:#ff8b8b;">Delete</button>' +
        '</div></div>';
    }).join('');
    Array.prototype.forEach.call(discountListEl.querySelectorAll('.project-card'), function (card) {
      var id = card.getAttribute('data-id');
      card.querySelector('.disc-edit-btn').addEventListener('click', function () { openDiscountForm(allDiscounts.filter(function (d) { return d.id === id; })[0]); });
      card.querySelector('.disc-delete-btn').addEventListener('click', function () {
        var d = allDiscounts.filter(function (x) { return x.id === id; })[0];
        if (!confirm('Delete code "' + (d ? d.code : id) + '"?')) return;
        fetch(SUPABASE_FUNCTIONS_BASE + '/admin-delete-discount', {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'apikey': SUPABASE_ANON_KEY },
          body: JSON.stringify({ password: password, id: id })
        }).then(function (r) { return r.json(); }).then(function (data) {
          if (data && data.ok) { allDiscounts = allDiscounts.filter(function (x) { return x.id !== id; }); renderDiscountList(); }
          else alert((data && data.error) || 'Could not delete.');
        });
      });
    });
  }

  function openDiscountForm(d) {
    var code = prompt('Discount code (e.g. BF25):', d ? d.code : '');
    if (!code) return;
    var typeChoice = prompt('Type: "percent" or "fixed"', d ? d.type : 'percent');
    if (typeChoice !== 'percent' && typeChoice !== 'fixed') return;
    var value = prompt('Value (percent number, e.g. 20, or naira amount off):', d ? d.value : '');
    if (value == null || value === '') return;
    var activeChoice = confirm('Make this code ACTIVE now? (Cancel = inactive)');

    fetch(SUPABASE_FUNCTIONS_BASE + '/admin-save-discount', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ password: password, discount: { id: d ? d.id : undefined, code: code, type: typeChoice, value: Number(value), active: activeChoice, applies_to: 'all' } })
    }).then(function (r) { return r.json(); }).then(function (data) {
      if (data && data.ok) loadDiscounts(); else alert((data && data.error) || 'Could not save.');
    });
  }
  document.getElementById('addDiscountBtn').addEventListener('click', function () { openDiscountForm(null); });

  function renderSaleList() {
    if (!allSales.length) { saleListEl.innerHTML = '<div class="empty-state">No sale periods yet.</div>'; return; }
    saleListEl.innerHTML = allSales.map(function (s) {
      return '<div class="project-card" data-id="' + escapeHtml(s.id) + '">' +
        '<div class="project-card-top"><div><h3>' + escapeHtml(s.name) + '</h3><p>' + escapeHtml(String(s.percent_off)) + '% off · ' + escapeHtml(s.applies_to) + '</p></div>' +
        '<span class="badge">' + (s.active ? 'ACTIVE' : 'Off') + '</span></div>' +
        '<div class="project-card-actions">' +
        '<button type="button" class="save-btn sale-toggle-btn">' + (s.active ? 'Turn Off' : 'Turn On') + '</button>' +
        '<button type="button" class="save-btn sale-edit-btn">Edit</button>' +
        '</div></div>';
    }).join('');
    Array.prototype.forEach.call(saleListEl.querySelectorAll('.project-card'), function (card) {
      var id = card.getAttribute('data-id');
      var s = allSales.filter(function (x) { return x.id === id; })[0];
      card.querySelector('.sale-toggle-btn').addEventListener('click', function () { saveSale(Object.assign({}, s, { id: id, active: !s.active })); });
      card.querySelector('.sale-edit-btn').addEventListener('click', function () { openSaleForm(s); });
    });
  }

  function saveSale(payload) {
    fetch(SUPABASE_FUNCTIONS_BASE + '/admin-save-sale', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ password: password, sale: payload })
    }).then(function (r) { return r.json(); }).then(function (data) {
      if (data && data.ok) loadSales(); else alert((data && data.error) || 'Could not save.');
    });
  }

  function openSaleForm(s) {
    var name = prompt('Sale name (e.g. "Black Friday 2026"):', s ? s.name : '');
    if (!name) return;
    var percent = prompt('Percent off (e.g. 25):', s ? s.percent_off : '');
    if (percent == null || percent === '') return;
    var starts = prompt('Start date/time (YYYY-MM-DDTHH:MM, blank = starts now):', s && s.starts_at ? s.starts_at.slice(0, 16) : '');
    var ends = prompt('End date/time (YYYY-MM-DDTHH:MM, blank = no end):', s && s.ends_at ? s.ends_at.slice(0, 16) : '');
    var activeChoice = confirm('Make this sale ACTIVE right now? (Cancel = save but keep off)');
    saveSale({
      id: s ? s.id : undefined, name: name, percent_off: Number(percent), active: activeChoice,
      starts_at: starts || null, ends_at: ends || null, applies_to: 'all'
    });
  }
  document.getElementById('addSaleBtn').addEventListener('click', function () { openSaleForm(null); });

    ticketListEl.innerHTML = '<div class="empty-state">Loading…</div>';
    fetch(SUPABASE_FUNCTIONS_BASE + '/admin-list-tickets?password=' + encodeURIComponent(password), {
      headers: { 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'apikey': SUPABASE_ANON_KEY }
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (!data || !data.ok) { ticketListEl.innerHTML = '<div class="empty-state">' + escapeHtml((data && data.error) || 'Could not load tickets.') + '</div>'; return; }
        ticketsLoaded = true;
        allTickets = data.tickets || [];
        renderTicketTabs();
        renderTicketList();
      })
      .catch(function () { ticketListEl.innerHTML = '<div class="empty-state">Could not reach the server.</div>'; });
  }

  function renderTicketTabs() {
    var tabs = ['open', 'in_progress', 'resolved', 'all'];
    ticketTabsEl.innerHTML = tabs.map(function (t) {
      return '<button type="button" data-tab="' + t + '" class="' + (t === ticketTab ? 'active' : '') + '">' + t.replace('_', ' ') + '</button>';
    }).join('');
    Array.prototype.forEach.call(ticketTabsEl.querySelectorAll('button'), function (btn) {
      btn.addEventListener('click', function () { ticketTab = btn.getAttribute('data-tab'); renderTicketTabs(); renderTicketList(); });
    });
  }

  function renderTicketList() {
    var filtered = ticketTab === 'all' ? allTickets : allTickets.filter(function (t) { return t.status === ticketTab; });
    if (!filtered.length) { ticketListEl.innerHTML = '<div class="empty-state">Nothing here.</div>'; return; }
    ticketListEl.innerHTML = filtered.map(function (t) {
      return '<div class="project-card" data-id="' + escapeHtml(t.id) + '">' +
        '<div class="project-card-top"><div><h3>' + escapeHtml(t.full_name || 'Anonymous visitor') + '</h3>' +
        '<p>' + escapeHtml(t.email || '') + (t.whatsapp ? ' · ' + escapeHtml(t.whatsapp) : '') + '</p></div>' +
        '<span class="badge">' + escapeHtml(t.status) + '</span></div>' +
        '<div class="project-meta">' + escapeHtml((t.summary || '').slice(0, 400)) + '</div>' +
        '<div class="field"><label>Status</label><select class="t-status">' +
        ['open', 'in_progress', 'resolved'].map(function (s) { return '<option value="' + s + '"' + (s === t.status ? ' selected' : '') + '>' + s.replace('_', ' ') + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="field"><label>Notes</label><textarea class="t-notes">' + escapeHtml(t.admin_notes || '') + '</textarea></div>' +
        '<div class="project-card-actions"><button type="button" class="save-btn t-save-btn">Save</button><span class="save-status"></span></div>' +
        '</div>';
    }).join('');
    Array.prototype.forEach.call(ticketListEl.querySelectorAll('.project-card'), function (card) {
      var id = card.getAttribute('data-id');
      var saveStatus = card.querySelector('.save-status');
      card.querySelector('.t-save-btn').addEventListener('click', function () {
        fetch(SUPABASE_FUNCTIONS_BASE + '/admin-ticket-update', {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'apikey': SUPABASE_ANON_KEY },
          body: JSON.stringify({ password: password, id: id, status: card.querySelector('.t-status').value, adminNotes: card.querySelector('.t-notes').value.trim() })
        }).then(function (r) { return r.json(); }).then(function (data) {
          if (data && data.ok) { saveStatus.textContent = 'Saved'; saveStatus.className = 'save-status ok'; loadTickets(); }
          else { saveStatus.textContent = (data && data.error) || 'Could not save.'; saveStatus.className = 'save-status err'; }
        });
      });
    });
  }

  /* ============================================================
     MANUAL PAYMENTS (bank/Opay transfer + screenshot review)
     ============================================================ */
  var manualpayListEl = document.getElementById('manualpayList');
  var manualpayTabsEl = document.getElementById('manualpayTabs');
  var allManualPayments = [];
  var manualpayTab = 'pending';

  function loadManualPayments() {
    manualpayListEl.innerHTML = '<div class="empty-state">Loading…</div>';
    fetch(SUPABASE_FUNCTIONS_BASE + '/admin-list-manual-payments?password=' + encodeURIComponent(password), {
      headers: { 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'apikey': SUPABASE_ANON_KEY }
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (!data || !data.ok) { manualpayListEl.innerHTML = '<div class="empty-state">' + escapeHtml((data && data.error) || 'Could not load manual payments.') + '</div>'; return; }
        manualpayLoaded = true;
        allManualPayments = data.payments || [];
        renderManualpayTabs();
        renderManualpayList();
      })
      .catch(function () { manualpayListEl.innerHTML = '<div class="empty-state">Could not reach the server.</div>'; });
  }

  function renderManualpayTabs() {
    var tabs = ['pending', 'verified', 'rejected', 'all'];
    manualpayTabsEl.innerHTML = tabs.map(function (t) {
      return '<button type="button" data-tab="' + t + '" class="' + (t === manualpayTab ? 'active' : '') + '">' + t + '</button>';
    }).join('');
    Array.prototype.forEach.call(manualpayTabsEl.querySelectorAll('button'), function (btn) {
      btn.addEventListener('click', function () { manualpayTab = btn.getAttribute('data-tab'); renderManualpayTabs(); renderManualpayList(); });
    });
  }

  function renderManualpayList() {
    var filtered = manualpayTab === 'all' ? allManualPayments : allManualPayments.filter(function (p) { return p.status === manualpayTab; });
    if (!filtered.length) { manualpayListEl.innerHTML = '<div class="empty-state">Nothing here.</div>'; return; }

    manualpayListEl.innerHTML = filtered.map(function (p) {
      var canDecide = p.status === 'pending';
      return (
        '<div class="project-card" data-id="' + escapeHtml(p.id) + '">' +
          '<div class="project-card-top">' +
            '<div><h3>' + escapeHtml(p.fullName) + (p.businessName ? ' · ' + escapeHtml(p.businessName) : '') + '</h3>' +
            '<p>' + escapeHtml(p.serviceName) + (p.packageName ? ' — ' + escapeHtml(p.packageName) : '') + '</p></div>' +
            '<span class="badge ' + (p.status === 'verified' ? 'approved' : p.status === 'rejected' ? 'rejected' : 'awaiting_admin') + '">' + escapeHtml(p.status) + '</span>' +
          '</div>' +
          '<div class="project-meta">' +
            '<b>Claimed amount:</b> ₦' + Number(p.amount || 0).toLocaleString() + '<br>' +
            escapeHtml(p.email) + ' · ' + escapeHtml(p.whatsapp) +
            (p.adminNotes ? '<br><b>Notes:</b> ' + escapeHtml(p.adminNotes) : '') +
          '</div>' +
          (p.screenshotUrl ? '<a href="' + escapeHtml(p.screenshotUrl) + '" target="_blank" rel="noopener"><img src="' + escapeHtml(p.screenshotUrl) + '" alt="Payment screenshot" style="max-width:100%;border-radius:8px;border:1px solid var(--line);margin-bottom:10px;display:block;"></a>' : '') +
          (canDecide ?
            '<div class="field"><label>Notes (optional)</label><textarea class="mp-notes" placeholder="Internal / message to client if rejecting"></textarea></div>' +
            '<div class="project-card-actions">' +
              '<button type="button" class="save-btn mp-decide-btn" data-decision="verified">Verified</button>' +
              '<button type="button" class="save-btn mp-decide-btn" data-decision="rejected" style="background:transparent;color:#ff8b8b;border:1px solid #4a2222;">Reject</button>' +
              '<span class="save-status"></span>' +
            '</div>'
            : '') +
        '</div>'
      );
    }).join('');

    Array.prototype.forEach.call(manualpayListEl.querySelectorAll('.project-card'), function (card) {
      var id = card.getAttribute('data-id');
      var saveStatus = card.querySelector('.save-status');
      Array.prototype.forEach.call(card.querySelectorAll('.mp-decide-btn'), function (btn) {
        btn.addEventListener('click', function () {
          var decision = btn.getAttribute('data-decision');
          var notesEl = card.querySelector('.mp-notes');
          if (decision === 'verified' && !confirm('Confirm this payment is genuine? This creates the project and emails the client immediately.')) return;
          Array.prototype.forEach.call(card.querySelectorAll('.mp-decide-btn'), function (b) { b.disabled = true; });
          if (saveStatus) { saveStatus.textContent = 'Saving…'; saveStatus.className = 'save-status'; }

          fetch(SUPABASE_FUNCTIONS_BASE + '/admin-verify-manual-payment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'apikey': SUPABASE_ANON_KEY },
            body: JSON.stringify({ password: password, id: id, decision: decision, notes: notesEl ? notesEl.value.trim() : '' })
          })
            .then(function (res) { return res.json(); })
            .then(function (data) {
              if (data && data.ok) { loadManualPayments(); }
              else {
                Array.prototype.forEach.call(card.querySelectorAll('.mp-decide-btn'), function (b) { b.disabled = false; });
                if (saveStatus) { saveStatus.textContent = (data && data.error) || 'Could not save.'; saveStatus.className = 'save-status err'; }
              }
            })
            .catch(function () {
              Array.prototype.forEach.call(card.querySelectorAll('.mp-decide-btn'), function (b) { b.disabled = false; });
              if (saveStatus) { saveStatus.textContent = 'Network error — try again.'; saveStatus.className = 'save-status err'; }
            });
        });
      });
    });
  }

  if (password) tryLoad(password);
})();
</script>
<script src="admin-announcement.js"></script>
<script src="admin-portal.js"></script>
</body>
</html>
