<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin — SCARLS SYSTEMS</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/scarls-logo.png" type="image/png">
<link rel="manifest" href="admin.webmanifest">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SCARLS Admin">
<link rel="apple-touch-icon" href="assets/scarls-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
<style>
  :root{
    --bg:#0a0a0c; --panel:#121216; --panel-2:#17171c; --line:#22222a; --line-soft:#1b1b21;
    --white:#f2f2f0; --dim:#9a9aa4; --dimmer:#65656f;
    --accent:#4d7cff; --accent-dim:#2a3a66;
    --gold:#ffd479; --blue:#7fb2ff; --purple:#c98bff; --green:#7ee0a8; --red:#ff8b8b;
    --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); color:var(--white); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }
  button,input,select,textarea{ font-family:inherit; }
  a{ color:var(--accent); }

  /* ---------- Login screen ---------- */
  #login{
    min-height:100vh; display:grid; grid-template-columns:minmax(0,1.2fr) minmax(360px,.8fr); background:var(--bg);
  }
  .login-stage{
    position:relative; overflow:hidden; padding:40px 56px; display:flex; flex-direction:column; justify-content:space-between;
    background:radial-gradient(700px 420px at 12% 0%, rgba(77,124,255,.14), transparent 70%), #0c0c10;
    border-right:1px solid var(--line);
  }
  .login-brand{ display:flex; align-items:center; gap:12px; font-family:var(--font-display); font-weight:700; font-size:16px; letter-spacing:.01em; position:relative; z-index:1; }
  .login-brand img{ width:34px; height:34px; object-fit:contain; border-radius:8px; }
  .login-stage h2{
    position:relative; z-index:1; margin:0; font-family:var(--font-display); font-weight:600;
    font-size:clamp(34px,4.4vw,60px); line-height:1.02; letter-spacing:-.025em; max-width:9ch;
  }
  .login-steps{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .login-steps .base{ fill:none; stroke:#2a2a34; stroke-width:2; vector-effect:non-scaling-stroke; }
  .login-steps .run{
    fill:none; stroke:url(#stairGrad); stroke-width:3; stroke-linejoin:round;
    stroke-dasharray:1; stroke-dashoffset:1; animation:stairDraw 1.8s cubic-bezier(.4,0,.2,1) .25s forwards;
  }
  .login-steps .node{ fill:var(--accent); opacity:0; animation:nodeIn .5s ease 1.9s forwards; }
  .login-steps .ring{ fill:none; stroke:var(--accent); stroke-width:1.5; opacity:0; vector-effect:non-scaling-stroke; transform-box:fill-box; transform-origin:center; animation:ringOut 1.4s ease-out 1.9s 1 forwards; }
  @keyframes stairDraw{ to{ stroke-dashoffset:0; } }
  @keyframes nodeIn{ to{ opacity:1; } }
  @keyframes ringOut{ 0%{ opacity:.8; transform:scale(1); } 100%{ opacity:0; transform:scale(4.5); } }
  @media (prefers-reduced-motion:reduce){
    .login-steps .run{ animation:none; stroke-dashoffset:0; }
    .login-steps .node{ animation:none; opacity:1; }
    .login-steps .ring{ display:none; }
  }
  .login-panel{ display:flex; align-items:center; justify-content:center; padding:40px 32px; }
  .login-form{ width:100%; max-width:360px; }
  .login-form h1{ font-family:var(--font-display); font-size:30px; font-weight:600; letter-spacing:-.01em; margin:0 0 10px; }
  .login-form p.lead{ color:var(--dim); font-size:15px; line-height:1.55; margin:0 0 28px; }
  .login-form button{
    width:100%; background:var(--accent); color:#fff; border:none; border-radius:10px;
    padding:15px 20px; font-size:15px; font-weight:600; cursor:pointer; transition:background .15s, opacity .15s;
  }
  .login-form button:hover:not(:disabled){ background:#3f6ae0; }
  .login-form button:focus-visible{ outline:2px solid var(--blue); outline-offset:3px; }
  .login-form button:disabled{ opacity:.6; cursor:default; }
  .login-form .err{ color:var(--red); font-size:13.5px; min-height:20px; margin:16px 0 0; line-height:1.45; }
  .login-foot{ margin-top:28px; font-size:13px; line-height:1.5; color:var(--dimmer); }
  @media (max-width:820px){
    #login{ grid-template-columns:1fr; grid-template-rows:auto 1fr; }
    .login-stage{ padding:22px 24px; min-height:190px; border-right:none; border-bottom:1px solid var(--line); }
    .login-stage h2{ font-size:28px; max-width:none; margin-top:36px; }
    .login-steps{ left:auto; right:0; width:58%; }
    .login-panel{ align-items:flex-start; padding:32px 24px 40px; }
  }

  /* ---------- Shell ---------- */
  #shell{ display:none; min-height:100vh; }
  .sidebar{
    width:232px; flex:0 0 232px; background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; overflow-y:auto;
  }
  .sidebar .brand{ padding:22px 20px 18px; font-family:var(--font-display); font-weight:700; font-size:15px; letter-spacing:.01em; border-bottom:1px solid var(--line); }
  .sidebar .brand span{ color:var(--accent); }
  .nav-group{ padding:16px 10px 4px; }
  .nav-group .nav-label{ font-size:11px; color:var(--dimmer); padding:0 10px 8px; }
  .nav-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; text-align:left;
    background:none; border:none; color:var(--dim); font-size:13.5px; padding:9px 10px; border-radius:7px;
    cursor:pointer; margin-bottom:1px;
  }
  .nav-item:hover{ background:var(--panel-2); color:var(--white); }
  .nav-item.active{ background:var(--accent-dim); color:var(--white); }
  .nav-item .count{ font-family:var(--font-mono); font-size:11px; color:var(--dimmer); }
  .nav-item.active .count{ color:var(--accent); }
  .sidebar .who{ margin-top:auto; padding:16px 20px; border-top:1px solid var(--line); }
  .sidebar .who .email{ font-size:12.5px; color:var(--dim); word-break:break-all; margin-bottom:8px; }
  .sidebar .who button{
    font-size:12px; color:var(--dimmer); background:none; border:1px solid var(--line); border-radius:6px;
    padding:6px 10px; cursor:pointer;
  }
  .sidebar .who button:hover{ color:var(--white); border-color:var(--dim); }

  main{ margin-left:232px; padding:28px 36px calc(60px + env(safe-area-inset-bottom)); max-width:1180px; }
  .page-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; gap:16px; flex-wrap:wrap; }
  .page-head h1{ font-family:var(--font-display); font-size:23px; font-weight:600; margin:0; }
  .page-head .sub{ color:var(--dim); font-size:13px; margin-top:4px; }
  .page-actions{ display:flex; gap:8px; }

  .btn{
    font-size:13px; font-weight:500; padding:9px 16px; border-radius:7px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--white); cursor:pointer;
  }
  .btn:hover{ border-color:var(--dim); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ background:#3f6ae0; }
  .btn.danger{ background:none; border-color:#4a2222; color:var(--red); }
  .btn:disabled{ opacity:.5; cursor:default; }

  /* ---------- Stat cards (dashboard only) ---------- */
  .stats-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:28px; }
  .stat{ background:var(--panel); padding:18px 18px 16px; }
  .stat .n{ font-family:var(--font-mono); font-size:26px; font-weight:500; }
  .stat .l{ font-size:12.5px; color:var(--dim); margin-top:4px; }

  /* ---------- Table ---------- */
  .table-wrap{ border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  thead th{
    text-align:left; font-size:11.5px; color:var(--dimmer); font-weight:500; padding:11px 14px;
    border-bottom:1px solid var(--line); background:var(--panel);
  }
  tbody td{ padding:13px 14px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr{ cursor:pointer; }
  tbody tr:hover{ background:var(--panel-2); }
  td.name{ font-weight:500; }
  td.name .sub{ color:var(--dim); font-size:12px; margin-top:2px; }
  td.amount{ font-family:var(--font-mono); font-size:13px; }

  .pill{ display:inline-block; font-size:11.5px; padding:3px 9px; border-radius:100px; border:1px solid var(--line); color:var(--dim); }
  .pill.paid{ color:var(--gold); border-color:#4a3f22; }
  .pill.in_progress{ color:var(--blue); border-color:#22344a; }
  .pill.review, .pill.changes_requested{ color:var(--purple); border-color:#3a224a; }
  .pill.delivered{ color:var(--green); border-color:#22452f; }

  .filter-row{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .filter-row button{
    font-family:var(--font-mono); font-size:11.5px; padding:6px 12px; border-radius:100px;
    border:1px solid var(--line); background:none; color:var(--dim); cursor:pointer;
  }
  .filter-row button.active{ background:var(--white); color:var(--bg); border-color:var(--white); }

  .empty{ padding:50px 20px; text-align:center; color:var(--dim); font-size:13.5px; }
  .placeholder{ padding:60px 20px; text-align:center; color:var(--dim); font-size:13.5px; border:1px dashed var(--line); border-radius:10px; }
  .placeholder b{ color:var(--white); display:block; font-size:15px; margin-bottom:6px; font-family:var(--font-display); font-weight:600; }

  /* ---------- Drawer ---------- */
  .scrim{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:100; }
  .scrim.open{ display:block; }
  .drawer{
    position:fixed; top:0; right:0; bottom:0; width:420px; max-width:92vw; background:var(--panel);
    border-left:1px solid var(--line); z-index:101; transform:translateX(100%); transition:transform .22s ease;
    display:flex; flex-direction:column;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{ padding:20px 20px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .drawer-head h2{ font-family:var(--font-display); font-size:16.5px; margin:0; }
  .drawer-head .sub{ color:var(--dim); font-size:12.5px; margin-top:4px; }
  .drawer-head button{ background:none; border:none; color:var(--dim); font-size:20px; cursor:pointer; line-height:1; padding:2px 6px; }
  .drawer-body{ flex:1; overflow-y:auto; padding:18px 20px; }
  .drawer-foot{ padding:16px 20px; border-top:1px solid var(--line); display:flex; align-items:center; gap:10px; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--dim); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--white);
    padding:9px 11px; font-size:13.5px; border-radius:7px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--accent); }
  .field textarea{ resize:vertical; min-height:60px; }
  .save-status{ font-size:12px; color:var(--dim); }
  .save-status.ok{ color:var(--green); }
  .save-status.err{ color:var(--red); }

  .drawer.wide{ width:560px; }
  .drawer-body img.shot{ max-width:100%; border-radius:8px; border:1px solid var(--line); margin-bottom:14px; display:block; }
  .inline-actions{ display:flex; gap:10px; margin-top:4px; }
  .pkg-item{ border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; }
  .pkg-item .remove{ font-size:11.5px; color:var(--red); background:none; border:none; cursor:pointer; padding:0; margin-top:6px; }
  .check-row{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--dim); margin-bottom:10px; }
  .check-row input{ width:auto; }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  /* ---------- Revenue ---------- */
  .rev-table tbody tr{ cursor:default; }
  .rev-table tbody tr:hover{ background:none; }
  .ads-note{ font-size:12px; color:var(--dimmer); font-weight:400; }
  .ads-note a{ color:var(--accent); }
  .ads-link{ background:var(--panel-2); color:var(--white); border:1px solid var(--line); border-radius:7px; padding:7px 9px; font:inherit; font-size:13px; }
  .rev-grid{ display:grid; grid-template-columns:1.6fr 1fr; gap:16px; margin-bottom:28px; }
  @media(max-width:900px){ .rev-grid{ grid-template-columns:1fr; } }
  .rev-card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; }
  .rev-card h3{ font-family:var(--font-display); font-size:14px; font-weight:600; margin:0 0 14px; }
  .rev-h{ font-family:var(--font-display); font-size:15px; font-weight:600; margin:0 0 12px; }
  .rev-bars{ display:flex; align-items:flex-end; gap:6px; height:150px; }
  .rev-bar{ flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; min-width:0; }
  .rev-bar i{ display:block; width:100%; min-height:2px; background:var(--accent); border-radius:3px 3px 0 0; }
  .rev-bar.zero i{ background:var(--line); }
  .rev-bar span{ font-family:var(--font-mono); font-size:10px; color:var(--dimmer); margin-top:6px; }
  .rev-alert{ border:1px solid #4a2222; background:rgba(255,139,139,.06); border-radius:10px; padding:16px 18px; margin-bottom:28px; }
  .rev-alert .rev-h{ color:var(--red); }
  .rev-alert .table-wrap{ border-color:#4a2222; }
  .rev-src{ display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px; }
  .rev-src:last-child{ border-bottom:none; }
  .pill.src-order{ color:var(--blue); border-color:#22344a; }
  .pill.src-renewal{ color:var(--purple); border-color:#3a224a; }
  .pill.src-manual{ color:var(--gold); border-color:#4a3f22; }
  .pill.st-failed{ color:var(--red); border-color:#4a2222; }
  .pill.st-ok{ color:var(--green); border-color:#22452f; }
  .dash-rev{ cursor:pointer; margin-bottom:28px; display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:center; transition:border-color .15s; }
  .dash-rev:hover{ border-color:var(--dim); }
  @media(max-width:700px){ .dash-rev{ grid-template-columns:1fr; } }
  .dash-rev .head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
  .dash-rev .head b{ font-family:var(--font-display); font-size:14px; font-weight:600; }
  .dash-rev .head span{ font-size:12px; color:var(--accent); }
  .dash-rev .nums{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .dash-rev .nums .n{ font-family:var(--font-mono); font-size:17px; }
  .dash-rev .nums .l{ font-size:12px; color:var(--dim); margin-top:3px; }
  .dash-rev .rev-bars{ height:64px; }
  .dash-rev .warn{ margin-top:12px; font-size:12.5px; color:var(--red); }

  /* ---------- Mobile ---------- */
  .topbar{ display:none; }
  .nav-scrim{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:95; display:none; }
  .nav-scrim.open{ display:block; }
  .table-wrap{ overflow-x:auto; }

  @media (max-width:820px){
    #shell{ flex-direction:column; }
    .topbar{
      display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:50;
      background:var(--panel); border-bottom:1px solid var(--line);
      padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    }
    .topbar button{
      background:none; border:1px solid var(--line); color:var(--white); border-radius:8px;
      width:40px; height:40px; font-size:20px; line-height:1; cursor:pointer;
    }
    .topbar .brand{ font-family:var(--font-display); font-weight:700; font-size:14px; }
    .topbar .brand span{ color:var(--accent); }
    .sidebar{
      width:272px; max-width:84vw; z-index:96; transform:translateX(-100%); transition:transform .22s ease;
      padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
    }
    .sidebar.open{ transform:translateX(0); }
    .nav-item{ padding:13px 12px; font-size:15px; }
    main{ margin-left:0; padding:18px 14px calc(48px + env(safe-area-inset-bottom)); max-width:100%; }
    .page-head h1{ font-size:20px; }
    .page-head{ margin-bottom:16px; }
    .page-actions{ width:100%; }
    .page-actions .btn{ flex:1; padding:12px 16px; }
    .stats-row{ grid-template-columns:repeat(2,1fr); margin-bottom:20px; }
    .stat{ padding:14px; }
    .stat .n{ font-size:22px; }
    .filter-row{ flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; }
    .filter-row button{ flex:0 0 auto; padding:9px 14px; }
    .btn{ padding:12px 16px; }

    /* tables become stacked cards */
    .rtable thead{ display:none; }
    .rtable, .rtable tbody, .rtable tr, .rtable td{ display:block; width:100%; }
    .rtable tr{ padding:12px 14px; border-bottom:1px solid var(--line-soft); }
    .rtable tbody tr:last-child{ border-bottom:none; }
    .rtable td{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; padding:5px 0; border:none; text-align:right; }
    .rtable td::before{ content:attr(data-label); flex:0 0 auto; color:var(--dimmer); font-size:11.5px; text-align:left; padding-top:2px; }
    .rtable td:first-child{ justify-content:flex-start; text-align:left; font-weight:600; font-size:14.5px; padding-bottom:8px; }
    .rtable td:first-child::before{ display:none; }
    .rtable td[colspan]::before{ display:none; }
    .rtable td .sub{ color:var(--dim); font-size:12px; font-weight:400; margin:0; }
    .rtable td:first-child{ flex-wrap:wrap; column-gap:10px; align-items:baseline; }

    /* drawer = full-screen sheet */
    .drawer, .drawer.wide{ width:100%; max-width:100%; }
    .drawer-head{ padding-top:calc(16px + env(safe-area-inset-top)); }
    .drawer-foot{ padding-bottom:calc(16px + env(safe-area-inset-bottom)); }
    .drawer-foot .btn{ flex:1; }
    .field input, .field select, .field textarea{ font-size:16px; padding:11px 12px; }
    .two-col{ grid-template-columns:1fr; }

    .rev-card{ padding:14px; }
    .rev-grid{ gap:12px; margin-bottom:20px; }
    .dash-rev .nums{ grid-template-columns:1fr 1fr; }
    #s_announcement, #s_popupFreq{ font-size:16px; }
  }
  /* ---------- Team chat ---------- */
  .chat-wrap{ position:relative; display:grid; grid-template-columns:320px minmax(0,1fr); height:calc(100vh - 190px); min-height:440px; background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .chat-side{ border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .chat-side-head{ padding:14px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:12px; }
  .chat-side-actions{ display:flex; gap:8px; }
  .chat-side-actions .btn{ flex:1; padding:8px 12px; font-size:13px; }
  .chat-me{ display:flex; align-items:center; gap:10px; }
  .chat-me-txt{ min-width:0; }
  .chat-me-name{ font-weight:600; font-size:14px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .chat-link{ background:none; border:0; color:var(--accent); font-size:12px; padding:0; cursor:pointer; }
  .chat-list{ overflow-y:auto; flex:1; min-height:0; }
  .chat-av{ width:38px; height:38px; flex:none; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; color:var(--white); }
  .chat-av.big{ width:42px; height:42px; }
  .chat-item{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:12px 14px; background:none; border:0; border-bottom:1px solid var(--line-soft); color:inherit; cursor:pointer; }
  .chat-item:hover{ background:var(--panel-2); }
  .chat-item.on{ background:var(--panel-2); box-shadow:inset 3px 0 0 var(--accent); }
  .chat-item-body{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .chat-item-top{ display:flex; align-items:center; gap:6px; min-width:0; }
  .chat-item-name{ font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-item-time{ margin-left:auto; font-size:11px; color:var(--dimmer); flex:none; }
  .chat-item-prev{ font-size:13px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

<script>
(function () {
  var AUTH0_DOMAIN = "dev-hfdnqk0f75wdsch3.us.auth0.com";

  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpweXRqaWZiaGF4bml1bGlvcHZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyOTMyNjgsImV4cCI6MjEwMzg2OTI2OH0.QFGo9feUbsle_fGxNZvxMaBuRQzS55RKF2_i0oL0LYQ";

  var auth0Client = null;

  var projectFilter = "all";

  var SECTIONS = [
    { id: "dashboard", label: "Dashboard", wired: true, staff: true },

    { id: "manualpay", staff: true, label: "Manual Payments", wired: true },
    { id: "revenue", label: "Revenue", staff: true, wired: true },

    { id: "team", label: "Team", wired: true },
    { id: "settings", label: "Settings", staff: true, wired: true },
  ];

  var allAssessments = [], allBudgetRequests = [], allAiQuotes = [];
  var catalogData = { categories: [], services: [] }, catalogLoaded = false, catalogCatFilter = "all";
  var allDiscounts = [], discountsLoaded = false;
  var allSales = [], salesLoaded = false;
  var allTickets = [], ticketsLoaded = false, ticketTab = "open";
  var allManualPayments = [], manualpayLoaded = false, manualpayTab = "pending";
  var settingsLoaded = false, settingsValues = {};

  function escapeHtml(s) {
    if (s == null) return "";
    return String(s).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
    });
  }
  function fmtDay(v) {
    if (!v) return "";
    var d = new Date(v);
    return isNaN(d) ? "" : d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  }
  var STATUS_LABELS = { paid: "Paid", brief: "Brief", in_progress: "In progress", review: "Review", changes_requested: "Changes requested", delivered: "Delivered" };

  /* ---------------- Auth0 ---------------- */

  async function initAuth0() {
    auth0Client = await auth0.createAuth0Client({
      domain: AUTH0_DOMAIN,
      clientId: AUTH0_CLIENT_ID,
      authorizationParams: { redirect_uri: window.location.origin + window.location.pathname, audience: AUTH0_AUDIENCE },
    });

    var query = window.location.search;
    if (query.includes("code=") && query.includes("state=")) {
      try { await auth0Client.handleRedirectCallback(); } catch (e) { showLoginError("Login failed: " + e.message); }
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    var isAuthenticated = await auth0Client.isAuthenticated();
    if (isAuthenticated) {
      var user = await auth0Client.getUser();
      userRole = roleFromToken(await getToken());
      if (!userRole) { showNoAccess(user.email); return; }
      if (userRole === "intern") {
        try { var me = await authedFetch("/admin-me"); mySections = (me.data && me.data.sections) || []; } catch (e) { mySections = []; }
      }
      authUserEmail = String(user.email || "");
      authUserName = (user.name && user.name.indexOf("@") === -1) ? user.name : String(user.email || "").split("@")[0];
      document.getElementById("whoEmail").textContent = (user.email || "") + (userRole === "intern" ? (mySections.indexOf("revenue") !== -1 && mySections.indexOf("settings") !== -1 ? " · Manager" : " · Intern") : "");
      document.getElementById("login").style.display = "none";
      document.getElementById("shell").style.display = "flex";
      renderNav();
      chatStartBadgePoll();
      chatRegisterSw();
      var hm = /^#chat=([0-9a-f-]{36})$/.exec(location.hash || "");
      if (hm) { chat.pendingOpen = hm[1]; goTo("chat"); } else goTo("dashboard");
    } else {
      var lb = document.getElementById("loginBtn");
      lb.disabled = false; lb.textContent = "Sign in";
    }
  }

  function showLoginError(msg) {
    document.getElementById("loginErr").textContent = msg;
  }

  async function getToken() {
    return auth0Client.getTokenSilently();
  }

  async function authedFetch(path, opts) {
    opts = opts || {};
    var token = await getToken();
    var headers = Object.assign({ "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + token }, opts.headers || {});
    var res = await fetch(FN + path, Object.assign({}, opts, { headers: headers }));
    var data = await res.json();
    return { status: res.status, data: data };
  }

  document.getElementById("loginBtn").addEventListener("click", function () {
    if (noAccess) { auth0Client.logout({ logoutParams: { returnTo: window.location.origin + window.location.pathname } }); return; }
    showLoginError("");
    var lb = document.getElementById("loginBtn");
    lb.disabled = true; lb.textContent = "Redirecting…";
    auth0Client.loginWithRedirect().catch(function () {
      lb.disabled = false; lb.textContent = "Sign in";
      showLoginError("Could not start sign-in. Please try again.");
    });
  });
  document.getElementById("logoutBtn").addEventListener("click", function () {
    auth0Client.logout({ logoutParams: { returnTo: window.location.origin + window.location.pathname } });
  });

  /* ---------------- Roles (UI only — the server enforces access) ---------------- */

  function roleFromToken(tk) {
    try {
      var b = String(tk).split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      while (b.length % 4) b += "=";
      var claims = JSON.parse(atob(b));
      if (claims["https://scarlssystems.com/is_admin"] === true) return "owner";
      if (claims["https://scarlssystems.com/is_staff"] === true) return "intern";
    } catch (e) {}
    return null;
  }
  function canSee(sectionId) {
    var s = SECTIONS.filter(function (x) { return x.id === sectionId; })[0];
    if (!s) return false;
    if (userRole === "owner") return true;
    if (sectionId === "dashboard" || sectionId === "chat") return true;
    return !!s.staff && mySections.indexOf(sectionId) !== -1;
  }
  function canEdit(sectionId) {
    if (userRole === "owner") return true;
    return mySections.indexOf(sectionId + ":edit") !== -1 && mySections.indexOf(sectionId) !== -1;
  }
  function visibleSections() {
    return SECTIONS.filter(function (s) { return canSee(s.id); });
  }
  function lockDrawerInputs() {
    Array.prototype.forEach.call(document.querySelectorAll("#drawerBody input, #drawerBody select, #drawerBody textarea, #drawerBody button"), function (el) { el.disabled = true; });
  }
  function showNoAccess(email) {
    noAccess = true;
    document.getElementById("shell").style.display = "none";
    document.getElementById("login").style.display = "grid";
    var lb = document.getElementById("loginBtn");
    lb.disabled = false; lb.textContent = "Sign out";
    showLoginError("This account (" + (email || "unknown") + ") doesn’t have access to the admin area. Ask the owner to add you.");
  }

  /* ---------------- Nav / routing ---------------- */

  function renderNav() {
    var navList = document.getElementById("navList");
    navList.innerHTML = visibleSections().map(function (s) {
      var count = s.id === "projects" ? liveProjects().length : (s.id === "chat" && chat.unreadTotal > 0 ? (chat.unreadTotal > 99 ? "99+" : chat.unreadTotal) : null);
      return '<button type="button" class="nav-item" data-section="' + s.id + '">' +
        '<span>' + escapeHtml(s.label) + '</span>' +
        (count != null ? '<span class="count">' + count + '</span>' : '') +
        '</button>';
    }).join("");
    Array.prototype.forEach.call(navList.querySelectorAll(".nav-item"), function (btn) {
      btn.addEventListener("click", function () { goTo(btn.getAttribute("data-section")); });
    });
    highlightNav();
  }
  function highlightNav() {
    Array.prototype.forEach.call(document.querySelectorAll(".nav-item"), function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-section") === currentSection);
    });
  }

  function goTo(sectionId) {
    if (!canSee(sectionId)) sectionId = "dashboard";
    if (currentSection === "chat" && sectionId !== "chat") stopChat();
    currentSection = sectionId;
    highlightNav();
    var section = SECTIONS.filter(function (s) { return s.id === sectionId; })[0];
    document.getElementById("pageTitle").textContent = section ? section.label : sectionId;
    document.getElementById("pageActions").innerHTML = "";
    document.getElementById("pageSub").textContent = "";

    drawer.classList.remove("wide");
    setNav(false);

    if (sectionId === "dashboard") renderDashboard();
    else if (sectionId === "projects") renderProjectsSection();
    else if (sectionId === "assessments") renderAssessmentsSection();
    else if (sectionId === "budget") renderBudgetSection();
    else if (sectionId === "aiquotes") renderAiQuotesSection();
    else if (sectionId === "catalog") renderCatalogSection();
    else if (sectionId === "discounts") renderDiscountsSection();
    else if (sectionId === "sales") renderSalesSection();
    else if (sectionId === "tickets") renderTicketsSection();
    else if (sectionId === "manualpay") renderManualPaySection();
    else if (sectionId === "revenue") renderRevenueSection();
    else if (sectionId === "team") renderTeamSection();
    else if (sectionId === "settings") renderSettingsSection();
    else if (sectionId === "chat") renderChatSection();
    else if (sectionId === "ads") renderAdsSection();
    else renderPlaceholder(section.label);
  }

  function setDrawerFooter(mode, label) {
    var btn = document.getElementById("drawerSave");
    if (mode === "none") { btn.style.display = "none"; }
    else { btn.style.display = ""; btn.textContent = label || "Save"; }
  }

  function renderPlaceholder(label) {
    document.getElementById("pageSub").textContent = "Part of the rebuild — not wired up yet.";
    document.getElementById("pageBody").innerHTML =
      '<div class="placeholder"><b>' + escapeHtml(label) + ' is next</b>This section is being rebuilt in the same style as Projects. It isn\'t broken — it just hasn\'t been ported over yet.</div>';
  }

  /* ---------------- Dashboard ---------------- */

  function renderDashboard() {
    document.getElementById("pageSub").textContent = "A quick look at what needs attention.";
    if (userRole !== "owner" && mySections.indexOf("projects") === -1) {
      document.getElementById("pageBody").innerHTML = '<div class="placeholder"><b>' + (mySections.length ? "Welcome" : "No access yet") + '</b>' +
        (mySections.length ? "Use the menu to open the areas you have access to." : "Ask the owner to give you access to an area.") + '</div>';
      return;
    }
    document.getElementById("pageBody").innerHTML = '<div class="empty">Loading…</div>';

    loadProjects(function () {
      var paid = liveProjects().filter(function (p) { return p.status === "paid"; }).length;
      var inProgress = liveProjects().filter(function (p) { return p.status === "in_progress"; }).length;
      var review = liveProjects().filter(function (p) { return p.status === "review" || p.status === "changes_requested"; }).length;

      document.getElementById("pageBody").innerHTML =
        '<div class="stats-row">' +
          stat(liveProjects().length, "Total projects") +
          stat(paid, "Awaiting brief") +
          stat(inProgress, "In progress") +
          stat(review, "Awaiting your review") +
        '</div>' +
        '<div id="dashRevenue"></div>' +
        (review > 0
          ? '<div class="placeholder" style="text-align:left;padding:18px 20px;"><b style="margin-bottom:2px;">' + review + ' project' + (review === 1 ? "" : "s") + ' waiting on you</b>Open Projects to review and move them forward.</div>'
          : '<div class="placeholder"><b>Nothing urgent right now</b>Everything in Projects is up to date.</div>');
      if (canSee("revenue")) loadDashRevenue();
    });
  }
  function stat(n, label) {
    return '<div class="stat"><div class="n">' + n + '</div><div class="l">' + escapeHtml(label) + '</div></div>';
  }

  /* ---------------- Projects ---------------- */

  function loadProjects(cb) {
    authedFetch("/admin-list-projects").then(function (r) {
      if (r.data && r.data.ok) {
        allProjects = r.data.projects || [];
        renderNav();
      }
      if (cb) cb();
    });
  }

  function renderProjectsSection() {
    var _n = liveProjects().length;
    document.getElementById("pageSub").textContent = _n + (_n === 1 ? " project" : " projects");
    if (!allProjects.length) {
      document.getElementById("pageBody").innerHTML = '<div class="empty">Loading…</div>';
      loadProjects(renderProjectsSection);
      return;
    }
    drawProjectsTable();
  }

  function drawProjectsTable() {
    var statuses = ["all", "paid", "brief", "in_progress", "review", "changes_requested", "delivered"];
    if (userRole === "owner") statuses.push("archived");
    if (projectFilter === "archived" && userRole !== "owner") projectFilter = "all";
    var live = liveProjects();
    var filtered = projectFilter === "archived" ? allProjects.filter(function (p) { return !!p.archivedAt; })
      : (projectFilter === "all" ? live : live.filter(function (p) { return p.status === projectFilter; }));

    var filterRow = '<div class="filter-row">' + statuses.map(function (s) {
      var label = s === "all" ? "All" : (s === "archived" ? "Archived" : (STATUS_LABELS[s] || s));
      return '<button type="button" data-f="' + s + '" class="' + (s === projectFilter ? "active" : "") + '">' + escapeHtml(label) + '</button>';
    }).join("") + '</div>';

    var body = filtered.length
      ? '<div class="table-wrap"><table><thead><tr><th>Client</th><th>Service</th><th>Status</th><th>Amount</th><th>Due</th></tr></thead><tbody>' +
        filtered.map(function (p) {
          return '<tr data-id="' + escapeHtml(p.projectId) + '">' +
            '<td class="name">' + escapeHtml(p.fullName) + (p.businessName ? '<div class="sub">' + escapeHtml(p.businessName) + '</div>' : '') + '</td>' +
            '<td>' + escapeHtml(p.serviceName) + (p.packageName ? '<div class="sub">' + escapeHtml(p.packageName) + '</div>' : '') + '</td>' +
            '<td><span class="pill ' + escapeHtml(p.status) + '">' + escapeHtml(STATUS_LABELS[p.status] || p.status) + '</span></td>' +
            '<td class="amount">' + (p.amount == null ? "\u2014" : "\u20a6" + Number(p.amount).toLocaleString() + (p.pricingModel === "subscription" ? "/mo" : "")) + '</td>' +
            '<td>' + escapeHtml(fmtDay(p.dueDate)) + '</td>' +
            '</tr>';
        }).join("") + '</tbody></table></div>'
      : '<div class="empty">Nothing in this view.</div>';

    document.getElementById("pageBody").innerHTML = filterRow + body;

    Array.prototype.forEach.call(document.querySelectorAll(".filter-row button"), function (btn) {
      btn.addEventListener("click", function () { projectFilter = btn.getAttribute("data-f"); drawProjectsTable(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll("tbody tr"), function (row) {
      row.addEventListener("click", function () { openProjectDrawer(row.getAttribute("data-id")); });
    });
  }

  var scrim = document.getElementById("scrim");
  var drawer = document.getElementById("drawer");
  function closeDrawer() { scrim.classList.remove("open"); drawer.classList.remove("open"); }
  scrim.addEventListener("click", closeDrawer);
  document.getElementById("drawerClose").addEventListener("click", closeDrawer);

  /* ---------------- Client brief + messages (inside the project drawer) ---------------- */

  function portalCall(body) {
    return authedFetch("/admin-portal", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  }
  function fmtSize(n) { n = Number(n) || 0; return n < 1024 ? n + " B" : n < 1048576 ? Math.round(n / 1024) + " KB" : (n / 1048576).toFixed(1) + " MB"; }
  var BRIEF_STATUS = { submitted: "Submitted", changes_requested: "Waiting on customer", approved: "Approved", draft: "Draft" };

  function loadBriefBox(p) {
    var box = document.getElementById("d_briefBox");
    if (!box) return;
    box.innerHTML = '<div class="field"><label>Client brief</label><div class="sub">Loading…</div></div>';
    portalCall({ action: "get_brief", projectId: p.projectId }).then(function (r) {
      if (!document.getElementById("d_briefBox")) return;
      if (!r.data || !r.data.ok) { box.innerHTML = '<div class="field"><label>Client brief</label><div class="sub">' + escapeHtml((r.data && r.data.error) || "Could not load the brief.") + '</div></div>'; return; }
      drawBriefBox(p, r.data);
    }).catch(function () { box.innerHTML = '<div class="field"><label>Client brief</label><div class="sub">Network error — close and reopen to retry.</div></div>'; });
  }

  function drawBriefBox(p, d) {
    var box = document.getElementById("d_briefBox");
    var b = d.brief || {};
    var st = b.status ? (BRIEF_STATUS[b.status] || b.status) : "Not started";
    var answered = (b.items || []).some(function (it) { return it.value && String(it.value).trim(); }) || (b.extra && String(b.extra).trim());
    var html = '<div class="field"><label>Client brief · ' + escapeHtml(st) + (b.submittedAt ? ' · sent ' + escapeHtml(fmtDay(b.submittedAt)) : '') + '</label>';
    if (!b.status && !answered && !(d.files || []).length) {
      html += '<div class="sub">The client hasn’t sent anything yet.' + (d.project && d.project.portalUrl ? ' Their page: <a href="' + escapeHtml(d.project.portalUrl) + '" target="_blank" rel="noopener">open</a>' : '') + '</div>';
    } else {
      html += '<div style="border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel-2);">';
      (b.items || []).forEach(function (it) {
        var v = it.value && String(it.value).trim();
        html += '<div style="margin-bottom:12px;"><div style="font-size:12px;color:var(--dim);margin-bottom:3px;">' + escapeHtml(it.label || "") + '</div>' +
          '<div style="white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5;' + (v ? '' : 'color:var(--dimmer);') + '">' + (v ? escapeHtml(v) : "(not answered)") + '</div></div>';
      });
      if (b.extra && String(b.extra).trim()) {
        html += '<div style="margin-bottom:12px;"><div style="font-size:12px;color:var(--dim);margin-bottom:3px;">Anything else</div><div style="white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5;">' + escapeHtml(b.extra) + '</div></div>';
      }
      var files = d.files || [];
      html += '<div style="font-size:12px;color:var(--dim);margin-bottom:6px;">Files (' + files.length + ')</div>';
      if (files.length) {
        html += files.map(function (f) {
          var isImg = /^image\//.test(f.type || "") && f.url;
          return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">' +
            (isImg ? '<a href="' + escapeHtml(f.url) + '" target="_blank" rel="noopener"><img src="' + escapeHtml(f.url) + '" alt="" style="width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line);"></a>' : '') +
            (f.url ? '<a href="' + escapeHtml(f.url) + '" target="_blank" rel="noopener" style="word-break:break-all;">' + escapeHtml(f.name) + '</a>' : '<span>' + escapeHtml(f.name) + '</span>') +
            '<span style="color:var(--dimmer);font-size:12px;white-space:nowrap;">' + escapeHtml(fmtSize(f.size)) + '</span></div>';
        }).join("");
      } else { html += '<div class="sub">No files uploaded.</div>'; }
      if (b.adminNote) html += '<div style="margin-top:10px;font-size:12px;color:var(--dim);">Your last note to the client: <span style="color:var(--white);white-space:pre-wrap;">' + escapeHtml(b.adminNote) + '</span></div>';
      html += '</div>';
    }
    if (p.status === "brief" && canEdit("projects")) {
      html += '<textarea id="d_briefNote" placeholder="Note to the client (needed if you ask for more details)" style="margin-top:10px;min-height:60px;"></textarea>' +
        '<div style="display:flex;gap:8px;margin-top:8px;">' +
        '<button type="button" class="btn primary" id="d_briefApprove" style="flex:1;">Approve &amp; start project</button>' +
        '<button type="button" class="btn" id="d_briefChanges" style="flex:1;">Ask for more details</button></div>' +
        '<div class="save-status" id="d_briefMsg" style="margin-top:6px;"></div>';
    }
    html += '</div>' +
      '<div class="field"><label>Messages</label><div id="d_thread" class="sub">Loading…</div></div>';
    box.innerHTML = html;

    function decide(kind) {
      var note = (document.getElementById("d_briefNote").value || "").trim();
      var msg = document.getElementById("d_briefMsg");
      if (kind === "approve" && !confirm("Approve this brief and move the project to In progress? The client will be emailed.")) return;
      if (kind === "changes" && note.length < 3) { msg.className = "save-status err"; msg.textContent = "Write what you need from the client first."; return; }
      document.getElementById("d_briefApprove").disabled = true; document.getElementById("d_briefChanges").disabled = true;
      msg.className = "save-status"; msg.textContent = "Saving…";
      portalCall({ action: "decide", projectId: p.projectId, decision: kind, note: note }).then(function (r) {
        if (r.data && r.data.ok) { loadProjects(function () { drawProjectsTable(); closeDrawer(); }); }
        else { document.getElementById("d_briefApprove").disabled = false; document.getElementById("d_briefChanges").disabled = false; msg.className = "save-status err"; msg.textContent = (r.data && r.data.error) || "Could not save."; }
      }).catch(function () { document.getElementById("d_briefApprove").disabled = false; document.getElementById("d_briefChanges").disabled = false; msg.className = "save-status err"; msg.textContent = "Network error — try again."; });
    }
    var ap = document.getElementById("d_briefApprove"); if (ap) ap.onclick = function () { decide("approve"); };
    var ch = document.getElementById("d_briefChanges"); if (ch) ch.onclick = function () { decide("changes"); };
    loadThreadBox(p);
  }

  function loadThreadBox(p) {
    portalCall({ action: "thread", projectId: p.projectId }).then(function (r) {
      var el = document.getElementById("d_thread");
      if (!el) return;
      if (!r.data || !r.data.ok) { el.textContent = (r.data && r.data.error) || "Could not load messages."; return; }
      drawThreadBox(p, r.data.messages || []);
    }).catch(function () { var el = document.getElementById("d_thread"); if (el) el.textContent = "Network error."; });
  }

  function drawThreadBox(p, msgs) {
    var el = document.getElementById("d_thread");
    if (!el) return;
    var html = msgs.length ? msgs.map(function (m) {
      var mine = m.from === "admin";
      var sys = m.kind === "system";
      return '<div style="margin-bottom:8px;padding:8px 10px;border-radius:8px;background:' + (mine ? 'var(--accent-dim)' : 'var(--panel-2)') + ';border:1px solid var(--line);">' +
        '<div style="font-size:11px;color:var(--dim);margin-bottom:2px;">' + escapeHtml(sys ? "System" : mine ? "You" : "Client") + ' · ' + escapeHtml(fmtDay(m.at)) +
        (m.kind === "changes_request" ? ' · changes requested' : '') + '</div>' +
        '<div style="white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5;color:var(--white);">' + escapeHtml(m.text || "") + '</div></div>';
    }).join("") : '<div class="sub">No messages yet.</div>';
    if (canEdit("projects")) {
      html += '<textarea id="d_replyText" placeholder="Reply to the client (they get an email)" style="min-height:60px;"></textarea>' +
        '<div style="display:flex;align-items:center;gap:10px;margin-top:8px;"><button type="button" class="btn" id="d_replyBtn">Send reply</button><span class="save-status" id="d_replyMsg"></span></div>';
    }
    el.className = ""; el.innerHTML = html;
    var rb = document.getElementById("d_replyBtn");
    if (rb) rb.onclick = function () {
      var t = (document.getElementById("d_replyText").value || "").trim();
      var m = document.getElementById("d_replyMsg");
      if (!t) { m.className = "save-status err"; m.textContent = "Type your message first."; return; }
      rb.disabled = true; m.className = "save-status"; m.textContent = "Sending…";
      portalCall({ action: "reply", projectId: p.projectId, text: t }).then(function (r) {
        if (r.data && r.data.ok) { drawThreadBox(p, r.data.messages || []); }
        else { rb.disabled = false; m.className = "save-status err"; m.textContent = (r.data && r.data.error) || "Could not send."; }
      }).catch(function () { rb.disabled = false; m.className = "save-status err"; m.textContent = "Network error."; });
    };
  }

  function openProjectDrawer(projectId) {
    var p = allProjects.filter(function (x) { return x.projectId === projectId; })[0];
    if (!p) return;

    document.getElementById("drawerTitle").textContent = p.fullName + (p.businessName ? " · " + p.businessName : "");
    document.getElementById("drawerSub").textContent = p.serviceName + (p.packageName ? " — " + p.packageName : "") + " · " + p.email;

    var statusOptions = ["paid", "brief", "in_progress", "review", "changes_requested", "delivered"].map(function (s) {
      return '<option value="' + s + '"' + (s === p.status ? " selected" : "") + '>' + escapeHtml(STATUS_LABELS[s] || s) + '</option>';
    }).join("");

    var isSub = p.pricingModel === "subscription";

    document.getElementById("drawerBody").innerHTML =
      '<div class="field"><button type="button" class="btn" id="d_teamChat" style="width:100%;">&#128172; Team chat for this project</button></div>' +
      '<div id="d_adsBox"></div>' +
      '<div id="d_briefBox"></div>' +
      '<div class="field"><label>Status</label><select id="d_status">' + statusOptions + '</select></div>' +
      '<div class="field"><label>Assigned to</label><input id="d_assignedTo" type="text" value="' + escapeHtml(p.assignedTo || "") + '" placeholder="Team member name"></div>' +
      '<div class="field"><label>Due date</label><input id="d_dueDate" type="date" value="' + escapeHtml(p.dueDate ? String(p.dueDate).slice(0, 10) : "") + '"></div>' +
      '<div class="field"><label>Delivered site link</label><input id="d_deliveryLink" type="text" value="' + escapeHtml(p.deliveryLink || "") + '" placeholder="https://..."></div>' +
      '<div class="field"><label>Client review link <span class="sub" style="font-weight:400;">(masked, safe to share while in review)</span></label>' +
      (p.previewLink
        ? '<div style="display:flex;gap:8px;"><input id="d_previewLink" type="text" readonly value="' + escapeHtml(p.previewLink) + '" style="flex:1;"><button type="button" class="btn" id="d_previewCopy">Copy</button></div>'
        : '<input type="text" readonly disabled value="" placeholder="Appears after you save a Delivered site link">') + '</div>' +
      '<div class="field"><label>Notes</label><textarea id="d_notes" placeholder="Internal notes">' + escapeHtml(p.notes || "") + '</textarea></div>' +
      (isSub && userRole === "owner"
        ? '<div class="field"><label>Subscription</label><button type="button" class="btn' + (p.subscriptionStatus === "cancelled" ? "" : " danger") + '" id="d_subToggle" style="width:100%;">' +
          (p.subscriptionStatus === "cancelled" ? "Reactivate subscription" : "Cancel subscription") + '</button></div>'
        : "") +
      (userRole === "owner"
        ? '<div class="field"><label>' + (p.archivedAt ? "Archived" : "Tidy up") + '</label><button type="button" class="btn" id="d_archiveBtn" style="width:100%;">' +
          (p.archivedAt ? "Restore project" : "Archive project") + '</button>' +
          '<div class="sub" style="margin-top:6px;">' + (p.archivedAt ? "Hidden from the main list and from interns." : "Hides it from the main list and from interns. Nothing is deleted; the client\u2019s page keeps working.") + '</div></div>'
        : "");

    var pcb = document.getElementById("d_previewCopy");
    if (pcb) pcb.addEventListener("click", function () {
      var v = document.getElementById("d_previewLink").value;
      var done = function () { pcb.textContent = "Copied"; setTimeout(function () { pcb.textContent = "Copy"; }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(done, function () { document.getElementById("d_previewLink").select(); document.execCommand("copy"); done(); });
      else { document.getElementById("d_previewLink").select(); document.execCommand("copy"); done(); }
    });
    var tcb = document.getElementById("d_teamChat");
    if (tcb) tcb.addEventListener("click", function () { closeDrawer(); chatOpenProject(p.projectId, (p.businessName || p.fullName) + " \u00b7 " + p.serviceName); });
    document.getElementById("drawerStatus").textContent = "";
    loadBriefBox(p);
    adsDrawerBox(p.projectId);

    document.getElementById("drawerSave").onclick = function () {
      var payload = {
        projectId: projectId,
        status: document.getElementById("d_status").value,
        assignedTo: document.getElementById("d_assignedTo").value.trim(),
        dueDate: document.getElementById("d_dueDate").value,
        deliveryLink: (function (v) { v = v.trim(); return v && !/^https?:\/\//i.test(v) ? "https://" + v : v; })(document.getElementById("d_deliveryLink").value),
        notes: document.getElementById("d_notes").value.trim(),
      };
      saveProject(payload);
    };

    var archBtn = document.getElementById("d_archiveBtn");
    if (archBtn) archBtn.onclick = function () {
      var archiving = !p.archivedAt;
      if (archiving && !confirm("Archive this project? It will be hidden from the main list and from interns. You can restore it any time from the Archived tab.")) return;
      archBtn.disabled = true;
      authedFetch("/admin-archive-project", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ projectId: projectId, archived: archiving }) }).then(function (r) {
        if (r.data && r.data.ok) { loadProjects(function () { drawProjectsTable(); closeDrawer(); }); }
        else { archBtn.disabled = false; alert((r.data && r.data.error) || "Could not update."); }
      }).catch(function () { archBtn.disabled = false; alert("Network error — try again."); });
    };

    var subBtn = document.getElementById("d_subToggle");
    if (subBtn) subBtn.onclick = function () {
      var next = p.subscriptionStatus === "cancelled" ? "active" : "cancelled";
      var msg = next === "cancelled" ? "Cancel this subscription? No further charges will be attempted." : "Reactivate this subscription?";
      if (!confirm(msg)) return;
      saveProject({ projectId: projectId, subscriptionStatus: next });
    };

    if (!canEdit("projects")) { lockDrawerInputs(); setDrawerFooter("none"); } else { setDrawerFooter("save", "Save"); }
    scrim.classList.add("open");
    drawer.classList.add("open");
  }

  function saveProject(payload) {
    var statusEl = document.getElementById("drawerStatus");
    var saveBtn = document.getElementById("drawerSave");
    saveBtn.disabled = true;
    statusEl.textContent = "Saving…";
    statusEl.className = "save-status";

    authedFetch("/admin-update-project", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
      .then(function (r) {
        saveBtn.disabled = false;
        if (r.data && r.data.ok) {
          statusEl.textContent = "Saved";
          statusEl.className = "save-status ok";
          loadProjects(function () { drawProjectsTable(); closeDrawer(); });
        } else {
          statusEl.textContent = (r.data && r.data.error) || "Could not save.";
          statusEl.className = "save-status err";
        }
      })
      .catch(function () {
        saveBtn.disabled = false;
        statusEl.textContent = "Network error — try again.";
        statusEl.className = "save-status err";
      });
  }

  /* ---------------- Assessments ---------------- */

  var CONFIDENCE_LABELS = { qualified: "Qualified", needs_more_information: "Needs more info", human_review_required: "Needs review" };
  var DECISION_LABELS = { "": "No decision yet", approved: "Approved", changes_required: "Changes required", modified: "Modified", rejected: "Rejected" };

  function renderAssessmentsSection() {
    document.getElementById("pageBody").innerHTML = '<div class="empty">Loading…</div>';
    authedFetch("/admin-list-assessments").then(function (r) {
      if (!r.data || !r.data.ok) { document.getElementById("pageBody").innerHTML = '<div class="empty">' + escapeHtml((r.data && r.data.error) || "Could not load.") + '</div>'; return; }
      allAssessments = r.data.assessments || [];
      document.getElementById("pageSub").textContent = allAssessments.length + (allAssessments.length === 1 ? " assessment" : " assessments");
      drawAssessmentsTable();
    });
  }
  function drawAssessmentsTable() {
    if (!allAssessments.length) { document.getElementById("pageBody").innerHTML = '<div class="empty">No completed assessments yet.</div>'; return; }
    document.getElementById("pageBody").innerHTML =
      '<div class="table-wrap"><table><thead><tr><th>Client</th><th>Recommended</th><th>Confidence</th><th>Decision</th></tr></thead><tbody>' +
      allAssessments.map(function (a, i) {
        return '<tr data-i="' + i + '"><td class="name">' + escapeHtml(a.fullName) + (a.businessName ? '<div class="sub">' + escapeHtml(a.businessName) + '</div>' : '') + '</td>' +

    Array.prototype.forEach.call(document.querySelectorAll(".t_area"), function (el) {

  function pickedAreas() {
    var out = [];
    Array.prototype.forEach.call(document.querySelectorAll(".t_area"), function (el) {
      var a = el.getAttribute("data-area");

  function areaNames(list) {
    list = list || [];
    var names = TEAM_AREAS.filter(function (a) { return list.indexOf(a[0]) !== -1; }).map(function (a) {
      return a[1] + (list.indexOf(a[0] + ":edit") !== -1 ? " (edit)" : "");

  function renderTeamSection() {
    document.getElementById("pageSub").textContent = "Choose what each person can open, and whether they can only view it or also make changes. Revenue and Settings can be granted too. Team, archiving and project amounts stay with you.";
    document.getElementById("pageActions").innerHTML = '<button type="button" class="btn primary" id="addInternBtn">+ Add intern</button>';

  function drawTeamTable() {
    if (!teamMembers.length) {

  function inviteBlock(email, url) {
    var msg = "Hi, you've been added to the SCARLS admin team. 1) Set your password here: " + url + " 2) Then log in at https://scarlssystems.com/admin";
    return '<div class="field"><label>Invite link for ' + escapeHtml(email) + ' (valid 7 days)</label>' +
      '<input id="inviteUrl" type="text" readonly value="' + escapeHtml(url) + '"></div>' +
      '<div class="inline-actions">' +
      '<button type="button" class="btn primary" id="copyInvite">Copy link</button>' +
      '<a class="btn" style="text-decoration:none;" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(msg) + '">Send on WhatsApp</a></div>' +
      '<div class="save-status" style="margin-top:12px;">Send this only to ' + escapeHtml(email) + '. Anyone with the link can set that account’s password.</div>';

  function emailNotice(d) {
    if (d.emailed) return '<div class="save-status ok" style="margin-bottom:14px;font-size:13.5px;">✓ Invite emailed to ' + escapeHtml(d.email || "them") + '</div>';
    return '<div class="save-status err" style="margin-bottom:14px;font-size:13.5px;">Couldn’t send the email' + (d.emailError ? " (" + escapeHtml(d.emailError) + ")" : "") + '. Use the link below instead.</div>';

  function wireInvite() {
    var btn = document.getElementById("copyInvite");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var inp = document.getElementById("inviteUrl");
      function done() { btn.textContent = "Copied ✓"; }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(inp.value).then(done, function () { inp.select(); document.execCommand("copy"); done(); });
      else { inp.select(); document.execCommand("copy"); done(); }
    });
  }

  function openAddInternDrawer() {
    document.getElementById("drawerTitle").textContent = "Add intern";
    document.getElementById("drawerSub").textContent = "They’ll get an email with a link to set their password.";
    document.getElementById("drawerBody").innerHTML =

      '<div class="field"><label>Give access to</label>' + areaChecks(DEFAULT_ACCESS) + '</div>';
    setDrawerFooter("save", "Add & send invite");
    document.getElementById("drawerStatus").textContent = "";
    document.getElementById("drawerSave").onclick = function () {
      var email = document.getElementById("t_email").value.trim();
      var sections = pickedAreas();
      var statusEl = document.getElementById("drawerStatus"), btn = document.getElementById("drawerSave");
      if (!email) { statusEl.textContent = "Enter an email."; statusEl.className = "save-status err"; return; }
      btn.disabled = true; statusEl.textContent = "Adding…"; statusEl.className = "save-status";
      teamCall({ action: "add", email: email, sections: sections }).then(function (r) {
        btn.disabled = false;

        } else { statusEl.textContent = (r.data && r.data.error) || "Could not add."; statusEl.className = "save-status err"; }

    };

  function openMemberDrawer(m) {
    document.getElementById("drawerTitle").textContent = m.email;
    document.getElementById("drawerSub").textContent = (m.blocked ? "Blocked" : "Active") + " · last login " + (m.lastLogin ? fmtDay(m.lastLogin) : "never");
    document.getElementById("drawerBody").innerHTML =
      '<div class="field"><label>Access</label>' + areaChecks(m.sections || []) + '</div>' +
      '<div id="memberResult"></div>' +
      '<div class="inline-actions"><button type="button" class="btn" id="m_invite">Resend invite</button>' +
      '<button type="button" class="btn danger" id="m_remove">Remove access</button></div>' +
      '<div class="save-status" id="m_status" style="margin-top:12px;"></div>';

    var statusEl = document.getElementById("drawerStatus"), saveBtn = document.getElementById("drawerSave");

    saveBtn.onclick = function () {
      saveBtn.disabled = true; statusEl.textContent = "Saving…"; statusEl.className = "save-status";

        if (r.data && r.data.ok) {
          st.textContent = "";
          r.data.email = m.email;
          document.getElementById("memberResult").innerHTML = emailNotice(r.data) + inviteBlock(m.email, r.data.inviteUrl);

      });

      if (!confirm("Remove access for " + m.email + "? They won't be able to log in.")) return;
      st.textContent = "Removing…"; st.className = "save-status";
      teamCall({ action: "remove", userId: m.userId }).then(function (r) {
        if (r.data && r.data.ok) { closeDrawer(); renderTeamSection(); }
        else { st.textContent = (r.data && r.data.error) || "Could not remove."; st.className = "save-status err"; }

  /* ---------------- Revenue ---------------- */

  function naira(n) { return "\u20a6" + Number(n || 0).toLocaleString(); }
  function revStat(value, label, sub) {
    return '<div class="stat"><div class="n" style="font-size:21px;">' + value + '</div><div class="l">' + escapeHtml(label) + '</div>' +
      (sub ? '<div class="l" style="color:var(--dimmer);margin-top:2px;">' + sub + '</div>' : '') + '</div>';
  }

  function loadDashRevenue() {

      slot = document.getElementById("dashRevenue");

      var d = r.data, t = d.totals;

          '<div><div class="n">' + naira(t.thisMonth) + '</div><div class="l">This month</div></div>' +
          '<div><div class="n">' + naira(t.today) + '</div><div class="l">Today</div></div>' +
          '<div><div class="n">' + naira(t.allTime) + '</div><div class="l">All-time</div></div>' +
        '</div>' +
        (t.pendingManual ? '<div class="l" style="margin-top:12px;font-size:12.5px;color:var(--gold);">' + naira(t.pendingManual) + ' in manual payments awaiting verification</div>' : '') +
        (failed ? '<div class="warn">' + failed + ' failed renewal' + (failed === 1 ? "" : "s") + ' need attention</div>' : '') +
        '</div>' +
        '<div><div class="rev-bars">' + bars + '</div></div>';
      slot.onclick = function () { goTo("revenue"); };
    }).catch(function () { var el = document.getElementById("dashRevenue"); if (el) el.remove(); });
  }

  var revRange = { from: "", to: "", preset: "all" };
  function revLagosToday() { return new Date(Date.now() + 3600000).toISOString().slice(0, 10); }
  function revPreset(name) {
    var t = revLagosToday(), y = Number(t.slice(0, 4)), m = Number(t.slice(5, 7));
    var addDays = function (iso, n) { var d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
    if (name === "today") return { from: t, to: t };
    if (name === "7d") return { from: addDays(t, -6), to: t };
    if (name === "30d") return { from: addDays(t, -29), to: t };
    if (name === "month") return { from: t.slice(0, 8) + "01", to: t };
    if (name === "lastmonth") {
      var first = new Date(Date.UTC(y, m - 2, 1)).toISOString().slice(0, 10), last = new Date(Date.UTC(y, m - 1, 0)).toISOString().slice(0, 10);
      return { from: first, to: last };
    }
    if (name === "year") return { from: y + "-01-01", to: t };
    return { from: "", to: "" };
  }
  var REV_PRESETS = [["all", "All time"], ["today", "Today"], ["7d", "7 days"], ["30d", "30 days"], ["month", "This month"], ["lastmonth", "Last month"], ["year", "This year"]];
  function revRangeActive() { return !!(revRange.from || revRange.to); }
  function revRangeText() {
    if (!revRangeActive()) return "";
    var f = revRange.from ? fmtDay(revRange.from + "T12:00:00Z") : "the start", t = revRange.to ? fmtDay(revRange.to + "T12:00:00Z") : "today";
    return f + " \u2013 " + t;
  }
  function revFilterHtml() {
    return '<div class="rev-filter" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px;">' +
      REV_PRESETS.map(function (x) { return '<button type="button" class="btn rev-preset' + (revRange.preset === x[0] ? " primary" : "") + '" data-p="' + x[0] + '">' + x[1] + '</button>'; }).join("") +
      '<span class="ads-note" style="margin-left:6px;">Custom</span>' +
      '<input type="date" id="rev_from" class="ads-link" value="' + escapeHtml(revRange.from) + '">' +
      '<span class="ads-note">to</span>' +
      '<input type="date" id="rev_to" class="ads-link" value="' + escapeHtml(revRange.to) + '">' +
      '<button type="button" class="btn" id="rev_apply">Apply</button></div>' +
      (revRangeActive() ? '<div class="ads-note" style="margin:-8px 0 16px;">Showing ' + escapeHtml(revRangeText()) + '. The Today, This month and 12-month trend figures stay fixed.</div>' : '');
  }
  function wireRevFilter() {
    Array.prototype.forEach.call(document.querySelectorAll(".rev-preset"), function (b) {
      b.addEventListener("click", function () {
        var k = b.getAttribute("data-p"), r = revPreset(k);
        revRange = { from: r.from, to: r.to, preset: k };
        renderRevenueSection();
      });
    });
    var ap = document.getElementById("rev_apply");
    if (ap) ap.addEventListener("click", function () {
      var f = document.getElementById("rev_from").value, t = document.getElementById("rev_to").value;
      if (f && t && f > t) { alert("The start date is after the end date."); return; }
      revRange = { from: f, to: t, preset: (f || t) ? "custom" : "all" };
      renderRevenueSection();
    });
  }

  function renderRevenueSection() {
    document.getElementById("pageSub").textContent = "Read-only. Paystack orders, renewals and verified manual payments.";
    document.getElementById("pageBody").innerHTML = '<div class="empty">Loading…</div>';
    authedFetch("/admin-revenue-stats", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ from: revRange.from, to: revRange.to }) }).then(function (r) {
      if (!r.data || !r.data.ok) {
        document.getElementById("pageBody").innerHTML = '<div class="empty">' + escapeHtml((r.data && r.data.error) || "Could not load revenue.") + '</div>';
        return;
      }
      drawRevenue(r.data);
    }).catch(function () {
      document.getElementById("pageBody").innerHTML = '<div class="empty">Network error — try again.</div>';
    });
  }

  function revDiscountsHtml(x) {
    if (!x) return "";
    var rows = x.byCode.length
      ? x.byCode.map(function (c) { return '<div class="rev-src"><span>' + escapeHtml(c.code) + ' <span style="color:var(--dimmer);">\u00d7 ' + c.count + '</span></span><span class="amount">' + naira(c.total) + '</span></div>'; }).join("")
      : '<div class="rev-src"><span style="color:var(--dimmer);">No discounts used yet.</span></div>';
    return '<div class="rev-card" style="margin-bottom:28px;"><h3>Discounts given \u2014 ' + naira(x.totalDiscounted) + ' across ' + x.redemptions + ' paid checkout' + (x.redemptions === 1 ? "" : "s") + '</h3>' + rows +
      '<div class="rev-src" style="color:var(--dimmer);font-size:12px;">Counts only completed checkouts. Unfinished checkouts that reserved a code are excluded.</div></div>';
  }

  /* ---------------- Profit (owner only, shown on the Revenue screen) ---------------- */

  function profitApi(action, extra) {
    return authedFetch("/admin-profit", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ action: action }, extra || {})),
    }).then(function (r) { return r.data || { ok: false, error: "No response." }; })
      .catch(function () { return { ok: false, error: "Could not reach the server." }; });
  }

  function loadProfit(rev) {
    var box = document.getElementById("profitBox");
    if (!box || userRole !== "owner") return;
    profitApi("overview", { from: revRange.from, to: revRange.to }).then(function (p) {
      box = document.getElementById("profitBox");
      if (!box) return;
      if (!p || !p.ok) { box.innerHTML = '<div class="empty">' + escapeHtml((p && p.error) || "Could not load profit.") + '</div>'; return; }
      drawProfit(box, rev, p);
    });
  }

  function drawProfit(box, rev, p) {
    var m = function (n) { return naira(n); };
    var income = rev.totals.allTime;
    var profit = income - p.adSpendTotal - p.expensesTotal - p.heldBudget;
    var html = '<div class="rev-h">Profit</div><div class="stats-row">' +
      revStat(m(income), "Income", revRangeActive() ? "in range" : "all-time revenue") +
      revStat(m(p.adSpendTotal), "Meta ad spend", revRangeActive() ? "in range" : "all campaigns") +
      revStat(m(p.expensesTotal), "Other expenses", revRangeActive() ? "in range" : "entered below") +
      revStat(m(p.heldBudget), "Held for client ads", p.heldApplies ? "unspent, until Delivered" : "only counted for all time") +
      revStat(m(profit), "Profit", profit < 0 ? "loss in this period" : (p.heldApplies ? "so far" : "in this period")) +
      '</div>';

    // Month by month (revenue trend is the last 12 months; show the latest 6).
    var months = revRangeActive()
      ? rev.monthlyTrend.filter(function (x) { return (!revRange.from || x.month >= revRange.from.slice(0, 7)) && (!revRange.to || x.month <= revRange.to.slice(0, 7)); }).reverse()
      : rev.monthlyTrend.slice(-6).reverse();
    html += '<div class="table-wrap rev-table" style="margin-bottom:18px;"><table><thead><tr><th>Month</th><th>Income</th><th>Ad spend</th><th>Expenses</th><th>Profit</th></tr></thead><tbody>' +
      months.map(function (x) {
        var ad = p.adSpendByMonth[x.month] || 0, ex = p.expensesByMonth[x.month] || 0, pr = x.total - ad - ex;
        var label = new Date(x.month + "-01T00:00:00Z").toLocaleDateString(undefined, { month: "long", year: "numeric", timeZone: "UTC" });
        return '<tr><td class="name">' + escapeHtml(label) + '</td><td class="amount">' + m(x.total) + '</td><td class="amount">' + m(ad) + '</td><td class="amount">' + m(ex) + '</td><td class="amount"' + (pr < 0 ? ' style="color:var(--red)"' : ' style="color:#7ee0a8"') + '>' + m(pr) + '</td></tr>';
      }).join("") + '</tbody></table></div>' +
      '<div class="ads-note" style="margin-bottom:18px;">Profit = income − Meta ad spend − other expenses − ad budget clients paid for that is still unspent. That unspent budget joins your profit once the campaign is marked Delivered. Monthly rows leave the held budget out and always cover whole months. If a client paid for ads through checkout or a manual payment, that money is already in Income.</div>';

    html += '<div class="rev-h">Expenses</div>' +
      '<form id="expForm" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;">' +
      '<input id="exp_date" type="date" value="' + new Date().toISOString().slice(0, 10) + '" class="ads-link">' +
      '<input id="exp_label" type="text" placeholder="What was it for? (e.g. Domain renewal)" maxlength="120" class="ads-link" style="flex:2 1 220px;">' +
      '<input id="exp_cat" type="text" placeholder="Category" maxlength="40" class="ads-link" style="flex:1 1 110px;">' +
      '<input id="exp_amt" type="number" min="0" step="any" placeholder="Amount" class="ads-link" style="flex:1 1 110px;">' +
      '<button type="submit" class="btn primary">Add</button></form><div id="expMsg" class="ads-note" style="margin-bottom:8px;"></div>' +
      (p.expenses.length
        ? '<div class="table-wrap rev-table" style="margin-bottom:28px;"><table><thead><tr><th>Date</th><th>For</th><th>Category</th><th>Amount</th><th></th></tr></thead><tbody>' +
          p.expenses.map(function (e) {
            return '<tr><td>' + escapeHtml(fmtDay(e.spent_on)) + '</td><td class="name">' + escapeHtml(e.label) + '</td><td>' + escapeHtml(e.category || "—") + '</td><td class="amount">' + m(e.amount) + '</td><td><button type="button" class="btn exp-del" data-id="' + escapeHtml(e.id) + '">Delete</button></td></tr>';
          }).join("") + '</tbody></table></div>'
        : '<div class="empty">No expenses added yet.</div>');
    box.innerHTML = html;

    document.getElementById("expForm").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var msg = document.getElementById("expMsg");
      msg.textContent = "Saving…";
      profitApi("add_expense", {
        spent_on: document.getElementById("exp_date").value, label: document.getElementById("exp_label").value,
        category: document.getElementById("exp_cat").value, amount: document.getElementById("exp_amt").value,
      }).then(function (r) {
        if (!r.ok) { msg.textContent = r.error || "Could not save."; return; }
        loadProfit(rev);
      });
    });
    Array.prototype.forEach.call(box.querySelectorAll(".exp-del"), function (b) {
      b.addEventListener("click", function () {
        if (!confirm("Delete this expense?")) return;
        profitApi("delete_expense", { id: b.getAttribute("data-id") }).then(function (r) {
          if (!r.ok) { alert(r.error || "Could not delete."); return; }
          loadProfit(rev);
        });
      });
    });
  }

  function drawRevenue(d) {
    var t = d.totals, s = d.subscriptions;
    var html = revFilterHtml() + '<div class="stats-row">' +
      revStat(naira(t.allTime), revRangeActive() ? "Revenue in range" : "All-time revenue", revRangeActive() ? revRangeText() : "") +
      revStat(naira(t.thisMonth), "This month") +
      revStat(naira(t.today), "Today") +
      revStat(String(s.activeCount), "Active subscriptions", "MRR " + naira(s.mrr)) +
      revStat(naira(t.pendingManual), "Pending manual payments") +
      revStat(naira(t.feesAllTime), "Paystack fees paid by customers", "This month " + naira(t.feesThisMonth) + " \u00b7 " + (t.feePayments || 0) + " payment" + (t.feePayments === 1 ? "" : "s")) +
      '</div>';

    html += '<div id="profitBox"></div>';

    if (d.failedRenewals && d.failedRenewals.length) {
      html += '<div class="rev-alert"><div class="rev-h">' + d.failedRenewals.length + ' failed renewal' + (d.failedRenewals.length === 1 ? "" : "s") + ' need attention</div>' +
        '<div class="table-wrap rev-table"><table><thead><tr><th>Client</th><th>Order</th><th>Amount</th><th>Date</th><th>Error</th></tr></thead><tbody>' +
        d.failedRenewals.map(function (f) {
          return '<tr><td class="name">' + escapeHtml(f.clientName) + '</td><td class="amount">' + escapeHtml(f.orderReference) + '</td><td class="amount">' + naira(f.amount) + '</td><td>' + escapeHtml(fmtDay(f.chargedAt)) + '</td><td>' + escapeHtml(f.errorMessage || "—") + '</td></tr>';
        }).join("") + '</tbody></table></div></div>';
    }

    var max = Math.max.apply(null, [1].concat(d.monthlyTrend.map(function (m) { return m.total; })));
    var bars = d.monthlyTrend.map(function (m) {
      var label = new Date(m.month + "-01T00:00:00Z").toLocaleDateString(undefined, { month: "short", timeZone: "UTC" });
      return '<div class="rev-bar' + (m.total ? "" : " zero") + '" title="' + escapeHtml(m.month) + ': ' + naira(m.total) + '"><i style="height:' + Math.round((m.total / max) * 100) + '%"></i><span>' + escapeHtml(label) + '</span></div>';
    }).join("");

    html += '<div class="rev-grid">' +
      '<div class="rev-card"><h3>Monthly revenue — last 12 months</h3><div class="rev-bars">' + bars + '</div></div>' +

        ? '<div class="table-wrap rev-table" style="margin-bottom:28px;"><table><thead><tr><th>Service</th><th>Payments</th><th>Total</th></tr></thead><tbody>' +
          d.byService.map(function (r) { return '<tr><td class="name">' + escapeHtml(r.serviceName) + '</td><td class="amount">' + r.count + '</td><td class="amount">' + naira(r.total) + '</td></tr>'; }).join("") +
          '</tbody></table></div>'
        : '<div class="empty">No revenue yet.</div>');

    var SRC = { order: "Paystack", renewal: "Renewal", manual: "Manual" };
    html += '<div class="rev-h">Transactions</div>' +
      (d.transactions.length
        ? '<div class="table-wrap rev-table"><table><thead><tr><th>Source</th><th>Date</th><th>Client</th><th>Service</th><th>Amount</th><th>Status</th></tr></thead><tbody>' +
          d.transactions.map(function (x) {
            var bad = x.status !== "success" && x.status !== "verified";
            return '<tr><td><span class="pill src-' + escapeHtml(x.source) + '">' + (SRC[x.source] || escapeHtml(x.source)) + '</span></td><td>' + escapeHtml(fmtDay(x.date)) + '</td>' +
              '<td class="name">' + escapeHtml(x.clientName) + '</td><td>' + escapeHtml(x.serviceName) + '</td><td class="amount">' + naira(x.amount) + (x.fee ? '<div style="font-size:11px;color:var(--dimmer);font-weight:400;">+ ' + naira(x.fee) + ' fee</div>' : '') + '</td>' +
              '<td><span class="pill ' + (bad ? "st-failed" : "st-ok") + '">' + escapeHtml(x.status) + '</span></td></tr>';
          }).join("") + '</tbody></table></div>'
        : '<div class="empty">No transactions yet.</div>');

    document.getElementById("pageBody").innerHTML = html;
