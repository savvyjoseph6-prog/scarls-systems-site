  /* ---------------- Meta Ads (owner only) ---------------- */

  var ads = { days: 30, data: null, loading: false, at: 0 };
  var ADS_STAGES = { in_review: "In review", running: "Running", delivered: "Delivered" };

  function adsApi(action, extra) {
    return authedFetch("/admin-meta-ads", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ action: action }, extra || {})),
    }).then(function (r) { return r.data || { ok: false, error: "No response." }; })
      .catch(function () { return { ok: false, error: "Could not reach the server." }; });
  }
  function adsPerm(k) { return userRole === "owner" || (ads.data && ads.data.perms ? !!ads.data.perms[k] : false); }
  function adsCprNote(c, cur) {
    if (!c.cpr) return "";
    var good = c.promisedCpr && c.cpr <= c.promisedCpr;
    return '<div class="ads-note"' + (good ? ' style="color:#7ee0a8"' : (c.promisedCpr ? ' style="color:#ffd479"' : '')) + '>' + escapeHtml(adsMoney(c.cpr, cur)) + ' each' + (c.promisedCpr ? ' \u00b7 promised ' + escapeHtml(adsMoney(c.promisedCpr, cur)) : '') + '</div>';
  }
  function adsMoney(n, cur) {
    n = Number(n) || 0;
    try { return new Intl.NumberFormat(undefined, { style: "currency", currency: cur || "NGN", maximumFractionDigits: 0 }).format(n); }
    catch (e) { return (cur || "") + " " + Math.round(n).toLocaleString(); }
  }
  function adsNum(n) { return (Number(n) || 0).toLocaleString(); }
  function adsAgo(v) {
    if (!v) return "never";
    var m = Math.round((Date.now() - new Date(v).getTime()) / 60000);
    if (isNaN(m)) return "never";
    if (m < 1) return "just now";
    if (m < 60) return m + " min ago";
    if (m < 1440) return Math.round(m / 60) + " h ago";
    return Math.round(m / 1440) + " d ago";
  }
  function adsLoad() {
    return adsApi("overview", { days: ads.days }).then(function (d) {
      if (d && d.ok) { ads.data = d; ads.at = Date.now(); }
      return d;
    });
  }

  function renderAdsSection() {
    document.getElementById("pageSub").textContent = "Numbers from your Meta ad account, refreshed hourly. Only people you give access to can see this.";
    document.getElementById("pageActions").innerHTML = '<button type="button" class="btn" id="adsSync">Sync now</button>';
    document.getElementById("adsSync").addEventListener("click", function () {
      var b = this; b.disabled = true; b.textContent = "Syncing…";
      adsApi("sync").then(function (r) {
        b.disabled = false; b.textContent = "Sync now";
        if (r && r.ok === false) alert(r.error || "Sync failed.");
        if (currentSection === "ads") renderAdsSection();
      });
    });
    document.getElementById("pageBody").innerHTML = '<div class="empty">Loading…</div>';
    adsLoad().then(function (d) {
      if (currentSection !== "ads") return;
      if (!d || !d.ok) { document.getElementById("pageBody").innerHTML = '<div class="empty">' + escapeHtml((d && d.error) || "Could not load ads.") + '</div>'; return; }
      drawAds(d);
    });
  }

  function drawAds(d) {
    var cur = d.currency, t = d.totals, P = d.perms || { money: true, moneyEdit: true, edit: true };
    var cpr = t.results ? adsMoney(t.spend / t.results, cur) : "—";
    var html = "";
    if (!d.tokenSet) html += '<div class="rev-alert"><div class="rev-h">META_ADS_TOKEN is not set</div>Add it in Supabase → Edge Functions → Secrets, then press Sync now.</div>';
    else if (d.lastSync && d.lastSync.ok === false) html += '<div class="rev-alert"><div class="rev-h">Last sync failed (' + escapeHtml(adsAgo(d.lastSync.at)) + ')</div>' + escapeHtml(d.lastSync.error || "") + '</div>';

    html += '<div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;">' +
      '<button type="button" class="btn ads-days' + (d.days === 7 ? " primary" : "") + '" data-d="7">Last 7 days</button>' +
      '<button type="button" class="btn ads-days' + (d.days === 30 ? " primary" : "") + '" data-d="30">Last 30 days</button>' +
      '<span class="ads-note" style="margin-left:auto;">Synced ' + escapeHtml(adsAgo(d.lastSync && d.lastSync.at)) + '</span></div>';

    html += '<div class="stats-row">' +
      revStat(adsMoney(t.spend, cur), "Spend") +
      revStat(adsNum(t.impressions), "Impressions") +
      revStat(adsNum(t.clicks), "Clicks") +
      revStat(adsNum(t.results), "Results", "Cost per result " + cpr) +
      '</div>';
    if (P.money && t.clientPaid > 0) {
      html += '<div class="stats-row">' +
        revStat(adsMoney(t.clientPaid, cur), "Clients paid you", "for ads") +
        revStat(adsMoney(t.mgmtFee, cur), "Your fees", "kept by you") +
        revStat(adsMoney(t.spendAll, cur), "Spent on Meta", "all time, linked budgets") +
        revStat(adsMoney(t.remaining, cur), "Budget left", "across campaigns") +
        '</div>';
    }

    var max = Math.max.apply(null, [1].concat(d.daily.map(function (x) { return x.spend; })));
    var bars = d.daily.map(function (x) {
      var lbl = new Date(x.day + "T00:00:00Z").toLocaleDateString(undefined, { day: "numeric", timeZone: "UTC" });
      return '<div class="rev-bar' + (x.spend ? "" : " zero") + '" title="' + escapeHtml(x.day + ": " + adsMoney(x.spend, cur) + " · " + x.results + " results") + '"><i style="height:' + Math.round((x.spend / max) * 100) + '%"></i><span>' + escapeHtml(lbl) + '</span></div>';
    }).join("");
    html += '<div class="rev-card" style="margin-bottom:28px;"><h3>Daily spend</h3>' + (d.daily.length ? '<div class="rev-bars">' + bars + '</div>' : '<div class="ads-note">No spend in this period.</div>') + '</div>';

    html += '<div class="rev-h">Campaigns</div>';
    if (!d.campaigns.length) html += '<div class="empty">No campaigns found yet.</div>';
    else {
      html += '<div class="table-wrap rev-table"><table><thead><tr><th>Campaign</th><th>Stage</th><th>Spend</th>' + (P.money ? '<th>Budget left</th>' : '') + '<th>Reach</th><th>Clicks</th><th>Results</th><th>Client project</th><th></th></tr></thead><tbody>' +
        d.campaigns.map(function (c) {
          var opts = '<option value="">— Not linked —</option>' + d.projects.map(function (p) {
            var sel = c.projectId === p.id || (!c.projectId && c.suggestedProjectId === p.id);
            return '<option value="' + escapeHtml(p.id) + '"' + (sel ? " selected" : "") + '>' + escapeHtml(p.label) + '</option>';
          }).join("");
          var sug = !c.projectId && c.suggestedProjectId;
          return '<tr><td class="name">' + escapeHtml(c.name) + '<div class="ads-note" style="font-weight:400;">' + escapeHtml(String(c.objective || "").replace(/^OUTCOME_/, "").toLowerCase()) + '</div></td>' +
            '<td><span class="pill">' + escapeHtml(ADS_STAGES[c.stage] || c.stage) + '</span><div class="ads-note">Meta: ' + escapeHtml(String(c.status || "\u2014").toLowerCase().replace(/_/g, " ")) + '</div></td>' +
            '<td class="amount">' + escapeHtml(adsMoney(c.spend, cur)) + '</td>' + (P.money ? '<td class="amount">' + (c.remaining == null ? '<span class="ads-note">not set</span>' : '<span' + (c.remaining < 0 ? ' style="color:var(--red)"' : '') + '>' + escapeHtml(adsMoney(c.remaining, cur)) + '</span>') + '</td>' : '') + '<td class="amount">' + adsNum(c.reach) + '</td><td class="amount">' + adsNum(c.clicks) + '</td><td class="amount">' + adsNum(c.results) + adsCprNote(c, cur) + '</td>' +
            '<td><select class="ads-link" data-c="' + escapeHtml(c.id) + '" style="max-width:220px;"' + (P.edit ? '' : ' disabled') + '>' + opts + '</select>' +
            (sug && P.edit ? '<div class="ads-note">Suggested match \u2014 <a href="#" class="ads-accept" data-c="' + escapeHtml(c.id) + '">confirm</a></div>' : '') + '</td>' +
            '<td>' + (P.edit ? '<button type="button" class="btn ads-manage" data-c="' + escapeHtml(c.id) + '">Manage</button>' : '') + '</td></tr>';
        }).join("") + '</tbody></table></div>';
    }
    html += '<div class="ads-note" style="margin-top:14px;">Results are counted by each campaign’s objective (leads, purchases, link clicks, conversations). Reach is de-duplicated over the selected period.</div>';
    document.getElementById("pageBody").innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll(".ads-days"), function (b) {
      b.addEventListener("click", function () { ads.days = Number(b.getAttribute("data-d")); renderAdsSection(); });
    });
    function link(cid, pid, sel) {
      if (sel) sel.disabled = true;
      adsApi("link", { campaign_id: cid, project_id: pid || null }).then(function (r) {
        if (!r.ok) alert(r.error || "Could not link.");
        if (currentSection === "ads") renderAdsSection();
      });
    }
    Array.prototype.forEach.call(document.querySelectorAll(".ads-link"), function (s) {
      s.addEventListener("change", function () { link(s.getAttribute("data-c"), s.value, s); });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".ads-manage"), function (b) {
      b.addEventListener("click", function () {
        var c = d.campaigns.filter(function (x) { return x.id === b.getAttribute("data-c"); })[0];
        if (c) adsOpenManage(c, d);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".ads-accept"), function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        var s = document.querySelector('.ads-link[data-c="' + a.getAttribute("data-c") + '"]');
        link(a.getAttribute("data-c"), s ? s.value : "", s);
      });
    });
  }


  function adsOpenManage(c, d) {
    var cur = d.currency, P = d.perms || { money: true, moneyEdit: true, edit: true };
    var proj = c.projectId ? d.projects.filter(function (p) { return p.id === c.projectId; })[0] : null;
    document.getElementById("drawerTitle").textContent = c.name;
    document.getElementById("drawerSub").textContent = proj ? proj.label : "Not linked to a client yet";
    var stageOpts = Object.keys(ADS_STAGES).map(function (k) { return '<option value="' + k + '"' + (k === c.stage ? " selected" : "") + '>' + ADS_STAGES[k] + '</option>'; }).join("");
    document.getElementById("drawerBody").innerHTML =
      '<div class="field"><label>Stage the client sees</label><select id="ad_stage">' + stageOpts + '</select></div>' +
      '<div class="field"><label>Note for the client <span class="ads-note">(optional, shown with the stage)</span></label><textarea id="ad_note" placeholder="e.g. Targeting Lagos, ages 25–45">' + escapeHtml(c.stageNote || "") + '</textarea></div>' +
      (c.projectId ? '<label class="check-row"><input type="checkbox" id="ad_notify" checked> Email the client if I change the stage</label>' : '<div class="ads-note" style="margin-bottom:12px;">Link this campaign to a client project to email them and show it on their page.</div>') +
      '<div class="field"><label>Promised cost per result (' + escapeHtml(cur) + ') <span class="ads-note">(blank = default' + (d.defaultCpr ? ' ' + escapeHtml(adsMoney(d.defaultCpr, cur)) : '') + '; clients see a simple ahead / on target note)</span></label><input id="ad_promised" type="number" min="0" step="any" value="' + (c.promisedOwn || "") + '" placeholder="' + (d.defaultCpr || "") + '"></div>' +
      (P.moneyEdit ? '<div class="two-col"><div class="field"><label>Client paid (' + escapeHtml(cur) + ')</label><input id="ad_paid" type="number" min="0" step="any" value="' + (c.clientPaid || "") + '" placeholder="0"></div>' +
      '<div class="field"><label>Your fee (' + escapeHtml(cur) + ')</label><input id="ad_fee" type="number" min="0" step="any" value="' + (c.mgmtFee || "") + '" placeholder="0"></div></div>' : '') +
      (P.money ? '<div class="rev-card" style="padding:12px;" id="ad_calc"></div>' : '');
    function calc() {
      if (!P.money) return;
      var pe = document.getElementById("ad_paid"), fe = document.getElementById("ad_fee");
      var paid = pe ? Number(pe.value) || 0 : c.clientPaid, fee = fe ? Number(fe.value) || 0 : c.mgmtFee;
      var budget = Math.max(0, paid - fee), left = budget - c.spentAll;
      document.getElementById("ad_calc").innerHTML =
        '<div class="rev-src"><span>Ad budget (paid − fee)</span><span class="amount">' + escapeHtml(adsMoney(budget, cur)) + '</span></div>' +
        '<div class="rev-src"><span>Spent on Meta so far</span><span class="amount">' + escapeHtml(adsMoney(c.spentAll, cur)) + '</span></div>' +
        '<div class="rev-src"><span>Budget left</span><span class="amount"' + (paid > 0 && left < 0 ? ' style="color:var(--red)"' : '') + '>' + (paid > 0 ? escapeHtml(adsMoney(left, cur)) : "—") + '</span></div>' +
        (fee > paid ? '<div class="ads-note" style="color:var(--red)">The fee is more than what the client paid.</div>' : '');
    }
    calc();
    if (document.getElementById("ad_paid")) { document.getElementById("ad_paid").addEventListener("input", calc); document.getElementById("ad_fee").addEventListener("input", calc); }
    setDrawerFooter("save", "Save");
    document.getElementById("drawerStatus").textContent = "";
    document.getElementById("drawerSave").onclick = function () {
      var statusEl = document.getElementById("drawerStatus"), btn = document.getElementById("drawerSave");
      var nt = document.getElementById("ad_notify");
      var payload = {
        campaign_id: c.id, stage: document.getElementById("ad_stage").value, stage_note: document.getElementById("ad_note").value,
        promised_cpr: document.getElementById("ad_promised").value,
        notify: nt ? nt.checked : false,
      };
      if (P.moneyEdit) { payload.client_paid = document.getElementById("ad_paid").value || 0; payload.mgmt_fee = document.getElementById("ad_fee").value || 0; }
      btn.disabled = true; statusEl.textContent = "Saving…"; statusEl.className = "save-status";
      adsApi("update", payload).then(function (r) {
        btn.disabled = false;
        if (r && r.ok) {
          statusEl.textContent = r.emailed ? "Saved — client emailed" : "Saved"; statusEl.className = "save-status ok";
          ads.data = null;
          setTimeout(function () { closeDrawer(); if (currentSection === "ads") renderAdsSection(); }, 500);
        } else { statusEl.textContent = (r && r.error) || "Could not save."; statusEl.className = "save-status err"; }
      });
    };
    scrim.classList.add("open"); drawer.classList.add("open");
  }

  function adsDrawerBox(projectId) {
    var box = document.getElementById("d_adsBox");
    if (!box || !canSee("ads")) return;
    var paint = function (d) {
      var b = document.getElementById("d_adsBox");
      if (!b || !d || !d.ok) return;
      var mine = d.campaigns.filter(function (c) { return c.projectId === projectId; });
      if (!mine.length) { b.innerHTML = ""; return; }
      var sum = { spend: 0, clicks: 0, results: 0, reach: 0, paid: 0, fee: 0, left: 0 };
      mine.forEach(function (c) { sum.paid += c.clientPaid; sum.fee += c.mgmtFee; if (c.remaining != null) sum.left += c.remaining; sum.spend += c.spend; sum.clicks += c.clicks; sum.results += c.results; sum.reach += Number(c.reach) || 0; });
      b.innerHTML = '<div class="field"><label>Facebook ads · last ' + d.days + ' days</label>' +
        '<div class="rev-card" style="padding:12px;">' +
        '<div class="rev-src"><span>Spend</span><span class="amount">' + escapeHtml(adsMoney(sum.spend, d.currency)) + '</span></div>' +
        '<div class="rev-src"><span>Reach</span><span class="amount">' + adsNum(sum.reach) + '</span></div>' +
        '<div class="rev-src"><span>Clicks</span><span class="amount">' + adsNum(sum.clicks) + '</span></div>' +
        '<div class="rev-src"><span>Results</span><span class="amount">' + adsNum(sum.results) + '</span></div>' +
        (sum.paid > 0 ? '<div class="rev-src"><span>Client paid \u00b7 your fee</span><span class="amount">' + escapeHtml(adsMoney(sum.paid, d.currency) + " \u00b7 " + adsMoney(sum.fee, d.currency)) + '</span></div>' +
          '<div class="rev-src"><span>Budget left</span><span class="amount">' + escapeHtml(adsMoney(sum.left, d.currency)) + '</span></div>' : '') +
        '<div class="ads-note" style="margin-top:6px;">Stage: ' + mine.map(function (c) { return escapeHtml(ADS_STAGES[c.stage] || c.stage); }).join(" \u00b7 ") + '</div>' +
        '<div class="ads-note" style="margin-top:6px;">' + mine.map(function (c) { return escapeHtml(c.name); }).join(" · ") + '</div></div></div>';
    };
    if (ads.data && Date.now() - ads.at < 120000) paint(ads.data);
    else adsLoad().then(paint);
  }

  /* ---------------- Team chat ---------------- */

  var authUserName = "", authUserEmail = "";
  var TAG_COLORS = ["#ffd479", "#7fb2ff", "#c98bff", "#7ee0a8", "#ff8b8b", "#ffa86b", "#9a9aa4"];
  var CHAT_EMOJIS = ["👍", "❤️", "😂", "😮", "🙏", "✅"];
  var chat = {
    ready: false, me: null, members: {}, convs: [], active: null, activeConv: null, msgs: [], cursor: null, hasMore: false,
    typing: [], reads: [], pins: [], timer: null, badgeTimer: null, busy: false, editing: null, replyTo: null, unreadTotal: 0,
    lastTypingPost: 0, rec: null, audio: null, audioId: null, membersAt: 0, token: 0,
    pendingOpen: null, pendingConv: null, mention: null, pushOn: false,
  };

  function chatApi(action, extra) {
    return authedFetch("/admin-chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ action: action, name: authUserName, email: authUserEmail }, extra || {})),
    }).then(function (r) { return r.data || { ok: false, error: "No response." }; })
      .catch(function () { return { ok: false, error: "Could not reach the server." }; });
  }
  function chatMember(sub) {
    return chat.members[sub] || { sub: sub, name: "Team member", tag: "", color: "", is_owner: false };
  }
  function chatSetMembers(list) {
    chat.members = {};
    (list || []).forEach(function (m) { chat.members[m.sub] = m; });
    chat.membersAt = Date.now();
  }
  function chatAvatarColor(sub) {
    var h = 0; for (var i = 0; i < sub.length; i++) h = (h * 31 + sub.charCodeAt(i)) >>> 0;
    return ["#2a3a66", "#3d2a66", "#1f4d3a", "#5a2a2a", "#5a4a1f", "#1f4a55"][h % 6];
  }
  function chatAvatar(name, sub, big) {
    return '<span class="chat-av' + (big ? " big" : "") + '" style="background:' + chatAvatarColor(sub || name) + '">' + escapeHtml((name || "?").trim().charAt(0).toUpperCase()) + '</span>';
  }
  function chatTagPill(m) {
    if (!m || !m.tag) return "";
    var c = m.color || "#9a9aa4";
    return '<span class="chat-tag" style="color:' + c + ';border-color:' + c + '55;background:' + c + '1a">' + escapeHtml(m.tag) + '</span>';
  }
  function chatTime(v) {
    var d = new Date(v); return isNaN(d) ? "" : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
  function chatDayLabel(v) {
    var d = new Date(v), t = new Date();
    var sod = function (x) { return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(); };
    var diff = Math.round((sod(t) - sod(d)) / 86400000);
    if (diff === 0) return "Today"; if (diff === 1) return "Yesterday";
    return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: d.getFullYear() === t.getFullYear() ? undefined : "numeric" });
  }
  function chatConvName(c) {
    return c.kind === "group" ? "Team" : c.kind === "project" ? (c.title || "Project") : chatMember(c.other_sub).name;
  }
  function chatConvSeed(c) { return c.kind === "group" ? "team" : c.kind === "project" ? c.id : c.other_sub; }
  function chatSnippet(m) {
    if (!m) return "";
    if (m.deleted) return "Deleted message";
    if (m.kind === "voice") return "Voice message";
    if (m.kind === "image") return m.body ? "Photo: " + m.body : "Photo";
    if (m.kind === "file") return "File";
    return m.body || "";
  }
  function chatPreview(c) {
    if (!c.last) return c.kind === "group" ? "Say hello to the team" : "No messages yet";
    var who = c.last.sender_sub === chat.me.sub ? "You: " : (c.kind !== "dm" ? chatMember(c.last.sender_sub).name.split(" ")[0] + ": " : "");
    if (c.last.deleted) return who + "Message deleted";
    if (c.last.kind === "voice") return who + "Voice message";
    if (c.last.kind === "image") return who + "Photo";
    if (c.last.kind === "file") return who + "File";
    return who + (c.last.body || "");
  }
  function chatRegEsc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
  function chatRich(text) {
    var html = escapeHtml(text).replace(/(https?:\/\/[^\s<]+)/g, function (u) {
      return '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + '</a>';

      var names = Object.keys(chat.members).map(function (s) { return chat.members[s]; }).filter(function (m) { return m.name; })
        .sort(function (a, b) { return b.name.length - a.name.length; });
      names.forEach(function (m) {
        var re = new RegExp("@" + chatRegEsc(escapeHtml(m.name)) + "(?![\\p{L}\\p{N}_])", "giu");
        html = html.replace(re, function (t) { return '<span class="chat-mention' + (m.sub === chat.me.sub ? " me" : "") + '">' + t + '</span>'; });
      });
      html = html.replace(/@(all|everyone)(?![\p{L}\p{N}_])/giu, function (t) { return '<span class="chat-mention me">' + t + '</span>'; });

  }
  function chatFmtDur(s) {
    s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
  }
  function chatFmtSize(n) {

  /* ----- push notifications ----- */

  function chatPushSupported() { return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window; }
  function chatIsIos() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
  function chatIsStandalone() { return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true; }
  function chatB64uToArr(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
    var bin = atob(s), out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out;
  }
  function chatRegisterSw() {

  function chatPushSync() {
    if (!chatPushSupported() || Notification.permission !== "granted") { chat.pushOn = false; chatDrawPushBar(); return Promise.resolve(); }
    return navigator.serviceWorker.ready.then(function (reg) { return reg.pushManager.getSubscription(); }).then(function (sub) {
      chat.pushOn = !!sub;

      chatDrawPushBar();
    }).catch(function () { chatDrawPushBar(); });
  }
  function chatPushEnable() {
    if (!chatPushSupported()) return;
    Notification.requestPermission().then(function (perm) {
      if (perm !== "granted") { chatDrawPushBar(); return; }
      return chatApi("push_key").then(function (k) {
        if (!k.ok || !k.key) throw new Error("Notifications are not set up on the server yet.");
        return navigator.serviceWorker.ready.then(function (reg) {
          return reg.pushManager.getSubscription().then(function (existing) {
            return existing || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: chatB64uToArr(k.key) });
          });
        });
      }).then(function (sub) {
        return chatApi("push_subscribe", { subscription: sub.toJSON(), ua: navigator.userAgent });
      }).then(function (r) {
        if (!r.ok) throw new Error(r.error || "Could not save the subscription.");

  }
  function chatPushDisable() {
    navigator.serviceWorker.ready.then(function (reg) { return reg.pushManager.getSubscription(); }).then(function (sub) {

    }).then(function () { chat.pushOn = false; chatDrawPushBar(); }).catch(function () {});
  }
  function chatDrawPushBar() {
    var el = document.getElementById("chatPushBar"); if (!el) return;
    var html = "";
    if (!chatPushSupported()) {
      if (chatIsIos() && !chatIsStandalone()) html = 'To get chat notifications on iPhone: tap <b>Share</b>, then <b>Add to Home Screen</b>, open SCARLS from your home screen, and turn notifications on here.';
    } else if (Notification.permission === "denied") {
      html = 'Notifications are blocked for this site. Allow them in your browser’s site settings to get a ping when someone messages you.';
    } else if (chat.pushOn) {
      html = 'Notifications are on for this device. <button type="button" class="chat-link" id="chatPushOff">Turn off</button>';
    } else {
      html = 'Get a ping on this device when someone messages you. <button type="button" class="btn primary" id="chatPushOn">Turn on notifications</button>';
    }
    el.style.display = html ? "" : "none";
    el.innerHTML = html;
    var on = document.getElementById("chatPushOn"); if (on) on.addEventListener("click", chatPushEnable);
    var off = document.getElementById("chatPushOff"); if (off) off.addEventListener("click", chatPushDisable);
  }

  function chatGoToConv(id) {
    if (currentSection !== "chat") { chat.pendingOpen = id; goTo("chat"); return; }
    if (chat.convs.some(function (c) { return c.id === id; })) chatOpen(id, false);
    else chatApi("sync").then(function (s) { if (s.ok) { chat.convs = s.conversations; chatDrawList(); chatOpen(id, false); } });
  }
  function chatOpenProject(pid, title) {

      chat.pendingConv = { id: d.id, kind: "project", title: title || "Project", project_id: pid, unread: 0, muted: false, last: null };
      chat.pendingOpen = d.id; goTo("chat");
    });
  }

  /* ----- layout ----- */

  function renderChatSection() {
    document.getElementById("pageSub").textContent = "Talk to your team. Private chats are visible only to the people in them.";
    document.getElementById("pageBody").innerHTML =
      '<div class="chat-push" id="chatPushBar" style="display:none"></div>' +
      '<div class="chat-wrap" id="chatWrap">' +
        '<div class="chat-side" id="chatSide">' +

  function chatUpdateBadge() {

  function chatOpen(id, silent) {

      '<button type="button" class="chat-bell" id="chatMuteBtn"></button></div>' +

  function chatDrawMute() {
    var b = document.getElementById("chatMuteBtn"), c = chatCurConv(); if (!b || !c) return;

  function chatSync(first) {
    clearTimeout(chat.timer);

      if (token !== chat.token || active !== chat.active) return;
      if (d.ok) {
        chat.convs = d.conversations; chat.typing = d.typing || []; chat.reads = d.reads || []; chat.pins = d.pins || [];

        else chat.activeConv = chat.convs.filter(function (c) { return c.id === active; })[0] || chat.activeConv;
        var unknown = false;

      }

    });

  function chatMerge(list) {
    var changed = false;
    list.forEach(function (m) {
      var i = -1;
      for (var k = chat.msgs.length - 1; k >= 0; k--) { if (chat.msgs[k].id === m.id) { i = k; break; } }
      if (i === -1) { chat.msgs.push(m); changed = true; }
      else {
        var o = chat.msgs[i];
        if (o.edited_at !== m.edited_at || o.deleted !== m.deleted || o.pinned !== m.pinned || JSON.stringify(o.reactions) !== JSON.stringify(m.reactions)) {
          m.url = m.url || o.url; chat.msgs[i] = m; changed = true;
        }
      }
    });
    if (changed) chat.msgs.sort(function (a, b) { return new Date(a.created_at) - new Date(b.created_at); });
    return changed;
  }

  function chatNearBottom() {
    var el = document.getElementById("chatMsgs"); if (!el) return true;

  }

  function chatLoadOlder() {

      chat.hasMore = !!d.hasMore; chatMerge(d.messages || []); chatDrawMessages(false);

  /* ----- messages ----- */

  function chatMsgHtml(m, prev, conv) {

        '<div class="chat-wave"><div class="chat-wave-fill"></div></div><span class="chat-dur">' + chatFmtDur(m.duration_s) + '</span></div>';
    } else if (m.kind === "image") {

        (m.body ? '<div class="chat-text">' + chatRich(m.body) + '</div>' : "");
    } else inner = '<div class="chat-text">' + chatRich(m.body || "") + '</div>';
    var menu = !m.deleted ? '<button type="button" class="chat-more" data-id="' + m.id + '" aria-label="Message options">&#8942;</button>' : "";
    var seen = "";
    if (mine && conv.kind === "dm" && !m.deleted) {
      var last = null; for (var i = chat.msgs.length - 1; i >= 0; i--) if (chat.msgs[i].sender_sub === chat.me.sub && !chat.msgs[i].deleted) { last = chat.msgs[i]; break; }
      var rd = chat.reads[0];
      if (last && last.id === m.id) seen = rd && new Date(rd.last_read_at) >= new Date(m.created_at) ? " &middot; Seen" : "";

  function chatDrawMessages(stick) {
    var box = document.getElementById("chatMsgs"); if (!box) return;

  function chatReact(mid, emoji) {

  function chatMsgMenu(btn) {

    var m = chat.msgs.filter(function (x) { return x.id === btn.getAttribute("data-id"); })[0]; if (!m) return;

    CHAT_EMOJIS.forEach(function (em) {

      b.addEventListener("click", function () { menu.remove(); chatReact(m.id, em); }); emojiRow.appendChild(b);
    });
    menu.appendChild(emojiRow);

    if (conv && (conv.kind !== "group" || userRole === "owner")) {
      items.push([m.pinned ? "Unpin" : "Pin", function () {
        chatApi("pin", { message_id: m.id, pinned: !m.pinned }).then(function (d) { if (d.ok) chatSync(false); else window.alert(d.error || "Could not pin."); });
      }]);

    var top = r.bottom + 4; if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 4);
    var left = Math.min(Math.max(8, r.right - w), window.innerWidth - w - 8);
    menu.style.top = top + "px"; menu.style.left = left + "px"; menu.style.visibility = "";

  function chatTogglePlay(btn) {
    var wrap = btn.closest(".chat-voice"), id = wrap.getAttribute("data-id"), url = btn.getAttribute("data-url");
    if (!url) return;
    if (chat.audio && chat.audioId === id) {
      if (chat.audio.paused) chat.audio.play(); else chat.audio.pause();
      return;
    }
    if (chat.audio) { try { chat.audio.pause(); } catch (e) {} }
    Array.prototype.forEach.call(document.querySelectorAll(".chat-play"), function (b) { b.innerHTML = "&#9654;"; });
    Array.prototype.forEach.call(document.querySelectorAll(".chat-wave-fill"), function (f) { f.style.width = "0"; });
    var a = new Audio(url); chat.audio = a; chat.audioId = id;
    a.addEventListener("play", function () { btn.innerHTML = "&#10074;&#10074;"; });
    a.addEventListener("pause", function () { btn.innerHTML = "&#9654;"; });
    a.addEventListener("ended", function () { btn.innerHTML = "&#9654;"; var f = wrap.querySelector(".chat-wave-fill"); if (f) f.style.width = "0"; chat.audio = null; chat.audioId = null; });
    a.addEventListener("timeupdate", function () { var f = wrap.querySelector(".chat-wave-fill"); if (f && a.duration) f.style.width = Math.min(100, a.currentTime / a.duration * 100) + "%"; });
    a.play().catch(function () { window.alert("Could not play this voice note."); });

  /* ----- composer ----- */

  function chatMentionHide() { chat.mention = null; var b = document.getElementById("chatMentionBox"); if (b) { b.style.display = "none"; b.innerHTML = ""; } }
  function chatMentionCheck(input) {
    var conv = chatCurConv();
    if (!conv || conv.kind === "dm") { chatMentionHide(); return; }
    var before = input.value.slice(0, input.selectionStart || 0);
    var mt = /(^|\s)@([^\s@]{0,30})$/.exec(before);
    if (!mt) { chatMentionHide(); return; }
    var q = mt[2].toLowerCase(), start = before.length - mt[2].length - 1;
    var items = Object.keys(chat.members).map(function (s) { return chat.members[s]; })
      .filter(function (m) { return m.sub !== chat.me.sub && (conv.kind !== "project" || m.projects) && m.name.toLowerCase().indexOf(q) !== -1; })
      .slice(0, 6).map(function (m) { return { name: m.name, member: m }; });
    if ("all".indexOf(q) === 0 && !(items.length === 0 && q.length > 3)) items.push({ name: "all", member: null });
    if (!items.length) { chatMentionHide(); return; }
    chat.mention = { items: items, idx: 0, start: start, end: before.length };
    chatMentionDraw();
  }
  function chatMentionDraw() {
    var box = document.getElementById("chatMentionBox"), mn = chat.mention; if (!box || !mn) return;
    box.style.display = "";
    box.innerHTML = mn.items.map(function (it, i) {
      return '<button type="button" class="chat-mention-item' + (i === mn.idx ? " on" : "") + '" data-i="' + i + '">' +
        (it.member ? chatAvatar(it.name, it.member.sub) + '<span>' + escapeHtml(it.name) + '</span>' + chatTagPill(it.member) : '<span class="chat-av">@</span><span>all <small>notify everyone</small></span>') + '</button>';
    }).join("");
    Array.prototype.forEach.call(box.querySelectorAll(".chat-mention-item"), function (b) {
      b.addEventListener("mousedown", function (e) { e.preventDefault(); chatMentionPick(Number(b.getAttribute("data-i"))); });
    });
  }
  function chatMentionPick(i) {
    var mn = chat.mention, input = document.getElementById("chatInput"); if (!mn || !input) return;
    var it = mn.items[i], ins = "@" + it.name + " ";
    input.value = input.value.slice(0, mn.start) + ins + input.value.slice(mn.end);
    var pos = mn.start + ins.length; input.setSelectionRange(pos, pos);
    chatMentionHide(); input.focus(); input.dispatchEvent(new Event("input"));
  }

  function chatDrawCompose() {
    var box = document.getElementById("chatCompose"); if (!box) return;
    if (chat.rec) { chatDrawRecording(); return; }
    var ed = chat.editing, rp = chat.replyTo;
    box.innerHTML =
      (ed ? '<div class="chat-editing">Editing message <button type="button" class="chat-link" id="chatEditCancel">Cancel</button></div>' : "") +
      (rp ? '<div class="chat-replying"><div><b>Replying to ' + escapeHtml(chatMember(rp.sender_sub).name) + '</b><span>' + escapeHtml(chatSnippet(rp)).slice(0, 100) + '</span></div><button type="button" class="chat-link" id="chatReplyCancel">Cancel</button></div>' : "") +
      '<div class="chat-compose-row">' +
      (ed ? "" : '<button type="button" class="chat-icon" id="chatAttach" aria-label="Attach a file or photo">+</button><input type="file" id="chatFile" style="display:none" accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.txt,.csv">') +
      '<textarea id="chatInput" rows="1" placeholder="Type a message"></textarea>' +
      '<button type="button" class="chat-icon main" id="chatAction" aria-label="Send"></button></div>';
    var input = document.getElementById("chatInput"), action = document.getElementById("chatAction");
    if (ed) input.value = ed.body || "";
    var refresh = function () {
      var has = input.value.trim().length > 0;
      action.dataset.mode = has || ed ? "send" : "mic";
      action.innerHTML = has || ed ? "&#10148;" : "&#127908;";
      action.setAttribute("aria-label", has || ed ? "Send" : "Record a voice note");
      input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px";
    };
    refresh();
    input.addEventListener("input", function () {
      refresh(); chatMentionCheck(input);
      var now = Date.now();
      if (input.value.trim() && now - chat.lastTypingPost > 3000) { chat.lastTypingPost = now; chatApi("typing", { conversation_id: chat.active }); }
    });
    input.addEventListener("keydown", function (e) {
      var mn = chat.mention;
      if (mn) {
        if (e.key === "ArrowDown") { e.preventDefault(); mn.idx = (mn.idx + 1) % mn.items.length; chatMentionDraw(); return; }
        if (e.key === "ArrowUp") { e.preventDefault(); mn.idx = (mn.idx - 1 + mn.items.length) % mn.items.length; chatMentionDraw(); return; }
        if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); chatMentionPick(mn.idx); return; }
        if (e.key === "Escape") { e.preventDefault(); chatMentionHide(); return; }
      }
      var touch = window.matchMedia && window.matchMedia("(pointer:coarse)").matches;
      if (e.key === "Enter" && !e.shiftKey && !touch) { e.preventDefault(); chatSend(); }
    });
    input.addEventListener("blur", function () { setTimeout(chatMentionHide, 150); });
    action.addEventListener("click", function () { if (action.dataset.mode === "send") chatSend(); else chatStartRecording(); });
    var cancel = document.getElementById("chatEditCancel"); if (cancel) cancel.addEventListener("click", function () { chat.editing = null; chatDrawCompose(); });
    var rc = document.getElementById("chatReplyCancel"); if (rc) rc.addEventListener("click", function () { chat.replyTo = null; chatDrawCompose(); });
    var attach = document.getElementById("chatAttach"), file = document.getElementById("chatFile");
    if (attach) { attach.addEventListener("click", function () { file.click(); }); file.addEventListener("change", function () { if (file.files[0]) chatSendFile(file.files[0], input.value.trim()); file.value = ""; }); }
    var coarse = window.matchMedia && window.matchMedia("(pointer:coarse)").matches;
    if (!ed && !coarse) setTimeout(function () { input.focus(); }, 0);
  }

  function chatSend() {
    var input = document.getElementById("chatInput"); if (!input) return;
    var body = input.value.trim(); if (!body) return;
    var id = chat.active, action = document.getElementById("chatAction"); if (action) action.disabled = true;
    var p = chat.editing ? chatApi("edit", { id: chat.editing.id, body: body })
      : chatApi("send", { conversation_id: id, body: body, reply_to: chat.replyTo ? chat.replyTo.id : undefined });
    p.then(function (d) {
      if (action) action.disabled = false;
      if (!d.ok) { window.alert(d.error || "Could not send."); return; }
      chat.editing = null; chat.replyTo = null; input.value = ""; chatMentionHide();
      if (d.message) chatMerge([d.message]);
      chatDrawCompose(); chatDrawMessages(true); chatSync(false);
    });
  }

  function chatUpload(blob, filename, mime) {
    mime = String(mime || blob.type || "application/octet-stream").split(";")[0];
    return chatApi("upload_url", { conversation_id: chat.active, filename: filename, mime: mime, size: blob.size }).then(function (u) {
      if (!u.ok) throw new Error(u.error || "Upload failed.");
      var fd = new FormData(); fd.append("cacheControl", "3600"); fd.append("", new Blob([blob], { type: mime }), filename);
      return fetch(u.signedUrl, { method: "PUT", headers: { "apikey": SUPABASE_ANON_KEY }, body: fd }).then(function (r) {
        if (!r.ok) throw new Error("The upload was rejected (" + r.status + ").");
        return { path: u.path, mime: mime };
      });
    });
  }

  function chatSendFile(file, caption) {
    if (file.size > 12 * 1024 * 1024) { window.alert("Files can be up to 12 MB."); return; }
    var input = document.getElementById("chatInput"); var action = document.getElementById("chatAction");
    var replyId = chat.replyTo ? chat.replyTo.id : undefined;
    if (action) action.disabled = true;
    var sub = document.getElementById("chatSub"); if (sub) { sub.textContent = "Sending file…"; sub.classList.add("typing"); }
    chatUpload(file, file.name, file.type).then(function (up) {
      return chatApi("send", { conversation_id: chat.active, body: caption, file_path: up.path, file_name: file.name, mime: up.mime, size_bytes: file.size, reply_to: replyId });
    }).then(function (d) {
      if (!d.ok) throw new Error(d.error || "Could not send.");
      if (input) input.value = "";
      chat.replyTo = null;
      chatMerge([d.message]); chatDrawCompose(); chatDrawMessages(true); chatSync(false);
    }).catch(function (e) { window.alert(e.message || "Could not send the file."); chatDrawCompose(); chatDrawTyping(); });
  }

  /* ----- voice notes ----- */

  function chatStartRecording() {
    if (!navigator.mediaDevices || !window.MediaRecorder) { window.alert("Voice notes are not supported in this browser."); return; }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
      var type = types.filter(function (t) { return MediaRecorder.isTypeSupported(t); })[0] || "";
      var rec = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
      var r = { rec: rec, stream: stream, chunks: [], started: Date.now(), timer: null, cancelled: false, mime: (rec.mimeType || type || "audio/webm").split(";")[0] };
      rec.addEventListener("dataavailable", function (e) { if (e.data && e.data.size) r.chunks.push(e.data); });
      rec.addEventListener("stop", function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        clearInterval(r.timer);
        if (r.cancelled) return;
        var secs = Math.round((Date.now() - r.started) / 1000);
        var blob = new Blob(r.chunks, { type: r.mime });
        if (secs < 1 || blob.size < 500) { chat.rec = null; chatDrawCompose(); return; }
        var ext = r.mime.indexOf("mp4") !== -1 ? "m4a" : r.mime.indexOf("ogg") !== -1 ? "ogg" : "webm";
        var replyId = chat.replyTo ? chat.replyTo.id : undefined;
        var box = document.getElementById("chatCompose"); if (box) box.innerHTML = '<div class="chat-recording"><span>Sending voice note…</span></div>';
        chatUpload(blob, "voice-note." + ext, r.mime).then(function (up) {
          return chatApi("send", { conversation_id: chat.active, body: "", file_path: up.path, file_name: "Voice note", mime: up.mime, size_bytes: blob.size, duration_s: secs, reply_to: replyId });
        }).then(function (d) {
          chat.rec = null;
          if (!d.ok) throw new Error(d.error || "Could not send.");
          chat.replyTo = null;
          chatMerge([d.message]); chatDrawCompose(); chatDrawMessages(true); chatSync(false);
        }).catch(function (e) { chat.rec = null; window.alert(e.message || "Could not send the voice note."); chatDrawCompose(); });
      });
      chat.rec = r; rec.start(250); chatDrawRecording();
      r.timer = setInterval(function () { var el = document.getElementById("chatRecTime"); if (el) el.textContent = chatFmtDur((Date.now() - r.started) / 1000); if (Date.now() - r.started > 10 * 60 * 1000) chatStopRecording(); }, 500);
    }).catch(function () { window.alert("Allow microphone access in your browser to send voice notes."); });
  }
  function chatDrawRecording() {
    var box = document.getElementById("chatCompose"); if (!box) return;
    box.innerHTML = '<div class="chat-recording"><span class="chat-rec-dot"></span><span id="chatRecTime">0:00</span><span class="chat-rec-hint">Recording…</span>' +
      '<button type="button" class="btn" id="chatRecCancel">Cancel</button><button type="button" class="btn primary" id="chatRecSend">Send</button></div>';
    document.getElementById("chatRecCancel").addEventListener("click", function () { chatCancelRecording(false); });
    document.getElementById("chatRecSend").addEventListener("click", chatStopRecording);
  }
  function chatStopRecording() { if (chat.rec && chat.rec.rec.state !== "inactive") chat.rec.rec.stop(); }
  function chatCancelRecording(silent) {
    var r = chat.rec; if (!r) return;
    r.cancelled = true; clearInterval(r.timer);
    try { if (r.rec.state !== "inactive") r.rec.stop(); } catch (e) {}
    try { r.stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    chat.rec = null; if (!silent) chatDrawCompose();
  }

  function renderSettingsSection() {
    document.getElementById("pageBody").innerHTML = '<div class="empty">Loading…</div>';
    Promise.all([
      authedFetch("/admin-get-setting", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: "announcement" }) }),
      authedFetch("/admin-get-setting", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: "sale_popup_frequency" }) }),
      authedFetch("/admin-get-setting", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: "paystack_fee_passthrough" }) }),
      authedFetch("/admin-get-setting", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: "installments_enabled" }) }),
      authedFetch("/admin-get-setting", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: "installments_count" }) }),
      authedFetch("/admin-get-setting", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: "installments_interval_days" }) }),
    ]).then(function (results) {
      settingsValues.installments_enabled = (results[3].data && results[3].data.value) === "true" ? "true" : "false";
      settingsValues.installments_count = (results[4].data && results[4].data.value) || "3";
      settingsValues.installments_interval_days = (results[5].data && results[5].data.value) || "1";
      settingsValues.paystack_fee_passthrough = (results[2].data && results[2].data.value) === "true" ? "true" : "false";
      settingsValues.announcement = (results[0].data && results[0].data.value) || "";
      settingsValues.sale_popup_frequency = (results[1].data && results[1].data.value) || "once_per_session";
      drawSettingsSection();
    });

  function drawSettingsSection() {
    var freqOptions = [
      ["always", "Every page load"], ["once_per_session", "Once per visit"],
      ["hours:1", "Once every hour"], ["hours:3", "Once every 3 hours"], ["hours:12", "Once every 12 hours"], ["hours:24", "Once every 24 hours"],
    ].map(function (o) { return '<option value="' + o[0] + '"' + (settingsValues.sale_popup_frequency === o[0] ? " selected" : "") + '>' + o[1] + '</option>'; }).join("");

    document.getElementById("pageBody").innerHTML =
      '<div style="max-width:480px;">' +
      '<div class="field"><label>Site announcement banner</label><textarea id="s_announcement" placeholder="Leave blank to hide the banner">' + escapeHtml(settingsValues.announcement) + '</textarea>' +
      '<div class="inline-actions"><button type="button" class="btn primary" id="s_saveAnnouncement">Save</button><span class="save-status" id="s_announcementStatus"></span></div></div>' +
      '<div class="field" style="margin-top:24px;"><label>Sale popup frequency</label><select id="s_popupFreq">' + freqOptions + '</select>' +
      '<div class="inline-actions"><button type="button" class="btn primary" id="s_savePopup">Save</button><span class="save-status" id="s_popupStatus"></span></div></div>' +
      '<div class="field" style="margin-top:24px;"><label>Paystack fees</label><select id="s_passFees">' +
      '<option value="false"' + (settingsValues.paystack_fee_passthrough !== "true" ? " selected" : "") + '>You pay the fee (customer pays the listed price)</option>' +
      '<option value="true"' + (settingsValues.paystack_fee_passthrough === "true" ? " selected" : "") + '>Customer pays the fee (added at checkout)</option></select>' +
      '<div style="font-size:12px;color:var(--silver-dim,#8a8f98);margin-top:6px;line-height:1.5;">Paystack charges 1.5% + ₦100 (no ₦100 under ₦2,500, max ₦2,000). When on, online card/transfer payments add this so you receive the full listed price. Not applied to subscriptions or manual transfers. Reports and project amounts always show the listed price.</div>' +
      '<div class="inline-actions"><button type="button" class="btn primary" id="s_savePassFees">Save</button><span class="save-status" id="s_passFeesStatus"></span></div></div>' +
      '<div class="field" style="margin-top:24px;"><label>Pay in installments (all services)</label><select id="s_instEnabled">' +
      '<option value="false"' + (settingsValues.installments_enabled !== "true" ? " selected" : "") + '>Off (customers pay in full)</option>' +
      '<option value="true"' + (settingsValues.installments_enabled === "true" ? " selected" : "") + '>On (customers can split the payment)</option></select>' +
      '<div class="two-col" style="margin-top:10px;"><div><label>Number of payments (2-12)</label><input id="s_instCount" type="number" min="2" max="12" value="' + escapeHtml(settingsValues.installments_count) + '"></div><div><label>Days between payments (1-30)</label><input id="s_instDays" type="number" min="1" max="30" value="' + escapeHtml(settingsValues.installments_interval_days) + '"></div></div>' +
      '<div style="font-size:12px;color:var(--silver-dim,#8a8f98);margin-top:6px;line-height:1.5;">The customer ticks the option at checkout, pays the first part by card, and the same card is charged automatically for the rest (retried daily up to 3 times if a charge fails). Each service can follow this, or be forced On/Off in the Catalog. Not for subscriptions. The Paystack fee on every charge is paid by you, not added to the customer.</div>' +
      '<div class="inline-actions"><button type="button" class="btn primary" id="s_saveInst">Save</button><span class="save-status" id="s_instStatus"></span></div></div>' +
      '</div>';

    document.getElementById("s_saveAnnouncement").addEventListener("click", function () { saveSetting("announcement", document.getElementById("s_announcement").value, "s_announcementStatus"); });
    document.getElementById("s_savePassFees").addEventListener("click", function () { saveSetting("paystack_fee_passthrough", document.getElementById("s_passFees").value, "s_passFeesStatus"); });
    document.getElementById("s_saveInst").addEventListener("click", function () {
      var st = document.getElementById("s_instStatus");
      st.textContent = "Saving…"; st.className = "save-status";
      var items = [["installments_enabled", document.getElementById("s_instEnabled").value], ["installments_count", document.getElementById("s_instCount").value], ["installments_interval_days", document.getElementById("s_instDays").value]];
      var chain = Promise.resolve({ ok: true });
      items.forEach(function (it) {
        chain = chain.then(function (prev) {
          if (!prev.ok) return prev;
          return authedFetch("/admin-save-setting", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: it[0], value: it[1] }) }).then(function (r) { return r.data || { ok: false, error: "Could not save." }; });
        });
      });
      chain.then(function (res) {
        if (res.ok) { st.textContent = "Saved"; st.className = "save-status ok"; }
        else { st.textContent = res.error || "Could not save."; st.className = "save-status err"; }
      });
    });
    document.getElementById("s_savePopup").addEventListener("click", function () { saveSetting("sale_popup_frequency", document.getElementById("s_popupFreq").value, "s_popupStatus"); });
    if (!canEdit("settings")) {
      Array.prototype.forEach.call(document.querySelectorAll("#pageBody input, #pageBody select, #pageBody textarea, #pageBody button"), function (el) { el.disabled = true; });
      document.getElementById("pageBody").insertAdjacentHTML("afterbegin", '<div class="save-status" style="margin-bottom:14px;">You can view these settings but not change them.</div>');
    }
  }
  function saveSetting(key, value, statusElId) {
    var statusEl = document.getElementById(statusElId);
    statusEl.textContent = "Saving…"; statusEl.className = "save-status";
    authedFetch("/admin-save-setting", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: key, value: value }) }).then(function (r) {
      if (r.data && r.data.ok) { statusEl.textContent = "Saved"; statusEl.className = "save-status ok"; }
      else { statusEl.textContent = (r.data && r.data.error) || "Could not save."; statusEl.className = "save-status err"; }
    });
  }

  /* ---------------- Mobile: nav drawer + card-style tables ---------------- */

  function setNav(open) {
    var sb = document.querySelector(".sidebar"), sc = document.getElementById("navScrim");
    if (sb) sb.classList.toggle("open", !!open);
    if (sc) sc.classList.toggle("open", !!open);
  }
  document.getElementById("menuBtn").addEventListener("click", function () { setNav(true); });
  document.getElementById("navScrim").addEventListener("click", function () { setNav(false); });

  function labelTables() {
    Array.prototype.forEach.call(document.querySelectorAll("#pageBody table"), function (tbl) {
      var heads = Array.prototype.map.call(tbl.querySelectorAll("thead th"), function (th) { return th.textContent.trim(); });
      Array.prototype.forEach.call(tbl.querySelectorAll("tbody tr"), function (tr) {
        Array.prototype.forEach.call(tr.children, function (td, i) { if (heads[i]) td.setAttribute("data-label", heads[i]); });
      });
      tbl.classList.add("rtable");
    });
  }
  new MutationObserver(labelTables).observe(document.getElementById("pageBody"), { childList: true, subtree: true });

  initAuth0().catch(function (e) {
    var lb = document.getElementById("loginBtn");
    lb.disabled = true; lb.textContent = "Sign in";
    showLoginError("Could not load sign-in (" + (e && e.message ? e.message : "network error") + "). Refresh the page.");
  });
})();
</script>
</body>
</html>
