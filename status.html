<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Project Status — SCARLS SYSTEMS</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/scarls-logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{ min-height:100%; background:var(--black); }
  .wrap{
    min-height:100svh; min-height:100dvh; display:flex; align-items:flex-start; justify-content:center;
    padding:32px 16px 48px;
  }
  .card{ max-width:640px; width:100%; margin:auto; border:1px solid var(--line); background:var(--graphite-0); border-radius:14px; padding:28px 24px; text-align:left; }
  .eyebrow{ margin-bottom:10px; }
  .card h1{ font-family:var(--font-display); color:var(--white); font-size:22px; margin-bottom:6px; }
  .card p.sub{ color:var(--silver); font-size:13.5px; margin-bottom:22px; }

  .steps{ display:flex; justify-content:space-between; margin-bottom:26px; position:relative; }
  .steps::before{
    content:''; position:absolute; top:11px; left:11px; right:11px; height:2px; background:var(--line-soft); z-index:0;
  }
  .step{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; }
  .step .dot{ width:22px; height:22px; border-radius:50%; background:var(--graphite-1); border:2px solid var(--line); }
  .step.done .dot{ background:var(--accent-grad); border-color:transparent; }
  .step.current .dot{ border-color:var(--accent-blue); }
  .step span{ font-family:var(--font-mono); font-size:9px; letter-spacing:.03em; text-transform:uppercase; color:var(--silver-dim); text-align:center; }
  .step.done span, .step.current span{ color:var(--silver-bright); }

  .detail{ border-top:1px solid var(--line-soft); padding-top:18px; margin-top:22px; }
  .detail-row{ display:flex; justify-content:space-between; gap:12px; font-size:13.5px; padding:7px 0; }
  .detail-row b{ color:var(--silver-dim); font-weight:400; font-family:var(--font-mono); font-size:11px; letter-spacing:.03em; text-transform:uppercase; }
  .detail-row span{ color:var(--off-white); text-align:right; }

  .delivery-link{
    display:block; margin-top:18px; text-align:center; padding:11px 18px; border-radius:8px;
    background:var(--white); color:var(--black); text-decoration:none; font-family:var(--font-mono); font-size:12.5px;
  }

  .state-screen{ padding:20px 0; text-align:center; color:var(--silver); font-size:14px; line-height:1.6; }

  /* ---------- Stage panels ---------- */
  .panel-msg{ color:var(--silver-bright); font-size:14.5px; line-height:1.65; margin-bottom:16px; }
  .panel-msg b{ color:var(--white); }
  .callout{
    border:1px solid #4a3f22; background:rgba(255,212,121,.06); color:#ffd479; border-radius:10px;
    padding:13px 15px; font-size:13.5px; line-height:1.6; margin-bottom:18px; white-space:pre-wrap;
  }
  .callout b{ display:block; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; margin-bottom:4px; }
  .callout.ok{ border-color:#22452f; background:rgba(126,224,168,.06); color:#7ee0a8; }

  /* ---------- Brief form ---------- */
  .brief-form .field{ margin-bottom:16px; }
  .brief-form .field label{
    display:block; font-family:var(--font-mono); font-size:11px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--silver-dim); margin-bottom:7px; line-height:1.5;
  }
  .brief-form textarea{
    width:100%; background:var(--graphite-1); border:1px solid var(--line); color:var(--white);
    padding:11px 13px; font-size:14px; font-family:inherit; border-radius:8px; resize:vertical; min-height:76px; line-height:1.5;
  }
  .brief-form textarea:focus{ outline:none; border-color:var(--accent-blue); }

  .dropzone{
    border:1px dashed var(--line); border-radius:10px; padding:22px 14px; text-align:center;
    color:var(--silver); font-size:13.5px; line-height:1.6; cursor:pointer;
    transition:border-color .2s, background .2s;
  }
  .dropzone:hover, .dropzone.is-over{ border-color:var(--accent-blue); background:var(--graphite-1); }
  .dropzone small{ display:block; color:var(--silver-dim); font-size:12px; margin-top:4px; }
  .file-list{ list-style:none; margin:12px 0 0; padding:0; }
  .file-list li{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border:1px solid var(--line-soft); border-radius:8px; padding:9px 12px; margin-bottom:7px;
    font-size:13px; color:var(--off-white); word-break:break-all;
  }
  .file-list li small{ color:var(--silver-dim); white-space:nowrap; margin-left:6px; }
  .file-list li.pending{ color:var(--silver); }
  .file-list li.error{ border-color:#4a2222; color:#ff8b8b; }
  .file-list button{
    background:transparent; border:none; color:var(--silver); cursor:pointer; font-size:18px; line-height:1; padding:2px 6px;
  }
  .file-list button:hover{ color:#ff8b8b; }

  .form-actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
  .form-actions .btn{ padding:12px 22px; font-size:14px; }
  .form-actions .btn[disabled]{ opacity:.5; cursor:default; }
  .form-msg{ font-size:13px; margin-top:12px; min-height:18px; color:var(--silver); }
  .form-msg.ok{ color:#7ee0a8; }
  .form-msg.err{ color:#ff8b8b; }

  .brief-summary{ margin-top:20px; border:1px solid var(--line-soft); border-radius:10px; padding:2px 14px; }
  .brief-summary summary{ cursor:pointer; padding:12px 0; font-family:var(--font-mono); font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--silver); }
  .brief-summary dl{ margin:0 0 12px; }
  .brief-summary dt{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--silver-dim); margin-top:10px; }
  .brief-summary dd{ margin:3px 0 0; font-size:13.5px; color:var(--off-white); white-space:pre-wrap; }


  /* ---------- Review + messages ---------- */
  .portal-ta{
    width:100%; background:var(--graphite-1); border:1px solid var(--line); color:var(--white);
    padding:10px 12px; font-size:14px; font-family:inherit; border-radius:8px; resize:vertical; min-height:70px; line-height:1.5;
  }
  .portal-ta:focus{ outline:none; border-color:var(--accent-blue); }
  .review-box{ border:1px solid var(--line-soft); border-radius:12px; padding:16px; margin-bottom:18px; }
  .review-box h3{ font-family:var(--font-display); color:var(--white); font-size:16px; margin:0 0 6px; }
  .review-note{ font-size:13.5px; color:var(--silver); line-height:1.6; margin:0 0 14px; }
  .review-actions{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
  .review-actions .btn{ padding:12px 22px; font-size:14px; }
  .review-actions .btn[disabled]{ opacity:.5; cursor:default; }
  .rev-count{ font-family:var(--font-mono); font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--silver-dim); margin:6px 0 0; }
  #changesBox{ margin-top:4px; }

  .thread{ margin-top:24px; border-top:1px solid var(--line-soft); padding-top:18px; }
  .thread h3{ font-family:var(--font-display); color:var(--white); font-size:16px; margin:0 0 12px; }
  .msgs{ max-height:340px; overflow-y:auto; margin-bottom:12px; display:flex; flex-direction:column; gap:9px; }
  .msg{ max-width:88%; padding:9px 12px; border-radius:12px; font-size:13.5px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .msg small{ display:block; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.04em; text-transform:uppercase; opacity:.7; margin-bottom:3px; }
  .msg.you{ align-self:flex-end; background:#1d2b53; color:#fff; }
  .msg.team{ align-self:flex-start; background:var(--graphite-1); border:1px solid var(--line-soft); color:var(--off-white); }
  .msg.event{ align-self:center; border:1px dashed var(--line); color:var(--silver); font-size:12.5px; text-align:center; max-width:100%; }
  .thread-form{ display:flex; gap:8px; align-items:flex-end; }
  .thread-form .portal-ta{ flex:1; min-height:46px; }
  .thread-form .btn{ padding:12px 20px; font-size:14px; }
  .thread-form .btn[disabled]{ opacity:.5; cursor:default; }

  @media (max-width:520px){
    .card{ padding:22px 16px; }
    .step span{ font-size:8px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="eyebrow">— Project Status</p>
    <div id="loading" class="state-screen">Loading your project…</div>
    <div id="content" style="display:none;">
      <h1 id="serviceTitle">—</h1>
      <p class="sub" id="greeting">—</p>

      <div class="steps" id="steps"></div>

      <div id="panel"></div>

      <div class="detail">
        <div class="detail-row"><b>Status</b><span id="statusLabel">—</span></div>
        <div class="detail-row" id="dueDateRow" style="display:none;"><b>Due</b><span id="dueDateLabel">—</span></div>
        <div class="detail-row"><b>Last updated</b><span id="updatedLabel">—</span></div>
      </div>

      <a href="#" id="deliveryLinkBtn" class="delivery-link" style="display:none;" target="_blank" rel="noopener">View your delivery</a>
    </div>
  </div>
</div>

<script>
(function () {
  var SUPABASE_URL = "https://zpytjifbhaxniuliopvp.supabase.co";
  var FN = SUPABASE_URL + "/functions/v1";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpweXRqaWZiaGF4bml1bGlvcHZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyOTMyNjgsImV4cCI6MjEwMzg2OTI2OH0.QFGo9feUbsle_fGxNZvxMaBuRQzS55RKF2_i0oL0LYQ";

  var STATUS_FLOW = ["paid", "brief", "in_progress", "review", "delivered"];
  var STATUS_LABELS = { paid: "Paid", brief: "Brief", in_progress: "In progress", review: "Review", changes_requested: "Changes requested", delivered: "Delivered", refunded: "Refunded" };

  // File types the server accepts (also checked there — this is just to give instant feedback).
  var ALLOWED = {
    "image/jpeg": 1, "image/png": 1, "image/webp": 1, "image/gif": 1, "application/pdf": 1,
    "application/msword": 1, "application/vnd.openxmlformats-officedocument.wordprocessingml.document": 1,
    "application/vnd.ms-excel": 1, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": 1,
    "application/zip": 1, "application/x-zip-compressed": 1, "text/plain": 1
  };
  var EXT_TYPES = {
    jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", webp: "image/webp", gif: "image/gif", pdf: "application/pdf",
    doc: "application/msword", docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
    xls: "application/vnd.ms-excel", xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
    zip: "application/zip", txt: "text/plain"
  };

  var params = new URLSearchParams(window.location.search);
  var token = params.get('t');
  var ref = params.get('ref');

  var loadingEl = document.getElementById('loading');
  var contentEl = document.getElementById('content');
  var panelEl = document.getElementById('panel');
  var state = { data: null, pending: 0 };

  function $(id) { return document.getElementById(id); }

  function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  function formatBytes(n) {
    if (!n) return '0 B';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return Math.round(n / 1024) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
  }

  function formatDay(value) {
    var d = new Date(value);
    return isNaN(d) ? String(value) : d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function showError(message) {
    contentEl.style.display = 'none';
    loadingEl.style.display = '';
    loadingEl.textContent = message;
  }

  if (!token && !ref) { showError('No project reference was found in this link.'); return; }

  /* ============================================================
     Shared page shell (title, steps, details)
     ============================================================ */
  function renderShell(p) {
    loadingEl.style.display = 'none';
    contentEl.style.display = 'block';

    $('serviceTitle').textContent = p.serviceName + (p.packageName ? ' — ' + p.packageName : '');
    $('greeting').textContent = 'Hi ' + (p.fullName || 'there') + ', here\'s where your project stands.';
    $('statusLabel').textContent = STATUS_LABELS[p.status] || p.status;

    if (p.updatedAt) {
      $('updatedLabel').textContent = formatDay(p.updatedAt);
    }
    if (p.dueDate) {
      $('dueDateRow').style.display = 'flex';
      $('dueDateLabel').textContent = formatDay(p.dueDate);
    } else {
      $('dueDateRow').style.display = 'none';
    }

    var btn = $('deliveryLinkBtn');
    if ((p.status === 'delivered' || p.status === 'review' || p.status === 'changes_requested') && p.deliveryLink) {
      btn.href = p.deliveryLink;
      btn.textContent = p.status === 'delivered' ? 'View your delivery' : 'View your preview';
      btn.style.display = 'block';
    } else {
      btn.style.display = 'none';
    }

    var stepKey = p.status === 'changes_requested' ? 'review' : p.status;
    var currentIndex = STATUS_FLOW.indexOf(stepKey);
    $('steps').innerHTML = STATUS_FLOW.map(function (s, i) {
      var cls = i < currentIndex ? 'done' : (i === currentIndex ? 'current done' : '');
      return '<div class="step ' + cls + '"><div class="dot"></div><span>' + escapeHtml(STATUS_LABELS[s]) + '</span></div>';
    }).join('');
  }

  /* ============================================================
     Old-style links (?ref=...) — read-only tracker, unchanged behaviour
     ============================================================ */
  function loadLegacy() {
    fetch(FN + '/public-project-status?ref=' + encodeURIComponent(ref))
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (!data || !data.ok) {
          showError((data && data.error) ? data.error : 'This link is invalid or has expired.');
          return;
        }
        renderShell(data.project);
        panelEl.innerHTML = '<p class="panel-msg">' + legacyMessage(data.project.status) + '</p>';
      })
      .catch(function () {
        showError('Could not reach the server. Please check your connection and try again.');
      });
  }

  function legacyMessage(status) {
    if (status === 'delivered') return 'Your project is <b>delivered</b>. Thank you for working with us!';
    if (status === 'review') return 'Your project is ready for your <b>review</b>. Please check the link below, or reply to our email with your feedback.';
    if (status === 'in_progress') return 'We\'re <b>working on your project</b> now.';
    return 'Payment received. A member of the SCARLS team will be in touch shortly.';
  }

  /* ============================================================
     Portal (?t=...) — the private project page
     ============================================================ */
  function callPortal(action, body) {
    var payload = { action: action, token: token };
    Object.keys(body || {}).forEach(function (k) { payload[k] = body[k]; });
    return fetch(FN + '/portal', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify(payload)
    }).then(function (res) { return res.json(); });
  }

  function loadPortal() {
    callPortal('get')
      .then(function (data) {
        if (!data || !data.ok) { showError((data && data.error) || 'This link is invalid or has expired.'); return; }
        state.data = data;
        renderPortal();
      })
      .catch(function () { showError('Could not reach the server. Please check your connection and try again.'); });
  }

  var THREAD_STAGES = ['brief', 'in_progress', 'review', 'changes_requested', 'delivered'];

  function renderPortal() {
    var d = state.data;
    renderShell(d.project);
    var s = d.project.status;

    if (s === 'brief') {
      if (d.brief.editable) renderBriefForm();
      else renderBriefSubmitted();
    } else if (s === 'in_progress') {
      panelEl.innerHTML =
        '<p class="panel-msg">Thank you — your details are approved and we\'re now <b>working on your project</b>. ' +
        (d.project.dueDate ? 'Expected delivery: <b>' + escapeHtml(formatDay(d.project.dueDate)) + '</b>. ' : '') +
        'We\'ll email you as soon as there\'s something to review.</p>' + briefSummaryHtml();
    } else if (s === 'review') {
      renderReviewPanel();
    } else if (s === 'changes_requested') {
      panelEl.innerHTML =
        '<div class="callout ok"><b>Changes requested</b>We\'ve received your feedback and we\'re working on it. ' +
        'We\'ll email you as soon as the updated version is ready.</div>' +
        '<p class="rev-count">' + revisionText() + '</p>' + briefSummaryHtml();
    } else if (s === 'delivered') {
      panelEl.innerHTML = '<p class="panel-msg">Your project is <b>delivered</b>. Thank you for working with us!</p>' + briefSummaryHtml();
    } else if (s === 'refunded') {
      panelEl.innerHTML = '<p class="panel-msg">This project has been refunded.</p>';
    } else {
      panelEl.innerHTML = '<p class="panel-msg">Payment received. A member of the SCARLS team will be in touch shortly.</p>';
    }

    if (THREAD_STAGES.indexOf(s) >= 0) appendThread();
  }

  function revisionText() {
    var r = state.data.review;
    return 'Revisions: ' + r.revisionsUsed + ' of ' + r.revisionLimit + ' used';
  }

  /* ---------- Review: approve or ask for changes ---------- */
  function renderReviewPanel() {
    var d = state.data, r = d.review;
    var html = '<div class="review-box"><h3>Your project is ready for review</h3>';

    if (r.approvedAt) {
      html += '<div class="callout ok"><b>Approved</b>You approved this project on ' + escapeHtml(formatDay(r.approvedAt)) +
        '. Thank you — we\'ll send your final delivery shortly.</div>';
    } else {
      html += '<p class="review-note">' + (d.project.deliveryLink ? 'Open your preview with the button below. ' : '') +
        'Then approve it if you\'re happy, or tell us what you\'d like changed.</p>';
      var left = r.revisionLimit - r.revisionsUsed;
      html += '<div class="review-actions"><button type="button" class="btn btn-primary" id="approveBtn">Approve this project</button>' +
        (left > 0 ? '<button type="button" class="btn btn-ghost" id="changesToggle">Request changes</button>' : '') + '</div>';
      if (left > 0) {
        html += '<div id="changesBox" style="display:none;"><textarea class="portal-ta" id="changesText" maxlength="3000" ' +
          'placeholder="Describe what you\'d like changed…"></textarea>' +
          '<div class="review-actions" style="margin-top:10px;"><button type="button" class="btn btn-primary" id="sendChangesBtn">Send my changes</button></div></div>';
      } else {
        html += '<p class="review-note">You\'ve used all ' + r.revisionLimit + ' included revision rounds. If you\'d like more changes, send us a message below and we\'ll explain the options.</p>';
      }
    }
    html += '<p class="rev-count">' + revisionText() + '</p><p class="form-msg" id="reviewMsg" role="status"></p></div>' + briefSummaryHtml();
    panelEl.innerHTML = html;
    wireReview();
  }

  function reviewMsg(text, kind) {
    var m = $('reviewMsg');
    if (!m) return;
    m.textContent = text || '';
    m.className = 'form-msg' + (kind ? ' ' + kind : '');
  }

  function wireReview() {
    var approve = $('approveBtn'), toggle = $('changesToggle'), send = $('sendChangesBtn');
    if (approve) approve.addEventListener('click', function () {
      if (!window.confirm('Approve this project? This tells us you are happy with it.')) return;
      approve.disabled = true; reviewMsg('Saving…', '');
      callPortal('approve')
        .then(function (res) {
          if (!res || !res.ok) { approve.disabled = false; reviewMsg((res && res.error) || 'Could not save. Please try again.', 'err'); return; }
          loadPortal();
        })
        .catch(function () { approve.disabled = false; reviewMsg('Could not reach the server. Please try again.', 'err'); });
    });
    if (toggle) toggle.addEventListener('click', function () {
      var box = $('changesBox');
      box.style.display = box.style.display === 'none' ? '' : 'none';
      if (box.style.display === '') $('changesText').focus();
    });
    if (send) send.addEventListener('click', function () {
      var text = $('changesText').value.trim();
      if (text.length < 5) { reviewMsg('Please describe the changes you\'d like.', 'err'); return; }
      send.disabled = true; reviewMsg('Sending…', '');
      callPortal('request_changes', { body: text })
        .then(function (res) {
          if (!res || !res.ok) { send.disabled = false; reviewMsg((res && res.error) || 'Could not send. Please try again.', 'err'); return; }
          loadPortal();
        })
        .catch(function () { send.disabled = false; reviewMsg('Could not reach the server. Please try again.', 'err'); });
    });
  }

  /* ---------- Messages ---------- */
  function formatTime(value) {
    var d = new Date(value);
    return isNaN(d) ? '' : d.toLocaleString(undefined, { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  }

  function msgHtml(m) {
    var when = escapeHtml(formatTime(m.at));
    if (m.kind === 'approval') return '<div class="msg event">You approved this project · ' + when + '</div>';
    if (m.kind === 'system') return '<div class="msg event">SCARLS: ' + escapeHtml(m.text) + ' · ' + when + '</div>';
    if (m.from === 'admin') return '<div class="msg team"><small>SCARLS · ' + when + '</small>' + escapeHtml(m.text) + '</div>';
    var label = m.kind === 'changes_request' ? 'You asked for changes' : 'You';
    return '<div class="msg you"><small>' + label + ' · ' + when + '</small>' + escapeHtml(m.text) + '</div>';
  }

  function renderMessages() {
    var box = $('msgs');
    if (!box) return;
    var msgs = state.data.messages || [];
    box.innerHTML = msgs.length
      ? msgs.map(msgHtml).join('')
      : '<p class="state-screen" style="padding:6px 0;">No messages yet. Ask us anything here.</p>';
    box.scrollTop = box.scrollHeight;
  }

  function appendThread() {
    panelEl.insertAdjacentHTML('beforeend',
      '<div class="thread"><h3>Messages</h3><div class="msgs" id="msgs"></div>' +
      '<form class="thread-form" id="threadForm"><textarea class="portal-ta" id="msgInput" maxlength="2000" placeholder="Write a message to the SCARLS team…"></textarea>' +
      '<button type="submit" class="btn btn-primary" id="msgSend">Send</button></form><p class="form-msg" id="threadMsg" role="status"></p></div>');
    renderMessages();
    $('threadForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var input = $('msgInput'), text = input.value.trim();
      if (!text) return;
      var btn = $('msgSend'), note = $('threadMsg');
      btn.disabled = true; note.textContent = ''; note.className = 'form-msg';
      callPortal('send_message', { body: text })
        .then(function (res) {
          btn.disabled = false;
          if (!res || !res.ok) { note.textContent = (res && res.error) || 'Could not send.'; note.className = 'form-msg err'; return; }
          state.data.messages = res.messages; input.value = ''; renderMessages();
        })
        .catch(function () { btn.disabled = false; note.textContent = 'Could not reach the server. Please try again.'; note.className = 'form-msg err'; });
    });
  }

  // Every 30 seconds, quietly check for new messages or a stage change (only while the page is open and visible).
  setInterval(function () {
    if (!token || document.hidden || !state.data || !$('msgs')) return;
    callPortal('messages').then(function (res) {
      if (!res || !res.ok) return;
      var typing = document.activeElement && document.activeElement.tagName === 'TEXTAREA';
      if (res.status && res.status !== state.data.project.status && !typing) { loadPortal(); return; }
      if (res.messages.length !== (state.data.messages || []).length) { state.data.messages = res.messages; renderMessages(); }
    }).catch(function () { /* try again next time */ });
  }, 30000);

  /* ---------- Read-only view of what the customer sent ---------- */
  function briefSummaryHtml() {
    var b = state.data.brief;
    var rows = b.items.filter(function (i) { return i.value; });
    if (!rows.length && !b.extra && !b.files.length) return '';
    var html = '<details class="brief-summary"><summary>What you sent us</summary><dl>';
    rows.forEach(function (i) { html += '<dt>' + escapeHtml(i.label) + '</dt><dd>' + escapeHtml(i.value) + '</dd>'; });
    if (b.extra) html += '<dt>Anything else</dt><dd>' + escapeHtml(b.extra) + '</dd>';
    if (b.files.length) {
      html += '<dt>Files</dt><dd>' + b.files.map(function (f) { return escapeHtml(f.name) + ' (' + formatBytes(f.size) + ')'; }).join('<br>') + '</dd>';
    }
    return html + '</dl></details>';
  }

  function renderBriefSubmitted() {
    panelEl.innerHTML =
      '<div class="callout ok"><b>Received</b>Thank you — we\'ve got your details and we\'re reviewing them. ' +
      'We\'ll email you as soon as they\'re approved and your project starts. If you need to add anything, just reply to our email.</div>' +
      briefSummaryHtml();
  }

  /* ---------- The brief form ---------- */
  function renderBriefForm() {
    var d = state.data, b = d.brief;
    var maxMb = Math.round(d.limits.maxBytes / 1048576);

    var html = '';
    if (b.adminNote) {
      html += '<div class="callout"><b>A little more needed</b>' + escapeHtml(b.adminNote) + '</div>';
    }
    html += '<p class="panel-msg">Your payment is approved. <b>To get started, tell us about your project</b> — fill in what you can and upload your files below. ' +
      'We begin as soon as we\'ve reviewed and approved your details.</p>';

    html += '<form id="briefForm" class="brief-form" novalidate>';
    b.items.forEach(function (item, i) {
      html += '<div class="field"><label for="q' + i + '">' + escapeHtml(item.label) + '</label>' +
        '<textarea id="q' + i + '" data-label="' + escapeHtml(item.label) + '" maxlength="5000">' + escapeHtml(item.value) + '</textarea></div>';
    });
    html += '<div class="field"><label for="extra">Anything else we should know?</label>' +
      '<textarea id="extra" maxlength="5000">' + escapeHtml(b.extra) + '</textarea></div>';

    html += '<div class="field"><label>Your files</label>' +
      '<div class="dropzone" id="dropzone" tabindex="0" role="button">Tap to choose files, or drop them here' +
      '<small>Images, PDF, Word, Excel or ZIP · up to ' + d.limits.maxFiles + ' files · ' + maxMb + ' MB each</small></div>' +
      '<input type="file" id="fileInput" multiple style="display:none;" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.zip,.txt">' +
      '<ul class="file-list" id="fileList"></ul></div>';

    html += '<div class="form-actions">' +
      '<button type="button" class="btn btn-ghost" id="saveDraftBtn">Save for later</button>' +
      '<button type="submit" class="btn btn-primary" id="submitBtn">Send to SCARLS</button></div>' +
      '<p class="form-msg" id="formMsg" role="status"></p></form>';

    panelEl.innerHTML = html;
    renderFileList();
    wireBriefForm();
  }

  function renderFileList() {
    var list = $('fileList');
    if (!list) return;
    var files = state.data.brief.files;
    list.innerHTML = files.map(function (f) {
      return '<li data-id="' + escapeHtml(f.id) + '"><span>' + escapeHtml(f.name) + '<small>' + formatBytes(f.size) + '</small></span>' +
        '<button type="button" data-remove="' + escapeHtml(f.id) + '" aria-label="Remove ' + escapeHtml(f.name) + '">&times;</button></li>';
    }).join('');
    Array.prototype.forEach.call(list.querySelectorAll('[data-remove]'), function (btn) {
      btn.addEventListener('click', function () { removeFile(btn.getAttribute('data-remove')); });
    });
  }

  function setMsg(text, kind) {
    var m = $('formMsg');
    if (!m) return;
    m.textContent = text || '';
    m.className = 'form-msg' + (kind ? ' ' + kind : '');
  }

  function collectAnswers() {
    var items = [];
    Array.prototype.forEach.call(document.querySelectorAll('#briefForm textarea[data-label]'), function (t) {
      items.push({ label: t.getAttribute('data-label'), value: t.value });
    });
    return { items: items, extra: $('extra') ? $('extra').value : '' };
  }

  function setBusy(busy) {
    ['saveDraftBtn', 'submitBtn'].forEach(function (id) { if ($(id)) $(id).disabled = busy; });
  }

  function wireBriefForm() {
    var dz = $('dropzone'), input = $('fileInput');
    dz.addEventListener('click', function () { input.click(); });
    dz.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
    input.addEventListener('change', function () { if (input.files && input.files.length) uploadFiles(input.files); input.value = ''; });
    ['dragenter', 'dragover'].forEach(function (ev) { dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add('is-over'); }); });
    ['dragleave', 'drop'].forEach(function (ev) { dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove('is-over'); }); });
    dz.addEventListener('drop', function (e) { if (e.dataTransfer && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files); });

    $('saveDraftBtn').addEventListener('click', function () { saveBrief(false); });
    $('briefForm').addEventListener('submit', function (e) { e.preventDefault(); saveBrief(true); });
  }

  function saveBrief(submit) {
    if (state.pending > 0) { setMsg('Please wait for your files to finish uploading.', 'err'); return; }
    var a = collectAnswers();
    setBusy(true);
    setMsg(submit ? 'Sending…' : 'Saving…', '');
    callPortal('save', { items: a.items, extra: a.extra, submit: submit })
      .then(function (res) {
        setBusy(false);
        if (!res || !res.ok) { setMsg((res && res.error) || 'Could not save. Please try again.', 'err'); return; }
        if (submit) { window.scrollTo(0, 0); loadPortal(); }
        else setMsg('Saved. You can come back to this page any time using the link in your email.', 'ok');
      })
      .catch(function () { setBusy(false); setMsg('Could not reach the server. Please try again.', 'err'); });
  }

  /* ---------- File uploads ---------- */
  function guessType(file) {
    if (file.type) return file.type;
    var m = /\.([a-z0-9]+)$/i.exec(file.name || '');
    return m ? (EXT_TYPES[m[1].toLowerCase()] || '') : '';
  }

  function renameExt(name, type) {
    var ext = type === 'image/png' ? '.png' : '.jpg';
    return name.replace(/\.[a-z0-9]+$/i, '') + ext;
  }

  // Big phone photos are shrunk before upload so they send quickly and never hit the size limit.
  function prepareFile(file, type) {
    var shrinkable = type === 'image/jpeg' || type === 'image/png' || type === 'image/webp';
    if (!shrinkable || file.size <= 3 * 1048576) return Promise.resolve({ blob: file, type: type, name: file.name });
    return new Promise(function (resolve) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, 2400 / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.naturalWidth * scale));
        c.height = Math.max(1, Math.round(img.naturalHeight * scale));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var outType = type === 'image/png' ? 'image/png' : 'image/jpeg';
        c.toBlob(function (blob) {
          URL.revokeObjectURL(url);
          if (blob && blob.size < file.size) resolve({ blob: blob, type: outType, name: renameExt(file.name, outType) });
          else resolve({ blob: file, type: type, name: file.name });
        }, outType, 0.86);
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve({ blob: file, type: type, name: file.name }); };
      img.src = url;
    });
  }

  function toBase64(blob) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(String(r.result)); };
      r.onerror = function () { reject(new Error('Could not read that file.')); };
      r.readAsDataURL(blob);
    });
  }

  function addRow(text, cls) {
    var li = document.createElement('li');
    li.className = cls || 'pending';
    li.innerHTML = '<span></span>';
    li.firstChild.textContent = text;
    $('fileList').appendChild(li);
    return li;
  }

  function uploadFiles(fileList) {
    var files = Array.prototype.slice.call(fileList);
    var chain = Promise.resolve();
    files.forEach(function (f) { chain = chain.then(function () { return uploadOne(f); }); });
    return chain;
  }

  function uploadOne(file) {
    var limits = state.data.limits;
    var type = guessType(file);
    if (!ALLOWED[type]) { addRow(file.name + ' — that file type isn\'t supported.', 'error'); return Promise.resolve(); }
    if (state.data.brief.files.length >= limits.maxFiles) { addRow(file.name + ' — you can upload up to ' + limits.maxFiles + ' files.', 'error'); return Promise.resolve(); }

    var row = addRow('Uploading ' + file.name + '…', 'pending');
    state.pending++;
    return prepareFile(file, type)
      .then(function (prepared) {
        if (prepared.blob.size > limits.maxBytes) throw new Error('That file is too large (max ' + Math.round(limits.maxBytes / 1048576) + ' MB).');
        return toBase64(prepared.blob).then(function (b64) {
          return callPortal('upload', { fileName: prepared.name, mimeType: prepared.type, base64: b64 });
        });
      })
      .then(function (res) {
        if (!res || !res.ok) throw new Error((res && res.error) || 'Upload failed.');
        state.data.brief.files.push(res.file);
        if (row.parentNode) row.parentNode.removeChild(row);
        renderFileList();
      })
      .catch(function (err) {
        row.className = 'error';
        row.firstChild.textContent = file.name + ' — ' + (err && err.message ? err.message : 'upload failed');
      })
      .then(function () { state.pending--; });
  }

  function removeFile(id) {
    callPortal('delete', { fileId: id })
      .then(function (res) {
        if (!res || !res.ok) { setMsg((res && res.error) || 'Could not remove that file.', 'err'); return; }
        state.data.brief.files = state.data.brief.files.filter(function (f) { return f.id !== id; });
        renderFileList();
      })
      .catch(function () { setMsg('Could not reach the server. Please try again.', 'err'); });
  }

  /* ---------- Go ---------- */
  if (token) loadPortal(); else loadLegacy();
})();
</script>
</body>
</html>
