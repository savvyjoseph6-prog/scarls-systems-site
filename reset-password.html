<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password — SCARLS</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    background-image: radial-gradient(circle at 50% 30%, rgba(91,140,255,0.08), transparent 60%);
    color: #e8e8ec;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: #171a21;
    border: 1px solid #2a2e38;
    border-radius: 22px;
    padding: 36px 32px;
    width: 100%;
    max-width: 380px;
    box-shadow:
      0 0 0 1px rgba(91,140,255,0.05),
      0 0 40px rgba(91,140,255,0.12),
      0 20px 50px rgba(0,0,0,0.45);
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  p.sub {
    color: #9297a3;
    font-size: 14px;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #b3b7c1;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    background: #0f1115;
    border: 1px solid #2a2e38;
    border-radius: 12px;
    color: #e8e8ec;
    font-size: 14px;
    margin-bottom: 16px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input:focus {
    outline: none;
    border-color: #5b8cff;
    box-shadow: 0 0 0 3px rgba(91,140,255,0.18);
  }
  button {
    width: 100%;
    padding: 13px;
    background: #5b8cff;
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(91,140,255,0.35);
    transition: box-shadow 0.15s ease, transform 0.1s ease;
  }
  button:hover:not(:disabled) {
    box-shadow: 0 6px 22px rgba(91,140,255,0.45);
  }
  button:active:not(:disabled) {
    transform: translateY(1px);
  }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    box-shadow: none;
  }
  @media (max-width: 420px) {
    body { padding: 12px; }
    .card {
      border-radius: 18px;
      padding: 28px 22px;
    }
  }
  .error {
    background: #3a1d1d;
    border: 1px solid #6b2b2b;
    color: #ff9a9a;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .success {
    background: #1d3a24;
    border: 1px solid #2b6b3b;
    color: #9affab;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  a {
    color: #5b8cff;
    font-size: 13px;
    text-decoration: none;
  }
  .password-wrap {
    position: relative;
  }
  .password-wrap input {
    padding-right: 40px;
  }
  .toggle-eye {
    position: absolute;
    right: 12px;
    top: 10px;
    width: 20px;
    height: 20px;
    cursor: pointer;
    color: #9297a3;
    background: none;
    border: none;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .toggle-eye:hover {
    color: #e8e8ec;
  }
  .toggle-eye svg {
    width: 18px;
    height: 18px;
  }
</style>
</head>
<body>

<div class="card">
  <h1 id="heading">Set a new password</h1>
  <p class="sub" id="subtext">Choose a new password for your account.</p>

  <div class="error" id="errorBox"></div>
  <div class="success" id="successBox"></div>

  <form id="resetForm">
    <label for="password">New password</label>
    <div class="password-wrap">
      <input type="password" id="password" required autocomplete="new-password" minlength="8">
      <button type="button" class="toggle-eye" data-target="password" aria-label="Show password">
        <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>

    <label for="confirmPassword">Confirm password</label>
    <div class="password-wrap">
      <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="8">
      <button type="button" class="toggle-eye" data-target="confirmPassword" aria-label="Show password">
        <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>

    <button type="submit" id="submitBtn">Update Password</button>
  </form>

  <p class="sub" style="margin-top:16px; margin-bottom:0;">
    <a href="login.html">Back to log in</a>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  const form = document.getElementById('resetForm');
  const errorBox = document.getElementById('errorBox');
  const successBox = document.getElementById('successBox');
  const submitBtn = document.getElementById('submitBtn');
  const heading = document.getElementById('heading');
  const subtext = document.getElementById('subtext');

  // --- Show/hide password (applies to both fields) ---
  const eyeOpenPath = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle>';
  const eyeClosedPath = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.62 21.62 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.61 3.87M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';

  document.querySelectorAll('.toggle-eye').forEach((btn) => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const icon = btn.querySelector('.eye-icon');
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      icon.innerHTML = isHidden ? eyeClosedPath : eyeOpenPath;
      btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    });
  });

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
    successBox.style.display = 'none';
  }

  // Supabase puts the recovery token in the URL hash (#access_token=...&type=recovery)
  // and its client-side SDK auto-detects it and creates a temporary session on load.
  // We just need to make sure that session actually exists before letting the user submit.
  let sessionReady = false;

  (async () => {
    const { data, error } = await supabaseClient.auth.getSession();

    if (error || !data.session) {
      // Give the SDK a brief moment to process the URL hash on first load, then re-check.
      setTimeout(async () => {
        const retry = await supabaseClient.auth.getSession();
        if (!retry.data.session) {
          heading.textContent = 'Link expired or invalid';
          subtext.textContent = 'This password reset link is no longer valid. Request a new one from the login page.';
          form.style.display = 'none';
        } else {
          sessionReady = true;
        }
      }, 800);
    } else {
      sessionReady = true;
    }
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    successBox.style.display = 'none';

    if (!sessionReady) {
      showError('Still verifying your reset link — try again in a second.');
      return;
    }

    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (password.length < 8) {
      showError('Password must be at least 8 characters.');
      return;
    }
    if (password !== confirmPassword) {
      showError('Passwords do not match.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating...';

    const { error } = await supabaseClient.auth.updateUser({ password });

    if (error) {
      showError(error.message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Update Password';
      return;
    }

    successBox.textContent = 'Password updated. Redirecting to login...';
    successBox.style.display = 'block';
    form.style.display = 'none';

    setTimeout(() => {
      window.location.href = 'login.html';
    }, 1800);
  });
</script>

</body>
</html>
