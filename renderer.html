<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Preview — SCARLS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { scroll-behavior: smooth; }

  :root {
    --bg-base: #0f1115;
    --bg-surface: #171a21;
    --bg-elevated: #1f2229;

    --text-heading: #f2f0ea;
    --text-body: #cdd0d8;
    --text-muted: #9aa0ac;

    --accent-primary: #c9a15a;
    --accent-on-dark: #14161c;
    --accent-on-light: #ffffff;

    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'Poppins', -apple-system, sans-serif;
    --fs-h1: clamp(32px, 5vw, 48px);
    --fs-h2: clamp(24px, 3.2vw, 32px);
    --fs-h3: 18px;
    --fs-body: 16px;
    --fs-small: 14.5px;

    --radius: 999px;
    --radius-card: 16px;

    --nav-height: 72px;

    /* Layout/spacing tokens — configurable per page via the editor's
       "Spacing & Layout" panel, same pattern as the color/font tokens
       above. Nothing structural here is a fixed number anymore. */
    --section-padding: 88px;
    --heading-gap: 36px;
    --card-gap: 24px;
    --card-padding: 26px;
    --container-max-width: 880px;
  }

  body {
    font-family: var(--font-body);
    color: var(--text-body);
    background: var(--bg-base);
    line-height: 1.6;
  }
  img { max-width: 100%; display: block; }
  .container { max-width: var(--container-max-width, 880px); margin: 0 auto; padding: 0 24px; }
  section { padding: var(--section-padding, 88px) 0; scroll-margin-top: calc(var(--nav-height) + 16px); }
  section.alt-bg { background: var(--bg-surface); }

  h1, h2, h3 {
    font-family: var(--font-display);
    color: var(--text-heading);
    line-height: 1.2;
    font-weight: 700;
  }
  h2 { font-size: var(--fs-h2); margin-bottom: var(--heading-gap, 36px); text-align: var(--align, center); }
  h3 { font-size: var(--fs-h3); }
  /* white-space: pre-line preserves line breaks typed into a textarea in
     the editor (blank lines between paragraphs, manual line breaks) —
     without this, HTML collapses them and a multi-paragraph body renders
     as one dense, unbroken block of text. */
  p { color: var(--text-body); white-space: pre-line; }
  .copy-center { text-align: var(--align, center); }

  /* A thin divider between any two consecutive sections. Even when two
     sections share the exact same background (two plain sections in a
     row, or two alt-bg ones in a row), this gives a visible seam so a
     long-copy page never reads as one undifferentiated block of text. */
  #pageRoot > section + section {
    border-top: 1px solid rgba(255,255,255,0.07);
  }

  .btn {
    display: inline-block;
    background: var(--accent-primary);
    color: var(--accent-on-dark);
    padding: 14px 30px;
    border-radius: var(--radius);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(212, 175, 55, 0.25); }
  .btn.secondary {
    background: transparent;
    border: 1.5px solid var(--accent-primary);
    color: var(--accent-primary);
  }

  /* Hero */
  .hero { text-align: var(--align, center); padding-top: 112px; }
  .hero .eyebrow {
    display: inline-block;
    color: var(--accent-primary);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .hero h1 { font-size: var(--fs-h1); max-width: 720px; margin: 0 auto 20px; }
  .hero .sub { font-size: 18px; max-width: 620px; margin: 0 auto 36px; }
  .hero .cta-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

  /* Grid-based sections */
  .grid { display: grid; gap: var(--card-gap, 24px); }
  .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 640px) {
    .grid.cols-2, .grid.cols-3 { grid-template-columns: 1fr; }
    .hero { padding-top: 88px; }
  }
  /* Tighter mobile pass: the desktop spacing tokens (88px section padding,
     880px container, etc.) are tuned for laptop screens; on phones they
     leave too much dead air and make the page feel like it was only ever
     tested on a laptop. Scale the same tokens down rather than hardcoding
     a parallel set of mobile-only numbers. */
  @media (max-width: 480px) {
    section { padding: calc(var(--section-padding, 88px) * 0.6) 0; }
    .container { padding: 0 18px; }
    .hero { padding-top: 64px; }
    .hero .cta-row { flex-direction: column; align-items: stretch; }
    .hero .cta-row .btn { text-align: center; }
    .card { padding: calc(var(--card-padding, 26px) * 0.85); }
    .pricing-card { padding: 32px 22px; }
    .countdown-timer { gap: 10px; }
    .countdown-timer .unit { min-width: 60px; padding: 12px 8px; }
    .countdown-timer .unit .num { font-size: 22px; }
    .site-nav-inner { padding: 0 16px; }
  }
  .card {
    background: var(--bg-surface);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius-card);
    padding: var(--card-padding, 26px);
  }
  section.alt-bg .card { background: var(--bg-elevated); }
  .card h3 { margin-bottom: 8px; }
  .card p { font-size: var(--fs-small); }

  /* Proof carousel: horizontal, scroll-snapped, touch-friendly. Cards
     stay within the normal content column and only start scrolling once
     there are more of them than fit — no edge-bleed layout trickery. */
  .carousel-track {
    display: flex;
    gap: var(--card-gap, 24px);
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding: 4px 24px 14px;
    max-width: var(--container-max-width, 880px);
    margin: 0 auto;
  }
  .carousel-track::-webkit-scrollbar { height: 7px; }
  .carousel-track::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
  .carousel-card {
    flex: 0 0 auto;
    width: 240px;
    scroll-snap-align: start;
    background: var(--bg-surface);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: var(--radius-card);
    overflow: hidden;
  }
  section.alt-bg .carousel-card { background: var(--bg-elevated); }
  .carousel-card img { width: 100%; height: 170px; object-fit: cover; display: block; }
  .carousel-card .caption { padding: 12px 14px; font-size: 13.5px; color: var(--text-body); }
  .carousel-empty { color: var(--text-muted); font-size: var(--fs-small); text-align: center; padding: 0 24px; }
  @media (max-width: 480px) {
    .carousel-card { width: 200px; }
    .carousel-card img { height: 140px; }
  }

  /* About / product split layout (image-left / image-right variant) */
  .about-split {
    display: flex;
    align-items: center;
    gap: 48px;
  }
  .about-split.reverse { flex-direction: row-reverse; }
  .about-split-img { flex: 1 1 0; border-radius: var(--radius-card); max-width: 420px; }
  .about-split-text { flex: 1 1 0; text-align: left; }
  .about-split-text h2 { text-align: left; }
  @media (max-width: 720px) {
    .about-split, .about-split.reverse { flex-direction: column; text-align: center; }
    .about-split-text { text-align: center; }
    .about-split-text h2 { text-align: center; }
    .about-split-img { max-width: 100%; }
  }

  /* Testimonials */
  .testimonial-card { font-style: normal; }
  .testimonial-avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 14px;
  }
  .testimonial-card .quote { font-size: 15px; margin-bottom: 16px; color: var(--text-body); }
  .testimonial-card .name { font-weight: 600; color: var(--text-heading); font-size: 14px; }
  .testimonial-card .role { font-size: 13px; color: var(--text-muted); }

  /* Pricing */
  .pricing-card {
    max-width: 420px;
    margin: 0 auto;
    text-align: center;
    background: var(--bg-elevated);
    border: 2px solid var(--accent-primary);
    border-radius: 20px;
    padding: 44px 32px;
  }
  .pricing-card .original-price {
    text-decoration: line-through;
    color: var(--text-muted);
    font-size: 16px;
    margin-right: 8px;
  }
  .pricing-card .price { font-family: var(--font-display); font-size: 42px; font-weight: 700; color: var(--text-heading); }
  .pricing-card .price-label { font-size: 13px; margin-bottom: 26px; color: var(--text-muted); }
  .pricing-card ul { list-style: none; text-align: left; margin: 0 0 30px; }
  .pricing-card li { padding: 9px 0; font-size: var(--fs-small); border-bottom: 1px solid rgba(255,255,255,0.08); color: var(--text-body); }

  /* Countdown */
  .countdown-timer {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 28px;
  }
  .countdown-timer .unit {
    background: var(--bg-elevated);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 16px 20px;
    min-width: 76px;
    text-align: center;
  }
  .countdown-timer .unit .num { font-family: var(--font-display); font-size: 28px; font-weight: 700; display: block; color: var(--text-heading); }
  .countdown-timer .unit .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }

  /* FAQ */
  .faq-item { border-bottom: 1px solid rgba(255,255,255,0.08); padding: 20px 0; }
  .faq-item summary { cursor: pointer; font-weight: 600; font-size: 15.5px; color: var(--text-heading); list-style: none; }
  .faq-item summary::-webkit-details-marker { display: none; }
  .faq-item p { margin-top: 10px; }

  /* CTA */
  .cta-section { text-align: var(--align, center); }

  /* Footer */
  footer {
    text-align: center;
    padding: 36px 0;
    font-size: 13px;
    color: var(--text-muted);
  }
  footer a { color: var(--accent-primary); text-decoration: none; }

  .watermark {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    padding: 14px 0 32px;
  }

  #loadingState, #errorState {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    background: var(--bg-base);
    font-family: -apple-system, sans-serif;
  }

  /* Sticky nav */
  .site-nav {
    position: sticky;
    top: 0;
    z-index: 50;
    height: var(--nav-height);
    background: rgba(11, 12, 16, 0.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .site-nav-inner {
    max-width: 1040px;
    height: 100%;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 28px;
  }
  .site-nav-links { display: flex; align-items: center; gap: 24px; flex: 1; }
  .nav-link {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-body);
    text-decoration: none;
    white-space: nowrap;
  }
  .nav-link:hover { color: var(--text-heading); }
  .nav-cta {
    display: inline-block;
    background: var(--accent-primary);
    color: var(--accent-on-dark);
    padding: 9px 20px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
  }
  @media (max-width: 720px) {
    .site-nav-links { display: none; }
    .site-nav-inner { justify-content: flex-end; }
  }

  /* Scroll reveal */
  [data-motion="on"] .reveal {
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  [data-motion="on"] .reveal.revealed {
    opacity: 1;
    transform: translateY(0);
  }
  @media (prefers-reduced-motion: reduce) {
    [data-motion="on"] .reveal {
      opacity: 1 !important;
      transform: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>

<div id="loadingState">Loading preview...</div>
<div id="errorState" style="display:none;"></div>
<div id="pageRoot" style="display:none;"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  const SECTION_RENDERERS = {
    hero: renderHero,
    problem: renderProblem,
    about: renderAbout,
    benefits: renderBenefits,
    how_it_works: renderHowItWorks,
    product_showcase: renderProductShowcase,
    testimonials: renderTestimonials,
    bonus: renderBonus,
    pricing: renderPricing,
    countdown: renderCountdown,
    faq: renderFaq,
    cta: renderCta,
    footer: renderFooter,
    card_carousel: renderCardCarousel,
  };

  // Labels used to build the sticky nav from whichever sections a page
  // actually has. Section types not listed here (hero, countdown, cta,
  // footer) never get a nav item — hero is the top of the page and the
  // others are conversion moments, not navigation destinations.
  const NAV_LABELS = {
    problem: 'Overview',
    about: 'About',
    benefits: 'Benefits',
    how_it_works: 'How It Works',
    product_showcase: 'Product',
    testimonials: 'Testimonials',
    bonus: 'Bonuses',
    pricing: 'Pricing',
    faq: 'FAQ',
    card_carousel: 'Proof',
  };

  const THEME_DEFAULTS = {
    bg_base: '#0f1115',
    bg_surface: '#171a21',
    bg_elevated: '#1f2229',
    text_heading: '#f2f0ea',
    text_body: '#cdd0d8',
    text_muted: '#9aa0ac',
    accent_primary: '#c9a15a',
    accent_on_dark: '#14161c',
    accent_on_light: '#ffffff',
    font_display: 'Playfair Display, Georgia, serif',
    font_body: 'Poppins, -apple-system, sans-serif',
    button_radius: '999px',
    motion_enabled: true,
    nav_enabled: false, // per-page toggle, off by default (see design plan discussion)
    section_padding: '88',
    heading_gap: '36',
    card_gap: '24',
    card_padding: '26',
    card_radius: '16',
    container_width: '880',
  };

  const LEGACY_KEY_MAP = {
    primary_color: 'accent_primary',
    background_color: 'bg_base',
    section_bg_alt: 'bg_surface',
    text_color: 'text_heading',
    muted_text_color: 'text_muted',
    button_text_color: 'accent_on_dark',
    button_radius: 'button_radius',
    font: '__font_both__',
  };

  function mergeTheme(rawTheme) {
    const theme = rawTheme || {};
    const resolved = Object.assign({}, THEME_DEFAULTS);

    Object.entries(LEGACY_KEY_MAP).forEach(([oldKey, newKey]) => {
      if (theme[oldKey] == null) return;
      if (newKey === '__font_both__') {
        resolved.font_display = theme[oldKey];
        resolved.font_body = theme[oldKey];
      } else {
        resolved[newKey] = theme[oldKey];
      }
    });

    Object.keys(THEME_DEFAULTS).forEach((key) => {
      if (theme[key] != null) resolved[key] = theme[key];
    });

    return resolved;
  }

  (async () => {
    const params = new URLSearchParams(window.location.search);

    // Live-preview mode: embedded in an iframe by editor.html's phone
    // mockup. No Supabase fetch at all here — the editor pushes the
    // current in-memory (possibly unsaved) form state via postMessage on
    // every edit, so the mockup reflects what's on screen, not what's in
    // the database. This never touches real page data or the DB.
    if (params.get('mode') === 'live-preview') {
      initLivePreviewMode();
      return;
    }

    const pageId = params.get('page');
    const viewMode = params.get('view') === 'published' ? 'published' : 'draft';

    if (!pageId) {
      showError('No page specified. Use renderer.html?page=PAGE_ID.');
      return;
    }

    const profile = await getCurrentProfile();
    if (!profile) {
      window.location.href = 'login.html';
      return;
    }

    const { data: page, error: pageError } = await supabaseClient
      .from('landing_pages')
      .select('*')
      .eq('id', pageId)
      .single();

    if (pageError || !page) {
      showError("Couldn't load this page. It may not exist, or you may not have access to it.");
      return;
    }

    if (viewMode === 'published') {
      if (!page.published_config) {
        showError("This page hasn't been published yet — there's no live version to show.");
        return;
      }
      renderPublished(page);
      return;
    }

    const { data: sections, error: sectionsError } = await supabaseClient
      .from('page_sections')
      .select('*')
      .eq('page_id', pageId)
      .eq('is_visible', true)
      .order('section_order', { ascending: true });

    if (sectionsError) {
      showError('Failed to load sections for this page.');
      return;
    }

    renderPage(page, sections || []);
  })();

  function renderPublished(page) {
    const snapshot = page.published_config;
    const theme = applyTheme(snapshot.theme || {});
    injectTrackingScripts(snapshot.tracking || {});

    const visibleSections = (snapshot.sections || []).filter(s => s.is_visible);
    renderSectionsInto(visibleSections, theme, page);

    initCountdowns();
    initScrollReveal(theme.motion_enabled);
    logPageVisit(page.id);
    attachClickTracking(page.id);
  }

  function renderPage(page, sections) {
    const theme = applyTheme((page.draft_config && page.draft_config.theme) || {});
    renderSectionsInto(sections, theme, page);
    initCountdowns();
    initScrollReveal(theme.motion_enabled);
  }

  // Live-preview mode for the editor's phone mockup. No DB access at all:
  // waits for postMessage updates from the parent editor window and
  // re-renders on every one. Sends a 'ready' handshake first so the
  // editor knows it's safe to start pushing state — otherwise the
  // editor's first message could arrive before this listener exists.
  function initLivePreviewMode() {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('pageRoot').style.display = 'block';

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || data.type !== 'scarls-preview-update') return;
      const theme = applyTheme(data.theme || {});
      // is_custom_domain: true just hides the watermark in the small
      // mockup so it doesn't repeat itself uselessly in a 320px frame —
      // it has no bearing on the real page's actual domain status.
      renderSectionsInto(data.sections || [], theme, { is_custom_domain: true });
      initCountdowns();
      initScrollReveal(theme.motion_enabled);
    });

    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'scarls-preview-ready' }, '*');
    }
  }

  // Shared by draft + published rendering: builds each section's HTML
  // (passing its own `styles` override object and a stable id), prepends
  // the sticky nav when the theme enables it, and injects the watermark.
  function renderSectionsInto(sections, theme, page) {
    const sectionsMeta = sections.map((section, idx) => ({
      id: `sec-${idx}-${section.section_type}`,
      type: section.section_type,
      content: section.content || {},
      styles: section.styles || {},
    }));

    const sectionsHtml = sectionsMeta.map(meta => {
      const renderer = SECTION_RENDERERS[meta.type];
      if (!renderer) return '';
      try {
        return renderer(meta.content, meta.styles, meta.id);
      } catch (e) {
        console.error(`Failed to render section ${meta.type}:`, e);
        return '';
      }
    }).join('');

    const navHtml = buildNav(sectionsMeta, theme);

    const watermarkHtml = page.is_custom_domain
      ? ''
      : `<div class="watermark">Powered by <a href="https://scarlssystems.com" target="_blank">SCARLS</a></div>`;

    document.getElementById('pageRoot').innerHTML = navHtml + sectionsHtml + watermarkHtml;
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('pageRoot').style.display = 'block';
  }

  // Builds the sticky nav from whichever sections have a NAV_LABELS entry.
  // Off by default per-page (theme.nav_enabled must be explicitly true).
  // The CTA pill prefers the pricing section's CTA, falling back to hero's.
  function buildNav(sectionsMeta, theme) {
    if (theme.nav_enabled !== true) return '';

    // A section can set its own styles.nav_label to override the generic
    // per-type label — needed once a page has more than one section of
    // the same type (two 'how_it_works' blocks can't both just say "How
    // It Works"). Sections that share the same *resolved* label (usually
    // duplicates that didn't get a custom label) are deduped, keeping
    // only the first, so the nav never repeats an identical entry.
    const seenLabels = new Set();
    const navItems = sectionsMeta
      .map(m => ({ id: m.id, label: (m.styles && m.styles.nav_label) || NAV_LABELS[m.type] || null }))
      .filter(m => {
        if (!m.label || seenLabels.has(m.label)) return false;
        seenLabels.add(m.label);
        return true;
      })
      .map(m => `<a href="#${m.id}" class="nav-link">${esc(m.label)}</a>`)
      .join('');

    if (!navItems) return '';

    const pricing = sectionsMeta.find(m => m.type === 'pricing' && m.content.cta_text);
    const cta = sectionsMeta.find(m => m.type === 'cta' && m.content.cta_text);
    const hero = sectionsMeta.find(m => m.type === 'hero' && m.content.cta_text);
    const ctaSource = pricing || cta || hero;
    const ctaHtml = ctaSource
      ? `<a class="nav-cta" href="${esc(ctaSource.content.cta_url || '#')}">${esc(ctaSource.content.cta_text)}</a>`
      : '';

    return `
      <nav class="site-nav">
        <div class="site-nav-inner">
          <div class="site-nav-links">${navItems}</div>
          ${ctaHtml}
        </div>
      </nav>
    `;
  }

  // --- Tracking ---

  function getSessionId() {
    let id = sessionStorage.getItem('scarls_session_id');
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`);
      sessionStorage.setItem('scarls_session_id', id);
    }
    return id;
  }

  function getUtmParams() {
    const params = new URLSearchParams(window.location.search);
    return {
      source: params.get('utm_source') || null,
      medium: params.get('utm_medium') || null,
      campaign: params.get('utm_campaign') || null,
      content: params.get('utm_content') || null,
    };
  }

  async function logPageVisit(pageId) {
    const utm = getUtmParams();
    const isMobile = /Mobi|Android/i.test(navigator.userAgent);

    try {
      await supabaseClient.from('page_visits').insert({
        page_id: pageId,
        session_id: getSessionId(),
        source: utm.source,
        medium: utm.medium,
        campaign: utm.campaign,
        content: utm.content,
        landing_url: window.location.href,
        device_type: isMobile ? 'mobile' : 'desktop',
      });
    } catch (e) {
      console.error('Failed to log page visit:', e);
    }
  }

  function attachClickTracking(pageId) {
    document.getElementById('pageRoot').addEventListener('click', (e) => {
      const btn = e.target.closest('.btn, .nav-cta');
      if (!btn) return;

      const utm = getUtmParams();
      supabaseClient.from('conversion_events').insert({
        page_id: pageId,
        session_id: getSessionId(),
        event_type: 'cta_click',
        source: utm.source,
        campaign: utm.campaign,
      }).then(({ error }) => {
        if (error) console.error('Failed to log conversion:', error);
      });
    });
  }

  function injectTrackingScripts(tracking) {
    if (tracking.enable_meta_pixel && tracking.meta_pixel_id && /^[0-9]+$/.test(tracking.meta_pixel_id)) {
      const pixelId = tracking.meta_pixel_id;
      const script = document.createElement('script');
      script.textContent = `
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
        n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
        document,'script','https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '${pixelId}');
        fbq('track', 'PageView');
      `;
      document.head.appendChild(script);
    }

    if (tracking.google_analytics_id && /^[A-Za-z0-9-]+$/.test(tracking.google_analytics_id)) {
      const gaId = tracking.google_analytics_id;
      const gtagSrc = document.createElement('script');
      gtagSrc.async = true;
      gtagSrc.src = `https://www.googletagmanager.com/gtag/js?id=${encodeURIComponent(gaId)}`;
      document.head.appendChild(gtagSrc);

      const gtagInit = document.createElement('script');
      gtagInit.textContent = `
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', '${gaId}');
      `;
      document.head.appendChild(gtagInit);
    }
  }

  function showError(msg) {
    document.getElementById('loadingState').style.display = 'none';
    const el = document.getElementById('errorState');
    el.textContent = msg;
    el.style.display = 'flex';
  }

  // Resolves the page's theme and applies every token as a CSS custom
  // property on :root; returns the resolved theme so callers can read
  // motion_enabled / nav_enabled without re-parsing.
  function applyTheme(rawTheme) {
    const theme = mergeTheme(rawTheme);
    const root = document.documentElement;
    const map = {
      bg_base: '--bg-base',
      bg_surface: '--bg-surface',
      bg_elevated: '--bg-elevated',
      text_heading: '--text-heading',
      text_body: '--text-body',
      text_muted: '--text-muted',
      accent_primary: '--accent-primary',
      accent_on_dark: '--accent-on-dark',
      accent_on_light: '--accent-on-light',
      font_display: '--font-display',
      font_body: '--font-body',
      button_radius: '--radius',
    };
    Object.entries(map).forEach(([key, cssVar]) => {
      if (theme[key] != null) root.style.setProperty(cssVar, theme[key]);
    });

    // Spacing/layout tokens are stored as bare numbers (no unit) so the
    // editor can use plain number inputs — 'px' is appended here, the one
    // place that needs to know the unit.
    const pxMap = {
      section_padding: '--section-padding',
      heading_gap: '--heading-gap',
      card_gap: '--card-gap',
      card_padding: '--card-padding',
      card_radius: '--radius-card',
      container_width: '--container-max-width',
    };
    Object.entries(pxMap).forEach(([key, cssVar]) => {
      if (theme[key] != null) root.style.setProperty(cssVar, `${theme[key]}px`);
    });

    root.setAttribute('data-motion', theme.motion_enabled === false ? 'off' : 'on');
    return theme;
  }

  function esc(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  // Per-section style overrides read from page_sections.styles (already
  // an unused jsonb column — no schema change). Supported keys:
  //   background    -> overrides this section's background directly
  //   text_color    -> overrides --text-heading for this section's subtree
  //   accent_color  -> overrides --accent-primary for this section's subtree
  //   reveal        -> false disables scroll-reveal for this section only
  //   layout        -> 'image-left' | 'image-right' (about, product_showcase only)
  //   align         -> 'left' overrides this section's centered copy (headline + body) to left-aligned
  // Anything unset falls through to the page theme, then the hard default —
  // nothing here is forced.
  function sectionStyleAttr(styles) {
    const vars = [];
    if (styles.background) vars.push(`background:${styles.background}`);
    if (styles.text_color) vars.push(`--text-heading:${styles.text_color}`);
    if (styles.accent_color) vars.push(`--accent-primary:${styles.accent_color}`);
    if (styles.align) vars.push(`--align:${styles.align}`);
    return vars.length ? ` style="${vars.join(';')}"` : '';
  }
  function revealClass(styles) {
    return styles.reveal === false ? '' : ' reveal';
  }

  // --- Section renderers ---
  // Each takes (content, styles, sectionId). Missing content fields
  // degrade gracefully. Top-level sections and grid cards carry the
  // `reveal` class (unless overridden off) for initScrollReveal().

  function renderHero(c, s = {}, id) {
    return `
      <section id="${id}" class="hero container${revealClass(s)}"${sectionStyleAttr(s)}>
        ${c.eyebrow ? `<div class="eyebrow">${esc(c.eyebrow)}</div>` : ''}
        <h1>${esc(c.headline || '')}</h1>
        ${c.subheadline ? `<p class="sub">${esc(c.subheadline)}</p>` : ''}
        ${c.image_url ? `<img src="${esc(c.image_url)}" alt="" style="border-radius:16px;margin:0 auto 28px;max-width:600px;">` : ''}
        <div class="cta-row">
          ${c.cta_text ? `<a class="btn" href="${esc(c.cta_url || '#')}">${esc(c.cta_text)}</a>` : ''}
          ${c.secondary_cta_text ? `<a class="btn secondary" href="${esc(c.secondary_cta_url || '#')}">${esc(c.secondary_cta_text)}</a>` : ''}
        </div>
      </section>
    `;
  }

  function renderProblem(c, s = {}, id) {
    return `
      <section id="${id}" class="container copy-center${revealClass(s)}" style="max-width:680px;"${sectionStyleAttr(s)}>
        <h2>${esc(c.headline || '')}</h2>
        <p style="font-size:16px;">${esc(c.body || '')}</p>
      </section>
    `;
  }

  function renderAbout(c, s = {}, id) {
    const layout = s.layout;
    if (layout === 'image-left' || layout === 'image-right') {
      const reversed = layout === 'image-right';
      return `
        <section id="${id}" class="alt-bg${revealClass(s)}"${sectionStyleAttr(s)}>
          <div class="container about-split${reversed ? ' reverse' : ''}">
            ${c.image_url ? `<img src="${esc(c.image_url)}" alt="" class="about-split-img">` : ''}
            <div class="about-split-text">
              <h2>${esc(c.headline || '')}</h2>
              <p style="font-size:16px;">${esc(c.body || '')}</p>
            </div>
          </div>
        </section>
      `;
    }
    return `
      <section id="${id}" class="alt-bg${revealClass(s)}"${sectionStyleAttr(s)}>
        <div class="container copy-center" style="max-width:680px;">
          ${c.image_url ? `<img src="${esc(c.image_url)}" alt="" style="border-radius:16px;margin:0 auto 28px;max-width:400px;">` : ''}
          <h2>${esc(c.headline || '')}</h2>
          <p style="font-size:16px;">${esc(c.body || '')}</p>
        </div>
      </section>
    `;
  }

  function renderBenefits(c, s = {}, id) {
    const items = (c.items || []).map(item => `
      <div class="card${revealClass(s)}">
        <h3>${esc(item.title || '')}</h3>
        <p>${esc(item.description || '')}</p>
      </div>
    `).join('');
    return `
      <section id="${id}" class="container"${sectionStyleAttr(s)}>
        <h2 class="${revealClass(s).trim()}">${esc(c.headline || '')}</h2>
        <div class="grid cols-2">${items}</div>
      </section>
    `;
  }

  function renderHowItWorks(c, s = {}, id) {
    const steps = (c.steps || []).map(step => `
      <div class="card${revealClass(s)}">
        <h3>${esc(step.title || '')}</h3>
        <p>${esc(step.description || '')}</p>
      </div>
    `).join('');
    return `
      <section id="${id}" class="alt-bg"${sectionStyleAttr(s)}>
        <div class="container">
          <h2 class="${revealClass(s).trim()}">${esc(c.headline || '')}</h2>
          <div class="grid cols-3">${steps}</div>
        </div>
      </section>
    `;
  }

  function renderProductShowcase(c, s = {}, id) {
    const layout = s.layout;
    if (layout === 'image-left' || layout === 'image-right') {
      const reversed = layout === 'image-right';
      return `
        <section id="${id}" class="container${revealClass(s)}"${sectionStyleAttr(s)}>
          <div class="about-split${reversed ? ' reverse' : ''}">
            ${c.image_url ? `<img src="${esc(c.image_url)}" alt="" class="about-split-img">` : ''}
            <div class="about-split-text">
              <h2>${esc(c.headline || '')}</h2>
              <p style="font-size:16px;">${esc(c.description || '')}</p>
            </div>
          </div>
        </section>
      `;
    }
    return `
      <section id="${id}" class="container copy-center${revealClass(s)}" style="max-width:680px;"${sectionStyleAttr(s)}>
        <h2>${esc(c.headline || '')}</h2>
        ${c.image_url ? `<img src="${esc(c.image_url)}" alt="" style="border-radius:16px;margin:0 auto 24px;">` : ''}
        <p style="font-size:16px;">${esc(c.description || '')}</p>
      </section>
    `;
  }

  function renderTestimonials(c, s = {}, id) {
    const items = (c.items || []).map(t => `
      <div class="card testimonial-card${revealClass(s)}">
        ${t.image_url ? `<img src="${esc(t.image_url)}" alt="" class="testimonial-avatar">` : ''}
        <p class="quote">"${esc(t.quote || '')}"</p>
        <div class="name">${esc(t.name || '')}</div>
        <div class="role">${esc(t.role || '')}</div>
      </div>
    `).join('');
    return `
      <section id="${id}" class="alt-bg"${sectionStyleAttr(s)}>
        <div class="container">
          <h2 class="${revealClass(s).trim()}">${esc(c.headline || '')}</h2>
          <div class="grid cols-2">${items}</div>
        </div>
      </section>
    `;
  }

  // Horizontal, scroll-snapped proof/screenshot carousel. Each item is an
  // image + a short caption — no name/role/quote fields, since this is
  // for evidence (earnings screenshots, sale notifications, community
  // shots), not people testimonials. Items missing an image are skipped
  // entirely rather than showing an empty box.
  function renderCardCarousel(c, s = {}, id) {
    const items = (c.items || [])
      .filter(item => item.image_url)
      .map(item => `
        <div class="carousel-card">
          <img src="${esc(item.image_url)}" alt="">
          ${item.caption ? `<div class="caption">${esc(item.caption)}</div>` : ''}
        </div>
      `).join('');

    return `
      <section id="${id}" class="${s.background ? '' : 'alt-bg'}${revealClass(s)}"${sectionStyleAttr(s)}>
        <div class="container">
          <h2 class="${revealClass(s).trim()}">${esc(c.headline || '')}</h2>
        </div>
        ${items ? `<div class="carousel-track">${items}</div>` : `<p class="carousel-empty">No proof added yet — add screenshots through the editor.</p>`}
      </section>
    `;
  }

  function renderBonus(c, s = {}, id) {
    const items = (c.items || []).map(item => `
      <div class="card${revealClass(s)}">
        <h3>🎁 ${esc(item.title || '')}</h3>
        <p>${esc(item.description || '')}</p>
      </div>
    `).join('');
    return `
      <section id="${id}" class="container"${sectionStyleAttr(s)}>
        <h2 class="${revealClass(s).trim()}">${esc(c.headline || '')}</h2>
        <div class="grid cols-2">${items}</div>
      </section>
    `;
  }

  function renderPricing(c, s = {}, id) {
    const features = (c.features || []).map(f => `<li>✓ ${esc(f)}</li>`).join('');
    return `
      <section id="${id}" class="alt-bg"${sectionStyleAttr(s)}>
        <div class="container">
          <h2 class="${revealClass(s).trim()}">${esc(c.headline || '')}</h2>
          <div class="pricing-card${revealClass(s)}">
            <div>
              ${c.original_price ? `<span class="original-price">${esc(c.original_price)}</span>` : ''}
              <span class="price">${esc(c.price || '')}</span>
            </div>
            ${c.price_label ? `<div class="price-label">${esc(c.price_label)}</div>` : ''}
            <ul>${features}</ul>
            ${c.cta_text ? `<a class="btn" href="${esc(c.cta_url || '#')}" style="width:100%;">${esc(c.cta_text)}</a>` : ''}
          </div>
        </div>
      </section>
    `;
  }

  function renderCountdown(c, s = {}, id) {
    return `
      <section id="${id}" class="container copy-center${revealClass(s)}"${sectionStyleAttr(s)}>
        <h2>${esc(c.headline || '')}</h2>
        ${c.subheadline ? `<p>${esc(c.subheadline)}</p>` : ''}
        <div class="countdown-timer" data-end="${esc(c.end_date || '')}">
          <div class="unit"><span class="num" data-unit="days">--</span><span class="label">Days</span></div>
          <div class="unit"><span class="num" data-unit="hours">--</span><span class="label">Hours</span></div>
          <div class="unit"><span class="num" data-unit="minutes">--</span><span class="label">Mins</span></div>
          <div class="unit"><span class="num" data-unit="seconds">--</span><span class="label">Secs</span></div>
        </div>
      </section>
    `;
  }

  function renderFaq(c, s = {}, id) {
    const items = (c.items || []).map(item => `
      <details class="faq-item">
        <summary>${esc(item.question || '')}</summary>
        <p>${esc(item.answer || '')}</p>
      </details>
    `).join('');
    return `
      <section id="${id}" class="container${revealClass(s)}" style="max-width:680px;"${sectionStyleAttr(s)}>
        <h2>${esc(c.headline || '')}</h2>
        ${items}
      </section>
    `;
  }

  function renderCta(c, s = {}, id) {
    return `
      <section id="${id}" class="alt-bg cta-section${revealClass(s)}"${sectionStyleAttr(s)}>
        <div class="container">
          <h2>${esc(c.headline || '')}</h2>
          ${c.body ? `<p style="font-size:16px; max-width:520px; margin:0 auto 28px;">${esc(c.body)}</p>` : ''}
          ${c.cta_text ? `<a class="btn" href="${esc(c.cta_url || '#')}">${esc(c.cta_text)}</a>` : ''}
        </div>
      </section>
    `;
  }

  function renderFooter(c, s = {}, id) {
    return `
      <footer id="${id}"${sectionStyleAttr(s)}>
        <div class="container">
          ${esc(c.text || '')}
          ${c.whatsapp_url ? ` · <a href="${esc(c.whatsapp_url)}" target="_blank">WhatsApp</a>` : ''}
        </div>
      </footer>
    `;
  }

  // --- Countdown ticking ---
  function initCountdowns() {
    document.querySelectorAll('.countdown-timer[data-end]').forEach(el => {
      const end = new Date(el.dataset.end).getTime();
      if (isNaN(end)) return;

      function tick() {
        const diff = Math.max(0, end - Date.now());
        const days = Math.floor(diff / 86400000);
        const hours = Math.floor((diff % 86400000) / 3600000);
        const minutes = Math.floor((diff % 3600000) / 60000);
        const seconds = Math.floor((diff % 60000) / 1000);
        el.querySelector('[data-unit="days"]').textContent = days;
        el.querySelector('[data-unit="hours"]').textContent = hours;
        el.querySelector('[data-unit="minutes"]').textContent = minutes;
        el.querySelector('[data-unit="seconds"]').textContent = seconds;
      }
      tick();
      setInterval(tick, 1000);
    });
  }

  // --- Scroll reveal ---
  function initScrollReveal(motionEnabled) {
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (motionEnabled === false || prefersReduced) return;

    const items = Array.from(document.querySelectorAll('.reveal'));
    if (!items.length || !('IntersectionObserver' in window)) return;

    const delays = new WeakMap();
    let groupParent = null;
    let indexInGroup = 0;
    items.forEach((el) => {
      if (el.parentElement !== groupParent) {
        groupParent = el.parentElement;
        indexInGroup = 0;
      }
      delays.set(el, Math.min(indexInGroup * 80, 320));
      indexInGroup += 1;
    });

    const observer = new IntersectionObserver((entries, obs) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        const el = entry.target;
        setTimeout(() => el.classList.add('revealed'), delays.get(el) || 0);
        obs.unobserve(el);
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

    items.forEach((el) => observer.observe(el));
  }
</script>
