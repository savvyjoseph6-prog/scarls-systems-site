<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Dashboard — SCARLS</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e8e8ec;
    margin: 0;
    padding: 24px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 720px;
    margin: 0 auto 24px;
  }
  h1 { font-size: 20px; margin: 0; }
  #whoami { color: #9297a3; font-size: 13px; margin-top: 2px; }
  button.logout {
    background: transparent;
    border: 1px solid #2a2e38;
    color: #b3b7c1;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .page-card {
    background: #171a21;
    border: 1px solid #2a2e38;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 14px;
  }
  .page-card h2 { font-size: 16px; margin: 0 0 4px; }
  .page-card .slug { color: #9297a3; font-size: 13px; margin-bottom: 12px; }
  .badge {
    display: inline-block;
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 999px;
    margin-right: 6px;
  }
  .badge.building { background: #3a3320; color: #e8c85b; }
  .badge.waiting { background: #20303a; color: #6bb8e8; }
  .badge.ready { background: #1f3a24; color: #6be88f; }
  .badge.draft { background: #2a2e38; color: #b3b7c1; }
  .badge.published { background: #1f3a24; color: #6be88f; }
  .actions { margin-top: 14px; }
  .btn-primary {
    background: #5b8cff;
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .empty {
    color: #9297a3;
    text-align: center;
    padding: 40px 0;
  }
  .note {
    background: #171a21;
    border: 1px solid #2a2e38;
    border-radius: 10px;
    padding: 14px 16px;
    color: #9297a3;
    font-size: 13px;
    margin-top: 20px;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>My Landing Pages</h1>
    <div id="whoami"></div>
  </div>
  <button class="logout" onclick="logout()">Log Out</button>
</header>

<div class="wrap">
  <div id="pagesList"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  (async () => {
    const profile = await requireAuth('student');
    if (!profile) return; // requireAuth already redirected

    document.getElementById('whoami').textContent =
      `${profile.full_name || profile.email}`;

    const { data: pages, error } = await supabaseClient
      .from('landing_pages')
      .select('*')
      .order('created_at', { ascending: false });

    const container = document.getElementById('pagesList');

    if (error) {
      container.innerHTML = `<div class="empty">Couldn't load your pages. Please refresh.</div>`;
      console.error(error);
      return;
    }

    if (!pages || pages.length === 0) {
      container.innerHTML = `<div class="empty">You don't have any landing pages yet.</div>`;
      return;
    }

    container.innerHTML = pages.map(renderPageCard).join('');
  })();

  function renderPageCard(page) {
    let statusBadge = '';
    let action = '';

    if (page.build_status === 'awaiting_build') {
      statusBadge = `<span class="badge building">Being built by our team</span>`;
      action = `<div class="note">We're setting up your page right now — headline, images, colors, everything. You'll get access to edit it yourself as soon as it's ready.</div>`;
    } else if (page.build_status === 'ready_for_student') {
      statusBadge = `<span class="badge waiting">Almost ready</span>`;
      action = `<div class="note">Your page is built and being reviewed. We'll send you access shortly.</div>`;
    } else {
      // build_status is null or 'handed_over' — editable
      statusBadge = page.status === 'published'
        ? `<span class="badge published">Live</span>`
        : `<span class="badge draft">Draft</span>`;
      action = `<div class="actions">
        <a class="btn-primary" href="editor.html?page=${page.id}">Edit Page</a>
      </div>`;
    }

    return `
      <div class="page-card">
        <h2>${escapeHtml(page.name)}</h2>
        <div class="slug">scarlssystem.com/p/${escapeHtml(page.slug)}</div>
        ${statusBadge}
        ${action}
      </div>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
</script>

</body>
</html>
