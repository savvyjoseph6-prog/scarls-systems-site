<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Dashboard — SCARLS</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e8e8ec;
    margin: 0;
    padding: 24px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 720px;
    margin: 0 auto 24px;
  }
  h1 { font-size: 20px; margin: 0; }
  #whoami { color: #9297a3; font-size: 13px; margin-top: 2px; }
  .header-actions { display: flex; gap: 8px; }
  button.logout, button.secondary-header {
    background: transparent;
    border: 1px solid #2a2e38;
    color: #b3b7c1;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .page-card {
    background: #171a21;
    border: 1px solid #2a2e38;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 14px;
  }
  .page-card h2 { font-size: 16px; margin: 0 0 4px; }
  .page-card .slug { color: #9297a3; font-size: 13px; margin-bottom: 12px; }
  .badge {
    display: inline-block;
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 999px;
    margin-right: 6px;
  }
  .badge.building { background: #3a3320; color: #e8c85b; }
  .badge.waiting { background: #20303a; color: #6bb8e8; }
  .badge.ready { background: #1f3a24; color: #6be88f; }
  .badge.draft { background: #2a2e38; color: #b3b7c1; }
  .badge.published { background: #1f3a24; color: #6be88f; }
  .actions { margin-top: 14px; }
  .btn-primary {
    background: #5b8cff;
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .empty {
    color: #9297a3;
    text-align: center;
    padding: 40px 0;
  }
  .note {
    background: #171a21;
    border: 1px solid #2a2e38;
    border-radius: 10px;
    padding: 14px 16px;
    color: #9297a3;
    font-size: 13px;
    margin-top: 20px;
  }

  .upgrade-banner {
    margin-top: 16px;
    background: linear-gradient(135deg, rgba(91,140,255,0.12), rgba(91,140,255,0.04));
    border: 1px solid rgba(91,140,255,0.35);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .upgrade-banner-text { font-size: 13px; color: #d7defa; flex: 1; min-width: 200px; }
  .upgrade-banner-actions { display: flex; align-items: center; gap: 10px; }
  .upgrade-btn {
    background: #5b8cff;
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
  }
  .upgrade-dismiss {
    background: transparent;
    border: none;
    color: #9297a3;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 0 4px;
  }
  .upgrade-dismiss:hover { color: #e8e8ec; }

  /* Change password panel */
  .cp-panel {
    background: #171a21;
    border: 1px solid #2a2e38;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    display: none;
  }
  .cp-panel.open { display: block; }
  .cp-panel h2 { font-size: 15px; margin: 0 0 14px; }
  .cp-panel label { display: block; font-size: 13px; color: #b3b7c1; margin-bottom: 6px; }
  .cp-panel input {
    width: 100%;
    padding: 10px 12px;
    background: #0f1115;
    border: 1px solid #2a2e38;
    border-radius: 8px;
    color: #e8e8ec;
    font-size: 14px;
    margin-bottom: 14px;
  }
  .cp-panel input:focus { outline: none; border-color: #5b8cff; }
  .cp-actions { display: flex; gap: 8px; }
  .cp-error {
    background: #3a1d1d;
    border: 1px solid #6b2b2b;
    color: #ff9a9a;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 14px;
    display: none;
  }
  .cp-success {
    background: #1d3a24;
    border: 1px solid #2b6b3b;
    color: #9affab;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 14px;
    display: none;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>My Landing Pages</h1>
    <div id="whoami"></div>
  </div>
  <div class="header-actions">
    <button class="secondary-header" onclick="toggleChangePassword()">Change Password</button>
    <button class="logout" onclick="logout()">Log Out</button>
  </div>
</header>

<div class="wrap">

  <div class="cp-panel" id="cpPanel">
    <h2>Change Password</h2>
    <div class="cp-error" id="cpError"></div>
    <div class="cp-success" id="cpSuccess"></div>
    <form id="cpForm">
      <label for="cpNewPassword">New password</label>
      <input type="password" id="cpNewPassword" required minlength="8" autocomplete="new-password">
      <label for="cpConfirmPassword">Confirm new password</label>
      <input type="password" id="cpConfirmPassword" required minlength="8" autocomplete="new-password">
      <div class="cp-actions">
        <button type="submit" class="btn-primary" id="cpSubmitBtn">Update Password</button>
        <button type="button" class="secondary-header" onclick="toggleChangePassword()">Cancel</button>
      </div>
    </form>
  </div>

  <div id="pagesList"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  (async () => {
    const profile = await requireAuth('student');
    if (!profile) return; // requireAuth already redirected

    document.getElementById('whoami').textContent =
      `${profile.full_name || profile.email}`;

    const { data: pages, error } = await supabaseClient
      .from('landing_pages')
      .select('*')
      .order('created_at', { ascending: false });

    const container = document.getElementById('pagesList');

    if (error) {
      container.innerHTML = `<div class="empty">Couldn't load your pages. Please refresh.</div>`;
      console.error(error);
      return;
    }

    if (!pages || pages.length === 0) {
      container.innerHTML = `<div class="empty">You don't have any landing pages yet.</div>`;
      return;
    }

    container.innerHTML = pages.map(renderPageCard).join('');
  })();

  function renderPageCard(page) {
    let statusBadge = '';
    let action = '';

    if (page.build_status === 'awaiting_build') {
      statusBadge = `<span class="badge building">Being built by our team</span>`;
      action = `<div class="note">We're setting up your page right now — headline, images, colors, everything. You'll get access to edit it yourself as soon as it's ready.</div>`;
    } else if (page.build_status === 'ready_for_student') {
      statusBadge = `<span class="badge waiting">Almost ready</span>`;
      action = `<div class="note">Your page is built and being reviewed. We'll send you access shortly.</div>`;
    } else {
      // build_status is null or 'handed_over' — editable
      statusBadge = page.status === 'published'
        ? `<span class="badge published">Live</span>`
        : `<span class="badge draft">Draft</span>`;
      action = `<div class="actions">
        <a class="btn-primary" href="editor.html?page=${page.id}">Edit Page</a>
        <a class="btn-primary" style="background:transparent;border:1px solid #2a2e38;color:#b3b7c1;margin-left:8px;" href="renderer.html?page=${page.id}" target="_blank">Preview Draft</a>
        ${page.status === 'published' ? `<a class="btn-primary" style="background:transparent;border:1px solid #2a2e38;color:#b3b7c1;margin-left:8px;" href="renderer.html?page=${page.id}&view=published" target="_blank">View Live</a>` : ''}
      </div>`;
    }

    const showUpgradeBanner = page.status === 'published' && !page.is_custom_domain && !isUpgradeBannerDismissed(page.id);
    const upgradeBannerHtml = showUpgradeBanner ? `
      <div class="upgrade-banner" id="upgrade-banner-${page.id}">
        <div class="upgrade-banner-text">
          <strong>Remove the "Powered by SCARLS" watermark</strong> — connect your own domain and make this page fully yours.
        </div>
        <div class="upgrade-banner-actions">
          <a class="upgrade-btn" href="${UPGRADE_CONTACT_URL}" target="_blank">Upgrade Now</a>
          <button class="upgrade-dismiss" onclick="dismissUpgradeBanner('${page.id}')" aria-label="Dismiss">&times;</button>
        </div>
      </div>
    ` : '';

    return `
      <div class="page-card">
        <h2>${escapeHtml(page.name)}</h2>
        <div class="slug">scarlssystems.com/p/${escapeHtml(page.slug)}</div>
        ${statusBadge}
        ${action}
        ${upgradeBannerHtml}
      </div>
    `;
  }

  // Upgrade nudge: shown only here and in the editor, never on the public
  // page itself. "Periodically" = dismissible, but comes back after 7 days
  // rather than being gone forever after one click.
  const UPGRADE_BANNER_COOLDOWN_MS = 7 * 24 * 60 * 60 * 1000;
  // TODO(Saviour): replace with the real SCARLS support WhatsApp number.
  const UPGRADE_CONTACT_URL = 'https://wa.me/YOUR_WHATSAPP_NUMBER_HERE?text=I%27d%20like%20to%20upgrade%20to%20my%20own%20domain';

  function isUpgradeBannerDismissed(pageId) {
    const dismissedAt = localStorage.getItem(`upgrade_banner_dismissed_${pageId}`);
    if (!dismissedAt) return false;
    return (Date.now() - Number(dismissedAt)) < UPGRADE_BANNER_COOLDOWN_MS;
  }

  function dismissUpgradeBanner(pageId) {
    localStorage.setItem(`upgrade_banner_dismissed_${pageId}`, String(Date.now()));
    const el = document.getElementById(`upgrade-banner-${pageId}`);
    if (el) el.remove();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  // --- Change password (in-dashboard, already-authenticated) ---
  function toggleChangePassword() {
    const panel = document.getElementById('cpPanel');
    panel.classList.toggle('open');
    if (!panel.classList.contains('open')) {
      document.getElementById('cpForm').reset();
      document.getElementById('cpError').style.display = 'none';
      document.getElementById('cpSuccess').style.display = 'none';
    }
  }

  document.getElementById('cpForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('cpError');
    const successBox = document.getElementById('cpSuccess');
    const submitBtn = document.getElementById('cpSubmitBtn');
    errorBox.style.display = 'none';
    successBox.style.display = 'none';

    const newPassword = document.getElementById('cpNewPassword').value;
    const confirmPassword = document.getElementById('cpConfirmPassword').value;

    if (newPassword.length < 8) {
      errorBox.textContent = 'Password must be at least 8 characters.';
      errorBox.style.display = 'block';
      return;
    }
    if (newPassword !== confirmPassword) {
      errorBox.textContent = 'Passwords do not match.';
      errorBox.style.display = 'block';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating...';

    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

    submitBtn.disabled = false;
    submitBtn.textContent = 'Update Password';

    if (error) {
      errorBox.textContent = error.message;
      errorBox.style.display = 'block';
      return;
    }

    successBox.textContent = 'Password updated.';
    successBox.style.display = 'block';
    document.getElementById('cpForm').reset();
  });
</script>

</body>
</html>
