<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log In — SCARLS</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e8e8ec;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: #171a21;
    border: 1px solid #2a2e38;
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 380px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  p.sub {
    color: #9297a3;
    font-size: 14px;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #b3b7c1;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    background: #0f1115;
    border: 1px solid #2a2e38;
    border-radius: 8px;
    color: #e8e8ec;
    font-size: 14px;
    margin-bottom: 16px;
  }
  input:focus {
    outline: none;
    border-color: #5b8cff;
  }
  button {
    width: 100%;
    padding: 11px;
    background: #5b8cff;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .error {
    background: #3a1d1d;
    border: 1px solid #6b2b2b;
    color: #ff9a9a;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Log in to your dashboard</h1>
  <p class="sub">SCARLS Landing Page Platform</p>

  <div class="error" id="errorBox"></div>

  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="email">

    <label for="password">Password</label>
    <input type="password" id="password" required autocomplete="current-password">

    <button type="submit" id="submitBtn">Log In</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('errorBox');
  const submitBtn = document.getElementById('submitBtn');

  // If already logged in, skip straight to the right dashboard.
  (async () => {
    const profile = await getCurrentProfile();
    if (profile) {
      window.location.href = profile.role === 'admin'
        ? 'admin-landing-pages.html'
        : 'student-dashboard.html';
    }
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      errorBox.textContent = error.message;
      errorBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log In';
      return;
    }

    const { data: profile, error: profileError } = await supabaseClient
      .from('profiles')
      .select('role')
      .eq('id', data.user.id)
      .single();

    if (profileError || !profile) {
      errorBox.textContent = 'Logged in, but no profile was found for this account. Contact support.';
      errorBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log In';
      return;
    }

    window.location.href = profile.role === 'admin'
      ? 'admin-landing-pages.html'
      : 'student-dashboard.html';
  });
</script>

</body>
</html>
