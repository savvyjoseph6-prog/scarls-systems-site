plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
}
android {
    namespace "com.scarlssystems.app"
    compileSdk 34
    defaultConfig {
        applicationId "com.scarlssystems.app"
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("APP_VERSION_CODE") ?: "1")
        versionName "1.0." + (System.getenv("APP_VERSION_CODE") ?: "1")
    }
    signingConfigs {
        release {
            def ks = System.getenv("KEYSTORE_PATH")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation platform("com.google.firebase:firebase-bom:33.5.1")
    implementation "com.google.firebase:firebase-messaging"
}
