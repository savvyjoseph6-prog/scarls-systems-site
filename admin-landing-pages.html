<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landing Pages Admin — SCARLS</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e8e8ec;
    margin: 0;
    padding: 24px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 900px;
    margin: 0 auto 24px;
  }
  h1 { font-size: 20px; margin: 0; }
  #whoami { color: #9297a3; font-size: 13px; margin-top: 2px; }
  button.logout {
    background: transparent;
    border: 1px solid #2a2e38;
    color: #b3b7c1;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  .section-title {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #9297a3;
    margin: 28px 0 12px;
  }
  .page-row {
    background: #171a21;
    border: 1px solid #2a2e38;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-info h2 { font-size: 15px; margin: 0 0 4px; }
  .page-info .meta { color: #9297a3; font-size: 12.5px; }
  .badge {
    display: inline-block;
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .badge.building { background: #3a3320; color: #e8c85b; }
  .badge.waiting { background: #20303a; color: #6bb8e8; }
  .badge.ready { background: #1f3a24; color: #6be88f; }
  .badge.none { background: #2a2e38; color: #b3b7c1; }
  .btn {
    background: #5b8cff;
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary {
    background: transparent;
    border: 1px solid #2a2e38;
    color: #b3b7c1;
  }
  .empty { color: #9297a3; padding: 20px 0; }
  .link-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .link-row input {
    background: #0f1115;
    border: 1px solid #2a2e38;
    border-radius: 6px;
    color: #e8e8ec;
    padding: 6px 10px;
    font-size: 12.5px;
    width: 180px;
  }
  .brief-panel {
    width: 100%;
    background: #0f1115;
    border: 1px solid #2a2e38;
    border-radius: 10px;
    padding: 16px;
    margin-top: 10px;
    display: none;
    font-size: 13px;
  }
  .brief-panel.open { display: block; }
  .brief-panel .brief-meta { color: #9297a3; margin-bottom: 10px; }
  .brief-panel dt { color: #9297a3; font-size: 11px; text-transform: uppercase; margin-top: 10px; }
  .brief-panel dd { margin: 2px 0 0; white-space: pre-wrap; }
  .brief-panel .no-brief { color: #9297a3; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Landing Pages — Admin</h1>
    <div id="whoami"></div>
  </div>
  <button class="logout" onclick="logout()">Log Out</button>
</header>

<div class="wrap">
  <div class="section-title">Awaiting Build</div>
  <div id="awaitingBuild"></div>

  <div class="section-title">Ready — Awaiting Send Access</div>
  <div id="readyForStudent"></div>

  <div class="section-title">Handed Over / Self-Serve</div>
  <div id="handedOver"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  (async () => {
    const profile = await requireAuth('admin');
    if (!profile) return;

    document.getElementById('whoami').textContent = `${profile.full_name || profile.email} (admin)`;

    await loadPages();
  })();

  let allPagesById = {};

  async function loadPages() {
    const { data: pages, error } = await supabaseClient
      .from('landing_pages')
      .select('*, profiles:owner_id(full_name, email)')
      .order('created_at', { ascending: false });

    if (error) {
      console.error(error);
      document.getElementById('awaitingBuild').innerHTML = `<div class="empty">Failed to load pages.</div>`;
      return;
    }

    allPagesById = Object.fromEntries(pages.map(p => [p.id, p]));

    const awaiting = pages.filter(p => p.build_status === 'awaiting_build');
    const ready = pages.filter(p => p.build_status === 'ready_for_student');
    const handedOver = pages.filter(p => p.build_status === 'handed_over' || p.build_status === null);

    render('awaitingBuild', awaiting, 'awaiting_build');
    render('readyForStudent', ready, 'ready_for_student');
    render('handedOver', handedOver, 'handed_over');
  }

  function render(containerId, pages, bucket) {
    const el = document.getElementById(containerId);
    if (pages.length === 0) {
      el.innerHTML = `<div class="empty">Nothing here.</div>`;
      return;
    }
    el.innerHTML = pages.map(p => renderRow(p, bucket)).join('');
  }

  function renderRow(page, bucket) {
    const owner = page.profiles ? (page.profiles.full_name || page.profiles.email) : 'Unknown';
    let actionBtn = '';

    if (bucket === 'awaiting_build') {
      actionBtn = `<button class="btn" onclick="markBuilt('${page.id}')">Mark as Built</button>`;
    } else if (bucket === 'ready_for_student') {
      actionBtn = `<button class="btn" onclick="sendAccess('${page.id}')">Send Access</button>`;
    } else {
      actionBtn = `<span class="badge ready">${page.status}</span>`;
    }

    // Brief linking/viewing — reuses the existing projects/project_briefs
    // tables rather than duplicating that intake system.
    const briefControls = page.project_id
      ? `<button class="btn btn-secondary" onclick="toggleBrief('${page.id}')">View Brief</button>`
      : `<div class="link-row">
           <input type="text" id="link-input-${page.id}" placeholder="Order ref or project ID">
           <button class="btn btn-secondary" onclick="linkProject('${page.id}')">Link</button>
         </div>`;

    return `
      <div class="page-row">
        <div class="page-info">
          <h2>${escapeHtml(page.name)}</h2>
          <div class="meta">scarlssystems.com/p/${escapeHtml(page.slug)} · Owner: ${escapeHtml(owner)}</div>
          ${briefControls}
          <div class="brief-panel" id="brief-panel-${page.id}"></div>
        </div>
        <a class="btn btn-secondary" href="editor.html?page=${page.id}">Edit</a>
        <a class="btn btn-secondary" href="renderer.html?page=${page.id}" target="_blank">Preview</a>
        ${page.status === 'published' ? `<a class="btn btn-secondary" href="renderer.html?page=${page.id}&view=published" target="_blank">Live</a>` : ''}
        ${actionBtn}
      </div>
    `;
  }

  async function linkProject(pageId) {
    const input = document.getElementById(`link-input-${pageId}`);
    const value = input.value.trim();
    if (!value) return;

    // Accept either a plain project UUID or an order reference.
    let query = supabaseClient.from('projects').select('id').limit(1);
    query = value.includes('-') && value.length === 36
      ? query.eq('id', value)
      : query.eq('order_reference', value);

    const { data: matches, error } = await query;

    if (error || !matches || matches.length === 0) {
      alert('No matching project found for that reference/ID.');
      return;
    }

    const { error: updateError } = await supabaseClient
      .from('landing_pages')
      .update({ project_id: matches[0].id })
      .eq('id', pageId);

    if (updateError) {
      alert('Failed to link: ' + updateError.message);
      return;
    }
    await loadPages();
  }

  const briefCache = {};

  async function toggleBrief(pageId) {
    const panel = document.getElementById(`brief-panel-${pageId}`);
    const isOpen = panel.classList.contains('open');

    if (isOpen) {
      panel.classList.remove('open');
      return;
    }

    if (!briefCache[pageId]) {
      panel.innerHTML = 'Loading...';
      panel.classList.add('open');

      const page = allPagesById[pageId];
      const { data: project, error: projectError } = await supabaseClient
        .from('projects')
        .select('*')
        .eq('id', page.project_id)
        .single();

      if (projectError || !project) {
        panel.innerHTML = `<div class="no-brief">Couldn't load the linked project.</div>`;
        return;
      }

      const { data: brief } = await supabaseClient
        .from('project_briefs')
        .select('*')
        .eq('project_id', page.project_id)
        .single();

      briefCache[pageId] = renderBriefPanel(project, brief);
    }

    panel.innerHTML = briefCache[pageId];
    panel.classList.add('open');
  }

  function renderBriefPanel(project, brief) {
    const header = `
      <div class="brief-meta">
        ${escapeHtml(project.full_name)} · ${escapeHtml(project.business_name || '')} ·
        Ref: ${escapeHtml(project.order_reference || project.id)}
      </div>
    `;

    if (!brief || !brief.answers || Object.keys(brief.answers).length === 0) {
      return header + `<div class="no-brief">No brief submitted yet for this project. Check the existing admin panel for uploaded files and full details.</div>`;
    }

    const answerRows = Object.entries(brief.answers).map(([key, value]) => `
      <dt>${escapeHtml(key)}</dt>
      <dd>${escapeHtml(typeof value === 'string' ? value : JSON.stringify(value))}</dd>
    `).join('');

    return header + `
      <div>Brief status: <strong>${escapeHtml(brief.status)}</strong></div>
      <dl>${answerRows}</dl>
      <div class="no-brief" style="margin-top:10px;">Uploaded files aren't shown here — view them in the existing admin panel using the reference above.</div>
    `;
  }

  async function markBuilt(pageId) {
    const { error } = await supabaseClient
      .from('landing_pages')
      .update({ build_status: 'ready_for_student' })
      .eq('id', pageId);

    if (error) {
      alert('Failed to update: ' + error.message);
      return;
    }
    await loadPages();
  }

  async function sendAccess(pageId) {
    // NOTE: this only flips the status flag for now. Actually emailing the
    // student their login link/password is a separate step (needs an edge
    // function using GMAIL_APP_PASSWORD, same pattern as your other
    // notification emails) — not wired up yet.
    if (!confirm('This marks the page as handed over. Actually emailing the student their access still needs to be wired up separately — proceed anyway?')) {
      return;
    }
    const { error } = await supabaseClient
      .from('landing_pages')
      .update({ build_status: 'handed_over' })
      .eq('id', pageId);

    if (error) {
      alert('Failed to update: ' + error.message);
      return;
    }
    await loadPages();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
</script>

</body>
</html>
